name: 🩹 gfix field report
description: Auto-generated report from `gald3r gfix` — a failure gald3r detected in ITSELF, using only gald3r's own surfaces.
title: "[gfix]: "
labels: ["field-report"]
body:
  - type: markdown
    attributes:
      value: |
        This report was generated by `gald3r gfix` (task833's "gfix v1" pipeline) and reviewed by you
        before filing. It is auto-redacted (usernames/home paths, hostnames, project names, env
        values, and known secret-shaped patterns are scrubbed before the draft is ever shown to you)
        and never carries repo contents, user code, or project paths beyond anything you explicitly
        chose to attach.

        There is deliberately no priority/severity field below — severity is scored on gald3r's own
        rubric at harvest time, not by the reporter.

  - type: input
    id: version
    attributes:
      label: gald3r version
      description: Filled from the running binary's own version.
      placeholder: "5.0.0-beta.15"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - "Windows (x64)"
        - "macOS (Apple Silicon / arm64)"
        - "macOS (Intel / x64)"
        - "Linux (x64)"
        - "Linux (arm64)"
        - "Other / multiple"
    validations:
      required: true

  - type: input
    id: terminal_state
    attributes:
      label: Terminal state / failure class
      description: The run's terminal state and gfix failure-class at the moment of the trigger (e.g. "STALLED / watchdog_kill").
    validations:
      required: true

  - type: input
    id: fingerprint
    attributes:
      label: Fingerprint
      description: The failure-signature hash `gald3r gfix` computed (version + terminal_state + failure class). Used for automatic dedup — please don't edit this.
    validations:
      required: true

  - type: textarea
    id: report_body
    attributes:
      label: Full report
      description: The redacted evidence bundle `gald3r gfix` assembled — summary, environment, what was redacted, and evidence.
      render: markdown
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the redacted report below and it does not contain secrets, repo contents, or anything else I don't want to share.
          required: true
