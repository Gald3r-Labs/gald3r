name: 🐛 Bug report
description: Something in gald3r isn't working the way it should.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The three dropdowns below — **which component**, **which platform you run it in**,
        and **which OS** — are the most useful thing you can give us. They route the report to the right place fast.

  - type: dropdown
    id: component
    attributes:
      label: Which component?
      description: Which binary or app is misbehaving? "Not sure" is a fine answer.
      options:
        - "gald3r (the CLI)"
        - "gald3rw (Windows MCP launcher — no-console)"
        - "gald3r-mcp (MCP server)"
        - "gald3r-api (HTTP API host)"
        - "gald3r-hearth (loopback cache)"
        - "gald3r-acp (editor / ACP host)"
        - "gald3r-valkyrie (world_tree connector)"
        - "Longship (terminal UI)"
        - "Throne (desktop app)"
        - "The installed overlay (skills / rules / commands / hooks in my IDE)"
        - "Multiple / the whole install"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: AI platform / IDE in use
      description: Where are you running gald3r? gald3r installs into all of these — the overlay differs per platform, so this matters.
      options:
        - "Claude Code"
        - "Cursor"
        - "GitHub Copilot"
        - "Codex CLI (OpenAI)"
        - "OpenCode (sst.dev)"
        - "Windsurf"
        - "Cline (VS Code)"
        - "Roo Code"
        - "Aider"
        - "Augment Code"
        - "Gemini CLI"
        - "Kiro (Amazon)"
        - "Goose (Block)"
        - "JetBrains Junie"
        - "Warp Terminal"
        - "OpenHands / OpenDevin"
        - "Replit Agent"
        - "Mistral Vibe"
        - "Qwen Code"
        - "gald3r native / standalone (no IDE)"
        - "Multiple platforms"
        - "Other (describe below)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - "Windows (x64)"
        - "macOS (Apple Silicon / arm64)"
        - "macOS (Intel / x64)"
        - "Linux (x64)"
        - "Linux (arm64)"
        - "Other / multiple"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: How did you install it?
      options:
        - "Windows installer (.msi)"
        - "Windows .exe (direct)"
        - "macOS installer (.pkg)"
        - "macOS binary (direct)"
        - "Linux tarball (install.sh)"
        - "Linux package (.deb)"
        - "Homebrew"
        - "npm (@gald3r/cli)"
        - "Built from source"
        - "Other / not sure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "First line of `gald3r --version` (e.g. `gald3r version 5.0.0-beta.1`)."
      placeholder: "gald3r version 5.0.0-beta.1"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong? Screenshots welcome.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or clicks. If we can reproduce it, we can fix it.
      placeholder: |
        1. gald3r ...
        2. ...
        3. see error

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: "Paste terminal output or the error. Auto-formatted as code — no backticks needed."
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release (or I've said which version above).
          required: true
        - label: This is not a security vulnerability (those go to a private advisory, not here).
          required: true
