name: Validate release metadata

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to check (does not publish)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Check existing release metadata (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the read-only metadata contract
        run: python -B -m unittest discover -s tests -p 'test_check_release_metadata.py'
      # The private unified release pipeline owns draft notes, assets and
      # publication coordination. This repository must not regenerate a body,
      # change historical beta/prerelease flags, or publish on tag arrival.
      # Full inventory/hash validation belongs to that single private gate.
      - name: Check existing notes and download metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python -B .github/scripts/check_release_metadata.py --tag "$RELEASE_TAG"
