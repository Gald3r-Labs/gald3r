name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          # Looks for ## [VERSION] through the next ## [ line
          awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release_notes.txt
          # Trim leading/trailing blank lines
          sed -i '/./,$!d' release_notes.txt
          echo "Release notes extracted for v$VERSION"
          cat release_notes.txt

      # The files live on Gald3r-Labs/gald3r_core, not here. Without this step a
      # reader who clicks a release on this repo finds notes and nothing to
      # download -- which is exactly what happened for all 72 releases before it
      # existed. release_download_block.py builds the header from the matching
      # engine release's REAL asset list, so it can never link to a file that is
      # not published; a tag with no engine release degrades to a pointer at the
      # newest one rather than a dead link.
      - name: Prepend download links to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_download_block.py "${GITHUB_REF_NAME}" --out download_block.md
          cat download_block.md release_notes.txt > body.md
          mv body.md release_notes.txt
          echo "--- final release body ---"
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "gald3r v${{ steps.version.outputs.version }}"
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          # Betas publish as LATEST, not prerelease (owner ruling 2026-08-09:
          # /releases/latest download links + the dynamic version badge must
          # follow betas). Only -rc/-alpha stay prerelease.
          make_latest: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha')) }}
