version: 1.0.0
title: g-task-del
description: Purge a task that was created in the WRONG repository (a routing error).
  Runs the compiled
instructions: "Purge a task that was created in the WRONG repository (a routing error).\
  \ Runs the compiled\n**`gald3r task delete`** verb (T497 -- backs g-rl-33's Routing\
  \ Error Hard Delete rule, which\npreviously had no deterministic implementation).\n\
  \n```\n@g-task-del T53 --reason \"Created in the wrong repo; canonical copy is T12\
  \ in gald3r_world_tree\"\n@g-task-del T53 --reason \"...\" --apply\n```\n\n## What\
  \ This Command Is For\n\n**Only for genuine routing errors** -- a task file that\
  \ should never have existed in this\nrepository at all, because the correct owning\
  \ repository is a different one. This is NOT a\ngeneral-purpose \"cancel this task\"\
  \ or \"I changed my mind\" command:\n\n- Task no longer wanted, superseded, or deprioritized\
  \ -> use `@g-task-upd` to set an appropriate\n  status; the record stays as history.\n\
  - Task was created in the wrong repo -> THIS command.\n\n## What This Command Does\n\
  \nPer g-rl-33's \"Routing Error Hard Delete\" rule, the ONLY correct response to\
  \ a routing error is\nan unconditional `git rm` + commit -- **never** a `cancelled`\
  \ stub, a `moved`/`routed` status, or\na forwarding pointer (those actively mislead\
  \ other agents reading across repos into thinking a\ndeliberate cancellation decision\
  \ was made). `gald3r task delete`:\n\n1. Locates the task file and requires a non-empty\
  \ `--reason` (dry-run or apply -- always).\n2. `git rm`s the file (falls back to\
  \ a plain filesystem delete if the file was never\n   git-tracked).\n3. Removes\
  \ the task's row from `gald3r.db` (plus its `task_deps` edges) so `gald3r db verify`\n\
  \   never reports an `orphan_row` for it.\n4. Regenerates `TASKS.md` so it no longer\
  \ links to the removed file.\n5. Commits with message `chore(tasks): purge T{id}\
  \ routing error`, including the `--reason` text\n   and a `Task: #{id}` trailer.\n\
  \n**Before running `--apply`:** create the canonical task in the CORRECT repository\
  \ first (with an\nAgent Notes entry referencing any prototype work done here), per\
  \ g-rl-33's full protocol.\n\n## Flags\n\n| Flag | Effect |\n|---|---|\n| (none)\
  \ | Dry-run preview -- reports the file, any tasks still depending on it, and the\
  \ commit message that would be used. Writes nothing. |\n| `--apply` | Actually `git\
  \ rm` the file, remove the DB row, and commit. |\n| `--reason TEXT` | **Required**\
  \ (both dry-run and apply) -- the auditable \"why\" for the purge. |\n| `--json`\
  \ | Machine-readable report. |\n\n## Safety\n\n- Dry-run is the default -- `--apply`\
  \ is required to write or commit anything.\n- Never a soft-delete/cancelled stub:\
  \ g-rl-33 forbids that alternative outright.\n- If other on-disk tasks still list\
  \ this id as a `dependencies:` entry, the report/output warns\n  -- the delete proceeds\
  \ anyway (routing-error deletion is unconditional per the rule), but\n  those referencing\
  \ tasks' dependency lists need a follow-up fix."
prompt: Run the gald3r `g-task-del` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-task-del, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
