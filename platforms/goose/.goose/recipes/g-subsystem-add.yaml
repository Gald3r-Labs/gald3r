version: 1.0.0
title: g-subsystem-add
description: Add a new subsystem to the registry. Activates **g-skl-subsystems** →
  CREATE SUBSYSTEM SPEC operation.
instructions: 'Add a new subsystem to the registry. Activates **g-skl-subsystems**
  → CREATE SUBSYSTEM SPEC operation.


  ```

  @g-subsystem-add "subsystem-name"

  @g-subsystem-add "voice-speech-system" --status planned --tier adv

  ```


  Creates `.gald3r/subsystems/subsystem-name.md` spec file and adds entry to `SUBSYSTEMS.md`
  registry.

  The skill prompts for: name, responsibility, dependencies, dependents, locations
  (files/folders/skills).'
prompt: Run the gald3r `g-subsystem-add` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-subsystem-add, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
