version: 1.0.0
title: g-wpac-status
description: 'Show cross-project coordination status: $ARGUMENTS'
instructions: "Show cross-project coordination status: $ARGUMENTS\n\n## What This\
  \ Command Does\n\nDisplays the full WPAC (Project Command and Control) status: this\
  \ project's topology role, linked project health, open INBOX summary, and constraint\
  \ overlap with peers. Delegates to `g-agnt-wpac-coordinator`.\n\n## Output Format\n\
  \n```\nWPAC STATUS — {project_name}\n────────────────────────────────────────\n\
  Role: {parent | child | sibling | standalone}\nProject: {project_path}\n\nParent:\
  \ {name} at {path} [accessible ✅ | inaccessible ⚠️ | none]\n\nChildren ({N}):\n\
  \  - {name} at {path} [accessible ✅ | inaccessible ⚠️]\n\nSiblings ({N}):\n  - {name}\
  \ at {path} [accessible ✅ | inaccessible ⚠️]\n\n────────────────────────────────────────\n\
  INBOX: {N open items}\n  {c} conflicts  ⚠️  (BLOCKS all other coordination work)\n\
  \  {r} requests\n  {b} broadcasts\n  {s} syncs\n\n────────────────────────────────────────\n\
  LOCAL CAPABILITIES\n  Responsibilities: {N ready}\n  Capabilities: {N ready}, {N\
  \ planned}, {N deprecated}\n  (Full manifest: .gald3r/linking/capabilities.md)\n\
  \nPEER CAPABILITIES (last received snapshots)\n  {peer_name}: {N ready capabilities}\
  \ — last updated {date}\n  {peer_name}: no snapshot yet ⚠️\n\n────────────────────────────────────────\n\
  CROSS-PROJECT DEPENDENCIES\n\n### Awaiting (parent waiting on child)\n| Order ID\
  \   | Sent To        | Remote Task                  | Status      | Days Out |\n\
  |------------|----------------|------------------------------|-------------|----------|\n\
  | ord-abc123 | example_app | Implement JWT auth endpoint  | in-progress | 3    \
  \    |\n\n### Blocking (this project has received orders blocking a parent)\n| Order\
  \ ID   | From Parent   | Our Local Task        | Status      |\n|------------|---------------|-----------------------|-------------|\n\
  | ord-xyz789 | <gald3r_source>    | vault-sync endpoint   | in-progress |\n\n────────────────────────────────────────\n\
  CONSTRAINT OVERLAP\n  This project: {N total} ({N ecosystem-wide}, {N inheritable})\n\
  \  Parent has: {N ecosystem-wide constraints} — {N missing from this project} ⚠️\
  \ [or \"— in sync ✅\"]\n  Inherited constraints: {N} (from {source_project})\n \
  \ Action: [none needed | run @g-wpac-sync to inherit N missing constraints]\n────────────────────────────────────────\n\
  ```\n\n## Workflow\n\n### 1. Load Topology\nRead `.gald3r/linking/link_topology.md`.\n\
  \nIf missing → \"Topology not configured. Complete task007 to set up the linking/\
  \ directory.\"\n\n### 2. Check Project Accessibility\nFor each linked project, check\
  \ if path is accessible on the current machine.\n\n### 3. Read INBOX\nRead `.gald3r/linking/INBOX.md`\
  \ and count items by type.\n\n### 4. Read Local Capabilities\nRead `.gald3r/linking/capabilities.md`\
  \ if it exists. Count ready responsibilities, ready/planned/deprecated capabilities.\n\
  If missing → \"(capabilities.md not found — run @g-wpac-read or create it)\"\n\n\
  ### 5. Read Peer Capability Snapshots\nRead all files matching `.gald3r/linking/_peers/*_capabilities.md`.\
  \ For each: extract project slug, count ready capabilities, get last_updated date.\n\
  \n### 6. Cross-Project Dependencies Check\n\n**Awaiting** (this project has dispatched\
  \ orders to children/peers):\n1. List `.gald3r/linking/sent_orders/order_*.md`\n\
  2. For each: read frontmatter — extract `order_id`, `sent_to`, `remote_task_title`,\
  \ `status`, `sent_at`, `last_sync`\n3. Filter to records where `status` ∈ {`sent`,\
  \ `acknowledged`, `in-progress`, `blocked`} (i.e., not `completed` or `timed-out`)\n\
  4. Compute `days_out` = today − `sent_at`\n5. If non-empty: render the **Awaiting**\
  \ table; otherwise display: `(no awaiting cross-project dependencies)`\n\n**Blocking**\
  \ (this project has accepted orders from a parent that have local tasks gating on\
  \ them):\n1. Scan `.gald3r/tasks/task*.md` and `.gald3r/features/feat*.md` for any\
  \ file with a `cross_project_ref:` array\n2. For each entry where `status ≠ completed`:\
  \ extract `order_id`, `project` (the parent that sent the order), the local task/feature\
  \ title, and the cached `status`\n3. Render the **Blocking** table; otherwise display:\
  \ `(no blocking cross-project dependencies)`\n\nSkip silently when both folders\
  \ are empty / no `cross_project_ref:` fields exist.\n\n### 7. Constraint Overlap\
  \ Check\n1. Read local `CONSTRAINTS.md` — count ecosystem-wide and inheritable constraints\n\
  2. If parent is accessible: read parent's `CONSTRAINTS.md` — find ecosystem-wide\
  \ constraints not present in local file\n3. Count constraints with `**Inherited\
  \ from**:` field (already propagated from peers)\n4. If any parent ecosystem-wide\
  \ constraints are missing locally: show count + recommendation\n\nSkip silently\
  \ if parent is inaccessible or CONSTRAINTS.md has no `**Scope**:` fields.\n\n###\
  \ 8. Report\nDisplay the full status block above. If CONFLICTs exist, recommend\
  \ running `@g-wpac-read` immediately.\n\n## Usage Examples\n\n```\n@g-wpac-status\n\
  ```\n\n## Delegates To\n`g-agnt-wpac-coordinator`"
prompt: Run the gald3r `g-wpac-status` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-wpac-status, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
