version: 1.0.0
title: g-wpac-order
description: 'Push a task or directive to child projects: $ARGUMENTS'
instructions: 'Push a task or directive to child projects: $ARGUMENTS


  ## What This Command Does


  Broadcasts a task order from this parent project to one or more child projects using
  the WPAC (Project Command and Control) topology. Uses `g-skl-wpac-order`.


  ## Workflow


  ### 1. Load Topology

  Read `.gald3r/linking/link_topology.md` to identify children.


  ### 2. Determine Target

  ```

  - all children

  - specific children (provide names)

  - by subsystem filter

  ```


  ### 3. Collect Order Details

  - **Title**: what needs to be done

  - **Why**: context and reasoning

  - **Subsystems**: which areas are affected

  - **Cascade depth**: 1 = direct children only, 2 = children + grandchildren, 3 =
  full subtree


  ### 4. Conflict Check

  Before writing, check each target child''s INBOX.md for existing CONFLICTs.


  ### 5. Dispatch

  For each accessible child:

  - Create task file in `{child}/.gald3r/tasks/`

  - Update `{child}/.gald3r/TASKS.md`

  - Append `[BROADCAST]` entry to `{child}/.gald3r/linking/INBOX.md`


  ### 6. Report

  Show results: ✅ created / ⚠️ conflict / ❌ inaccessible


  ## Usage Examples


  **Order to all children:**

  ```

  @g-wpac-order update vault schema to v2

  ```


  **Order to specific child:**

  ```

  @g-wpac-order example_mcp: add oracle connection pool task

  ```


  **With cascade:**

  ```

  @g-wpac-order cascade:2 update AGENTS.md format

  ```


  ## Delegates To

  `g-skl-wpac-order`'
prompt: Run the gald3r `g-wpac-order` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-wpac-order, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
