version: 1.0.0
title: g-res-review
description: g-res-review
instructions: "# g-res-review\n\nReview existing recon reports in `vault/research/CRR_FunctionalSpecs/`\
  \ and triage features for adoption.\n\nActivates **g-skl-res-review** → REVIEW operation.\n\
  \n> **Replaces**: `@g-harvest --review` (that mode is now `@g-res-review`)\n\n##\
  \ Usage\n\n```\n@g-res-review                          # list all available recon\
  \ reports\n@g-res-review {slug}                   # review a specific report\n@g-res-review\
  \ --all-unadopted          # surface all unadopted suggestions across reports\n\
  ```\n\n## What it does\n\n1. Scans `vault/research/CRR_FunctionalSpecs/` for `04_FEATURES.md`\
  \ files\n2. Presents unadopted features for user triage:\n   - `[✅]` approve → mark\
  \ for `@g-res-apply`\n   - `[❌]` reject → flag as dismissed\n   - `[⏸]` defer →\
  \ skip in APPLY, surface again next review cycle\n3. Shows feature counts, source\
  \ repos, and time-since-last-review per report\n4. If `--topology-aware` (requires\
  \ T118): cross-references capabilities.md to suggest `--target` routing\n\n## Zero-change-without-approval\
  \ guarantee\n\n`@g-res-review` **never modifies `.gald3r/`** — it only updates approval\
  \ status markers in the\n`vault/research/CRR_FunctionalSpecs/{slug}/04_FEATURES.md`\
  \ review columns.\n\n## Clean Room Boundary\n\nThese commands support clean-room\
  \ research and reverse-spec work. Capture/recon may observe and summarize source\
  \ behavior, interfaces, workflows, data shapes, and architectural patterns; generated\
  \ gald3r artifacts must use original wording and local architecture terms, not copied\
  \ source code, docs prose, prompts, tests, or unique strings. Keep source URL, license,\
  \ and capture provenance in recon notes; treat source file paths as traceability,\
  \ not implementation instructions. Adoption requires human approval through `@g-res-review`\
  \ / `@g-res-apply`.\n\n## See Also\n\n- `@g-res-deep` — Run the deep analysis pass\
  \ to generate a recon report\n- `@g-res-apply` — Apply approved features to `.gald3r/`"
prompt: Run the gald3r `g-res-review` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-res-review, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
