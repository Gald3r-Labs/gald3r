version: 1.0.0
title: g-wrkspc-member-add
description: 'Add a Workspace-Control member to the manifest: $ARGUMENTS'
instructions: 'Add a Workspace-Control member to the manifest: $ARGUMENTS


  ## What This Command Does


  Plans or applies a registry-only member addition in `.gald3r/linking/workspace_manifest.yaml`.
  Delegates to `g-skl-workspace` operation `MEMBER_ADD_PLAN` by default, or `MEMBER_ADD_APPLY`
  only with `--apply`.


  ## Required Arguments


  - `<path>` or `--path <path>`

  - `--id <repo_id>`

  - `--role <control_project|controlled_member|migration_source>`


  ## Workflow


  1. Activate `g-skl-workspace`.

  2. Run `MEMBER_ADD_PLAN` unless `$ARGUMENTS` includes `--apply`.

  3. Validate repo ID pattern, duplicate IDs, local path, symlink/junction state,
  git root, branch, dirty status, remotes, and worktree context.

  4. If path is inside the control project, require `--role migration_source` or block.

  5. In apply mode, update only the manifest registry.


  ## Safety Boundaries


  - Dry-run is default.

  - Apply does not create folders, initialize git, set remotes, copy files, or write
  into the member path.

  - Controlled members default to write-blocked until a later task explicitly authorizes
  writes.


  ## Usage Examples


  ```

  @g-wrkspc-member-add <ECOSYSTEM_ROOT>/<template_full> --id <template_full> --role
  controlled_member --dry-run

  @g-wrkspc-member-add <ECOSYSTEM_ROOT>/<template_full> --id <template_full> --role
  controlled_member --apply

  ```'
prompt: Run the gald3r `g-wrkspc-member-add` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-wrkspc-member-add, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
