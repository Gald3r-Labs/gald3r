version: 1.0.0
title: g-wpac-spawn
description: 'Spawn a new gald3r project from this project with full setup and WPAC
  topology linking: $ARGUMENTS'
instructions: 'Spawn a new gald3r project from this project with full setup and WPAC
  topology linking: $ARGUMENTS


  ## What This Command Does


  Creates a new project in the same ecosystem root, installs gald3r (matching this
  project''s

  install style), seeds it with the provided description/features/code, runs gald3r-setup

  subsystem discovery, and immediately registers the WPAC topology link in both projects.


  Delegates to `g-skl-wpac-spawn`.


  ## Usage


  ```

  @g-wpac-spawn <new_project_name> --sibling [options]

  @g-wpac-spawn <new_project_name> --child [options]

  @g-wpac-spawn <new_project_name> --parent [options]

  ```


  **Options:**

  - `--description "..."` — one-line mission for the new project

  - `--features <path>` — features subfolder to transfer (e.g. `.gald3r/features/gald3r_backend`)

  - `--code <path>` — code folder(s) to copy into the new project

  - `--template slim|full|adv` — gald3r template tier (default: matches current)

  - `--dry-run` — preview only, no changes


  ## Examples


  ```

  # Create a sibling backend project seeded with backend features

  @g-wpac-spawn example_app --sibling --description "Single-user Docker backend" --features
  .gald3r/features/gald3r_backend


  # Create a child project for a payment subsystem with code

  @g-wpac-spawn gald3r_payments --child --description "Payment processing" --code
  src/payments/


  # Dry run to preview what would be created

  @g-wpac-spawn gald3r_analytics --sibling --description "Analytics service" --dry-run

  ```


  ## What Happens


  1. Validates ecosystem root and checks new project name doesn''t conflict

  2. Detects current project''s gald3r install style (symlink vs copy)

  3. Creates new project folder + git repo

  4. Installs gald3r (rules, skills, templates) matching current project''s style

  5. Generates `.gald3r/.identity`, `PROJECT.md`, `PLAN.md`, `TASKS.md`, and all scaffolding

  6. Transfers features/code (if specified) and builds FEATURES.md index

  7. Runs subsystem discovery on transferred content

  8. Initializes WPAC topology in both projects (bidirectional)

  9. Creates initial git commit in new project

  10. Asks about source cleanup (keeps originals until confirmed)


  ## Completion Gate (Step 9.5)


  Before the initial commit (step 9 above), the underlying `g-skl-wpac-spawn` skill
  runs a

  deterministic completion check instead of trusting a hand-read of the new project''s
  folder

  tree — the Step 9.5 **Completion Gate** (BUG-223). It shells out to the CLI verb
  directly:


  ```powershell

  gald3r workspace member verify-spawn --target "<new_project_path>" --source "<current_project_path>"

  ```


  Exit code `0` means the canonical `.gald3r/` shape plus Steps 4/7/8(/9) artifacts
  are all

  present; a non-zero exit prints every missing item by name and blocks the commit
  until each

  one is fixed (add `--json` for machine-readable output). See `g-skl-wpac-spawn/SKILL.md`

  Step 9.5 for the full manual checklist and the BUG-223 incident this gate exists
  to prevent.


  **Step 7 verification note (T379)**: the `verify-spawn` Step 7 check is existence-only
  (does

  `.gald3r/subsystems/` exist + does `SUBSYSTEMS.md` exist), not content-based. This
  is

  deliberate — a legitimate spawn of an empty/code-free sibling project has an empty

  `subsystems/` by design, and a naive "must be non-empty" rule would false-fail it.
  See the

  `_check_step7` comment in

  `src/gald3r_core/coordination/workspace_member/verify_spawn.py` for the full rationale
  on

  why content-based verification was considered and explicitly declined.


  ## Companion Commands


  | Command | When to Use |

  |---------|-------------|

  | `@g-wpac-spawn` | Create a new project from this one |

  | `@g-wpac-send-to` | Transfer content to an existing related project |

  | `@g-wpac-adopt` | Link an existing project as a child (no spawn) |

  | `@g-wpac-claim` | Link an existing project as a parent (no spawn) |'
prompt: Run the gald3r `g-wpac-spawn` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-wpac-spawn, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
