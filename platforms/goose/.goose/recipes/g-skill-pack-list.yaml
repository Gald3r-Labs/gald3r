version: 1.0.0
title: g-skill-pack-list
description: g-skill-pack-list — List available skill packs and install status
instructions: "# g-skill-pack-list — List available skill packs and install status\n\
  \nShow all available skill packs from `.gald3r_sys/skill_packs/` along with which\
  \ packs\nand individual skills are currently installed in this project.\n\n## Steps\n\
  \n1. Read `.gald3r/.identity` for `installed_skill_packs:` block\n2. Scan `.gald3r_sys/skill_packs/`\
  \ for all pack directories with a `PACK.md`\n3. For each pack, read `name`, `version`,\
  \ `tier`, skill list from PACK.md\n4. Compare against installed state to determine:\
  \ installed / available / update-available\n5. Display:\n\n```\nAvailable Skill\
  \ Packs\n=====================\n\n  PACK              TIER    VERSION   INSTALLED\
  \    SKILLS\n  3d-graphics       adv     1.0.0     —            skl-3d-performance,\
  \ skl-algorithmic-art, ...\n  ai-media          adv     1.2.0     1.2.0 ✅     skl-higgsfield,\
  \ skl-seedance\n  cloud-providers   full    1.0.0     0.9.0 ⬆     (update available)\n\
  \  community         slim    1.0.0     1.0.0 ✅     skl-discord, skl-slack, skl-telegram\n\
  \  ...\n\nInstalled packs: 3  |  Available: 7\nUse: g-skill-pack-add <pack> [--skill\
  \ <name>]  to install\n```\n\n6. For installed packs, show individual skill status\
  \ including `_evolved` badges"
prompt: Run the gald3r `g-skill-pack-list` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-skill-pack-list, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
