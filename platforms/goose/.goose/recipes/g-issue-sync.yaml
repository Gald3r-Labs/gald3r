version: 1.0.0
title: g-issue-sync
description: 'Two-way sync between gald3r tasks and GitHub Issues: $ARGUMENTS'
instructions: "Two-way sync between gald3r tasks and GitHub Issues: $ARGUMENTS\n\n\
  Wraps **`g-skl-github-pr LINK_ISSUE`** plus issue read/update logic (T1290). Part\
  \ of\nthe optional GitHub Integration Bundle. Lets either side — a teammate in the\
  \ GitHub\nUI or an agent in gald3r — drive the work without losing the other side's\
  \ edits.\n\n## Gate (first)\n\nRun the `g-skl-github-pr` gate. If `github_integration:\
  \ disabled`, wrong `project_type`,\nor `gh` missing → **no-op** with a friendly\
  \ message.\n\n## Modes\n\n| Invocation | Action |\n|---|---|\n| `g-issue-sync pull`\
  \ | Fetch open issues; create a gald3r task for any without a matching `issue_ref`.\
  \ |\n| `g-issue-sync push` | Push open tasks (`[\U0001F4CB]`/`[\U0001F504]`) without\
  \ `issue_ref` as new GitHub Issues. |\n| `g-issue-sync update <task_id>` | Sync\
  \ one task's state to its linked issue. |\n| `g-issue-sync` (no args) | Interactive\
  \ triage of new + changed items. |\n\n## Field mapping\n\n- `task.title` ↔ `issue.title`\n\
  - `task.priority` ↔ label `priority:high|medium|low`\n- `task.type` ↔ label `type:feature|bug_fix|…`\n\
  - `task.status` ↔ issue state (open/closed) + label `status:awaiting-verification`\
  \ etc.\n- task body ←→ issue body (one direction per sync; never round-trip the\
  \ same edit)\n\n## Conflict resolution\n\n1. Compare `task.last_synced_at` (frontmatter)\
  \ against `issue.updated_at`.\n2. Newer side wins **by default**.\n3. If **both**\
  \ changed since the last sync → surface the diff to the user and\n   **never auto-overwrite**\
  \ without confirmation.\n\n## Flags\n\n| Flag | Effect |\n|---|---|\n| `--dry-run`\
  \ | Show the sync plan without writing either side |\n| `--repo <owner/name>` |\
  \ Override `github_repo` |\n| `--label-filter <label>` | Only sync issues carrying\
  \ this label |\n| `--no-create` | Update only; never create new tasks/issues |\n\
  \n## Notes\n\n- New WPAC/issue-derived tasks follow normal `g-skl-tasks` CREATE\
  \ rules; populate\n  `issue_ref`, `integration_scope: github`, and `last_synced_at`.\n\
  - Edge cases to handle: issue closed externally while task is `[\U0001F504]`; task\
  \ cancelled\n  while issue still open; issue reopened. Surface, don't silently diverge.\n\
  - See `g-skl-github-pr` for the issue-link operation contract."
prompt: Run the gald3r `g-issue-sync` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-issue-sync, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
