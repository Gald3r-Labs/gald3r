version: 1.0.0
title: g-res-deep
description: "\uFEFF---"
instructions: "\uFEFF---\ndescription: Deep analysis of a captured repo, URL, or vault\
  \ note — produces a structured recon report. Agents are reporters; humans are editors.\n\
  subsystem_memberships: [VAULT_AND_RESEARCH]\nexecution_tier: guarded_prompt\n---\n\
  # g-res-deep\n\nActivates `g-skl-res-deep`. Performs a 5-pass deep analysis of any\
  \ external repository or\ncaptured vault content and produces `vault/research/CRR_FunctionalSpecs/{slug}/`\
  \ — no `.gald3r/` writes\nuntil you run `@g-res-apply`.\n\n> **Replaces**: `@g-reverse-spec`\
  \ (deprecated alias — prints warning, then calls this)\n\n```\n@g-res-deep ANALYZE\
  \ https://github.com/user/repo\n@g-res-deep ANALYZE vault:research/repos/owner__repo.md\n\
  @g-res-deep RESUME user__repo\n@g-res-deep APPLY user__repo\n@g-res-deep APPLY --dry-run\
  \ user__repo\n@g-res-deep STATUS user__repo\n```\n\n**Passes**: Skeleton → Module\
  \ Map → Feature Scan → Deep Dives → Synthesis\n\n**Reporter rule**: Document everything.\
  \ Never filter by \"gald3r already has this.\"\n\n## Output\n\nWrites to `vault/research/CRR_FunctionalSpecs/{slug}/`:\n\
  - `01_skeleton.md` — repo structure + tech fingerprint\n- `02_module_map.md` — module/component\
  \ decomposition\n- `03_feature_scan.md` — raw feature inventory\n- `04_FEATURES.md`\
  \ — structured feature list (input for `@g-res-apply`)\n- `05_synthesis.md` — adoption\
  \ recommendations\n\n## Clean Room Boundary\n\nThese commands support clean-room\
  \ research and reverse-spec work. Capture/recon may observe and summarize source\
  \ behavior, interfaces, workflows, data shapes, and architectural patterns; generated\
  \ gald3r artifacts must use original wording and local architecture terms, not copied\
  \ source code, docs prose, prompts, tests, or unique strings. Keep source URL, license,\
  \ and capture provenance in recon notes; treat source file paths as traceability,\
  \ not implementation instructions. Adoption requires human approval through `@g-res-review`\
  \ / `@g-res-apply`.\n\n## See Also\n\n- `@g-recon-repo` — Lightweight capture first\
  \ (then `--deep` or this command)\n- `@g-res-review` — Review existing recon reports\n\
  - `@g-res-apply` — Apply approved features to .gald3r/"
prompt: Run the gald3r `g-res-deep` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-res-deep, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
