version: 1.0.0
title: g-cli-copilot
description: g-cli-copilot — GitHub Copilot CLI
instructions: '# g-cli-copilot — GitHub Copilot CLI


  Activate `g-skl-cli-copilot` for GitHub Copilot CLI operations.


  Use when:

  - Setting up gald3r workspace instructions for Copilot users

  - Generating or regenerating `.github/copilot-instructions.md`

  - Invoking `gh copilot suggest` or `gh copilot explain`

  - Configuring Copilot in a gald3r project (Phase 1 compatible target)

  - Understanding Copilot Phase 1 vs Phase 2 capabilities


  ## Actions


  - **Generate instructions**: run `python .claude/skills/g-skl-platform-copilot/scripts/generate_copilot_instructions.py`
  (path relative to the installed skills root -- `.cursor/skills/...` etc. on other
  platforms)

  - **Suggest command**: `gh copilot suggest --target {shell|git|gh} "{description}"`

  - **Explain command**: `gh copilot explain "{command}"`

  - **Status**: confirm `gh auth status` + Copilot subscription active


  Read and follow `g-skl-cli-copilot/SKILL.md` for full reference.'
prompt: Run the gald3r `g-cli-copilot` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-cli-copilot, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
