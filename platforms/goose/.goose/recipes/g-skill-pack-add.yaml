version: 1.0.0
title: g-skill-pack-add
description: g-skill-pack-add — Install a skill pack or individual skill
instructions: "# g-skill-pack-add — Install a skill pack or individual skill\n\nInstall\
  \ all skills from a pack, or a single named skill from a pack.\n\n## Usage\n\n```\n\
  g-skill-pack-add <pack-name>                  Install all skills in the pack\ng-skill-pack-add\
  \ <pack-name> <skill-name>     Install one skill from the pack\n```\n\n## Steps\n\
  \n1. Validate `<pack-name>` exists in `.gald3r_sys/skill_packs/`\n2. If `<skill-name>`\
  \ given, validate it exists in `<pack-name>/source/skills/`\n3. Detect active platforms\
  \ via helper: check which IDE folders exist in project root\n3b. **Trust-level provenance\
  \ warning (C-032 — non-blocking)**: read each skill's `skill_trust_level:` frontmatter.\
  \ For every skill whose value is `community` or unset, surface a warning **before**\
  \ install proceeds:\n   ```\n   ⚠️  Skill '<skill-name>' — trust level: <community\
  \ | unset>\n       Source: <pack-name>\n       Its `allowed-tools:` boundary still\
  \ applies, but this skill is not gald3r-core.\n       Inspect the skill body before\
  \ its first invocation.\n   ```\n   This is advisory only — installation continues\
  \ after the warning. `core` and `local` skills install without a warning. (Canonical\
  \ wording: `skl-skill-create/SKILL.md` → `### skill_trust_level:` declaration.)\n\
  4. Run install:\n   ```powershell\n   .gald3r_sys/skill_packs/<pack-name>/install.py\
  \ --project-root . [--skill <skill-name>]\n   ```\n5. Update `.gald3r/.identity`\
  \ `installed_skill_packs:` block:\n   - If pack not listed: add entry with `pack`,\
  \ `version`, `skills`, `installed_date`\n   - If pack listed: add/update the skill\
  \ entry; update `version` if installing whole pack\n6. Confirm what was installed\
  \ and to which platforms\n7. Remind user to restart IDE session\n\n## Notes\n- Adding\
  \ a skill from a pack that is not yet listed creates a partial install entry\n-\
  \ Version is read from pack's `PACK.md` `version:` frontmatter\n- `_evolved` variants\
  \ are preserved — `add` will not overwrite a skill folder with `_evolved` suffix"
prompt: Run the gald3r `g-skill-pack-add` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-skill-pack-add, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
