version: 1.0.0
title: g-go-code
description: 'Implementation-only backlog execution: $ARGUMENTS'
instructions: "Implementation-only backlog execution: $ARGUMENTS\n\n## Mode: IMPLEMENT\
  \ ONLY\n\nThis command runs **coding and bug-fixing** — it does NOT verify. Every\
  \ completed item is\nmarked `[\U0001F50D]` (Awaiting Verification) so a **separate\
  \ agent session** can independently confirm it.\n\n> **Scope is set by the coordinator,\
  \ not here.** Workspace scope (`--local` / `--workspace <id>`\n> / `--workspace`\
  \ / the `g_go_default_scope` config default) is resolved by the `g-go` /\n> `g-go-swarm`\
  \ coordinator at its Auto-Plan Step 1a and handed down as the already-filtered work\n\
  > queue (or explicit task IDs). When `g-go-code` is invoked directly with explicit\
  \ task IDs, it\n> implements exactly those IDs. When invoked directly with no IDs,\
  \ treat the scope as **local-only**\n> — `g-go-code` does not re-evaluate `g_go_default_scope`;\
  \ let `g-go` own the controller-default\n> workspace_all expansion.\n\n## Model-Tier\
  \ Selection (`--mode fast|standard|cheap`)\n\n`g-go-code` accepts an optional `--mode`\
  \ flag in `$ARGUMENTS` that selects the model tier for\nthis session. The flag is\
  \ **advisory**: when running inside Cursor or any IDE that controls\nits own model\
  \ selection, `--mode` is recorded in Status History but the actual model used is\n\
  whatever the IDE is configured for. When running through a CLI that supports model\
  \ override\n(`claude --model ...`, `codex --model ...`), agents map `--mode` to\
  \ the appropriate `--model`\nargument before spawning subagents.\n\n### Mode mapping\
  \ table\n\n| `--mode` | Tier | Claude model | Cursor model | Use when |\n|----------|------|--------------|--------------|----------|\n\
  | `fast` (alias `cheap`) | haiku-class | `claude-haiku-4-5` | `gpt-4o-mini` / `haiku`\
  \ | Simple tasks, cost-sensitive runs, bucket agents on parallel-safe work |\n|\
  \ `standard` (default) | sonnet-class | `claude-sonnet-4-6` | `sonnet-4` | Most\
  \ tasks, coordinator role, anything requiring real reasoning |\n| (no flag) | inherit\
  \ | session default (host-aware, T580: Cursor -> `gpt-5.6-terra-medium` by default\
  \ — see g-go-go.md's \"Provider & Model Routing\") | session default | Fall through\
  \ to the IDE-configured / host-mapped default model |\n\n`cheap` is a strict alias\
  \ for `fast` (same tier, same model mapping). Use whichever reads\nmore naturally\
  \ for the session — they are interchangeable.\n\n### Explicit `--provider`/`--model`\
  \ override (T580, BUG-612 companion)\n\n`$ARGUMENTS` MAY also carry an explicit\
  \ `--provider <provider>[:<model>]` and/or `--model\n<model>` (applies to every\
  \ bucket implementer this session dispatches), plus\n`--implementer-provider`/`--implementer-model`\
  \ for the same thing spelled role-explicitly. These\noutrank both `--mode` and task\
  \ `preferred_model:` (see \"Resolution precedence\" below) — known\nproviders: `claude`,\
  \ `cursor-agent`. When `g-go-code` is dispatched BY a `g-go --swarm`\ncoordinator,\
  \ the coordinator has already resolved this per-role (via\n`GALD3R_GGO_IMPLEMENTER_PROVIDER`/`GALD3R_GGO_IMPLEMENTER_MODEL`\
  \ if set) and this session should\nhonor that rather than re-resolving independently.\n\
  \n### Resolution precedence (highest wins)\n\n1. **Role-specific CLI override**\
  \ — `--implementer-provider`/`--implementer-model` (or the\n   `GALD3R_GGO_IMPLEMENTER_PROVIDER`/`_MODEL`\
  \ env vars a swarm coordinator sets when dispatching\n   this session) (T580).\n\
  2. **Global CLI override** — `--provider`/`--model` in `$ARGUMENTS` (T580).\n3.\
  \ **Invoking host / parent-model mapping** — a detected Cursor host maps to `cursor-agent`\
  \ +\n   `gpt-5.6-terra-medium` by default; Claude Code / unknown hosts stay on `claude`\
  \ (T580,\n   BUG-612 — see g-go-go.md's \"Provider & Model Routing\" for the full\
  \ table).\n4. **Task YAML `preferred_model:`** — if the task being implemented sets\
  \ `preferred_model:`\n   (`haiku` | `sonnet` | `opus` | `fast` | `standard`) in\
  \ its frontmatter, that overrides the\n   session `--mode` for that specific task\
  \ only. Use this to force a complex task onto Opus\n   even when the session is\
  \ running in `fast`, or to keep a trivial follow-up on Haiku even\n   when the session\
  \ is running in `standard`.\n5. **Session `--mode` flag** — when `$ARGUMENTS` contains\
  \ `--mode fast`, `--mode standard`,\n   or `--mode cheap`, that mode applies to\
  \ every queued item that does not override.\n6. **Session default** — when nothing\
  \ above is set, fall through to whatever the host IDE\n   is currently configured\
  \ for (host-mapped per step 3 when detectable). Do not pick a tier\n   silently.\n\
  \n### Status History mode logging (AC5)\n\nWhen the implementation agent claims\
  \ a task and moves it to `[\U0001F504]` / `in-progress` (or\ndirectly to `[\U0001F50D\
  ]` / `awaiting-verification` for fast single-pass items), the claim's Status\nHistory\
  \ row MUST include the resolved mode in its `Message` column. Format:\n\n```\n|\
  \ YYYY-MM-DD HH:MM | pending | in-progress | autopilot-impl | mode=fast — Claimed\
  \ for implementation |\n| YYYY-MM-DD HH:MM | in-progress | awaiting-verification\
  \ | autopilot-impl | mode=standard — Implementation complete; {1-line summary} |\n\
  ```\n\nThe `mode=<tier>` token (`fast`, `standard`, `cheap`, `inherit`) is the audit\
  \ trail.\nReviewers and post-mortem analysis use it to correlate model-tier choice\
  \ with implementation\nquality. Omitting it on the claim row is a procedural violation.\n\
  \n## Implementation-Only Boundary\n\n`g-go-code` and `g-go-code --swarm` must not\
  \ spawn reviewer agents, run `g-go-review`, run `g-go-review-swarm`, or invoke `gald3r-code-reviewer`\
  \ / full adversarial review subagents.\n\nAllowed implementation readiness checks\
  \ are limited to smoke/unit-style evidence:\n- Import/build/typecheck/lint commands\
  \ relevant to the changed files.\n- Focused unit tests or existing fast test gates.\n\
  - Acceptance-criteria self-check against the task or bug spec.\n- Workspace, constraint,\
  \ stub/TODO, and bug-discovery gates required before marking `[\U0001F50D]`.\n\n\
  The output may include a review handoff and checkpoint SHA. It must not perform\
  \ the review. Use `g-go` / `g-go --swarm` for implement-plus-auto-review, or `g-go-review`\
  \ / `g-go-review --swarm` for review-only.\n\n## Completion Signal Contract (T1175)\n\
  \n`g-go-code` MUST NOT mark a task `[\U0001F50D]` (Awaiting Verification) based\
  \ on \"agent feels done\" or \"end of turn\" heuristics. A **completion signal**\
  \ is a structured, file-grounded artifact set that the next-stage reviewer can verify\
  \ cold without re-reading the implementer's reasoning.\n\nA valid completion signal\
  \ consists of **all** of the following — every item is mandatory:\n\n1. **Handoff\
  \ Report section is filled** (T1097) — the task file contains a `## Handoff Report`\
  \ section with all five required subsections populated: `Files Changed`, `Commands\
  \ Run`, `Issues Discovered`, `Left Undone`, `Procedure Compliance`. An empty header\
  \ is not a signal.\n2. **All AC checkboxes resolved** — every `- [ ]` line under\
  \ `## Acceptance Criteria` is either checked (`- [x]`) or explicitly carried out\
  \ and the section ends with no orphan unchecked criteria. Partial implementation\
  \ is a Blocker (Step 6), not a `[\U0001F50D]`.\n3. **DoD Gate passed or explicitly\
  \ SKIPPED** (T1099/T1168) — Step b3.5 ran and the Status History row records `dod_gate:\
  \ PASS` or `dod_gate: SKIPPED (<reason>)`. A `dod_gate: FAIL` row means the signal\
  \ is not yet produced.\n4. **Status History claim + completion row written** — the\
  \ task file `## Status History` has the b3 row (`| YYYY-MM-DD HH:MM | in-progress\
  \ | awaiting-verification | <agent> | mode=<tier> — Implementation complete; <summary>\
  \ |`) appended.\n5. **Post-write lint passed for every modified file** (T919) —\
  \ Step b1 returned exit 0 for each Write/Edit; no syntax errors are outstanding.\n\
  6. **Implementation Plan was locked** (T879) — `## Implementation Plan` exists on\
  \ the task file with `Lock Status: LOCKED`, unless `--skip-plan` was passed and\
  \ the justification is recorded in the session summary. Any `DEVIATION:` notes are\
  \ present on affected steps (not silently rewritten).\n\n**Signal absence handling**:\
  \ if any of the six conditions above is not satisfied, the implementer MUST either\
  \ (a) loop back to the relevant step and complete it, or (b) classify the item as\
  \ Blocked and log it in `## Deferred Items` § Blockers — never silently mark `[\U0001F50D\
  ]`.\n\n**Why this matters**: the next agent (`g-go-review` or any reviewer) reads\
  \ the task file cold and uses these artifacts as the authoritative ground-truth\
  \ for the work claimed complete. Missing signal pieces are the root cause of the\
  \ \"passed review but actually broken\" failure mode.\n\n## Journal Capture on Novel\
  \ Pattern (T1010)\n\nAfter a task reaches `[\U0001F50D]`, IF the implementation\
  \ surfaced a **novel pattern,\ndecision rule, or anti-pattern** worth remembering\
  \ for next time, write **one**\nconcise entry to the active agent's journal:\n\n\
  ```\n{platform}/agents/{slug}/journal/YYYY-MM-DD-{task-ref}-{slug}.md\n```\n\n-\
  \ Frontmatter and 3–10 line body per `{platform}/agents/JOURNAL_FORMAT.md`\n  (`date`,\
  \ `agent`, `task_ref`, `category`, `tags`).\n- Use `category: anti-pattern` for\
  \ mistakes-to-avoid — `g-rl-25` surfaces these\n  prominently at the next session\
  \ start so the same trap is not re-hit.\n- **Not every task earns an entry.** Skip\
  \ routine work; brevity is the point.\n- This is durable, offline, per-agent learning\
  \ (no Docker/DB) and supplements\n  `g-skl-learn`'s project-wide `learned-facts.md`.\
  \ It is **not** part of the\n  mandatory completion signal — a missing journal entry\
  \ never blocks `[\U0001F50D]`.\n\n## Iteration and Timeout Limits (T1175)\n\n`g-go-code`\
  \ accepts dual stop-conditions in `$ARGUMENTS`. **Whichever limit hits first stops\
  \ the run cleanly**; the limit is not a hard kill — it is a soft \"no new claims,\
  \ finish what's in flight, write the summary\" boundary.\n\n| Flag | Default | Override\
  \ env var | Behavior |\n|------|---------|------------------|----------|\n| `--max-iterations\
  \ N` | `5` | `GALD3R_MAX_ITERATIONS` | Maximum number of items the implementer will\
  \ claim and process this session. After N items finish, stop claiming new ones and\
  \ finalize. Counts both PASS and BLOCKED items. |\n| `--timeout-minutes M` | `30`\
  \ | `GALD3R_TIMEOUT_MINUTES` | Wall-clock budget in minutes from the moment the\
  \ work queue is built. When elapsed minutes ≥ M and an item finishes, stop claiming\
  \ new ones and finalize. Does not interrupt an in-flight item mid-edit. |\n\n**Enforcement\
  \ rules:**\n\n- Both limits are advisory at the start of each item, not preemptive.\
  \ The implementer checks them between items, not inside a single item's b/c/d/e/f\
  \ loop.\n- Either limit hitting triggers the **same** finalization path: the in-flight\
  \ item completes naturally (or is logged as Blocked if it cannot finish), then the\
  \ batch status write + checkpoint commit + session summary run as normal.\n- In\
  \ `--swarm` mode the limits apply to the **coordinator's scheduling decisions**:\
  \ max-iterations caps the total items partitioned across all buckets; timeout-minutes\
  \ is a wall-clock fence for the coordinator (bucket agents have no individual timer).\n\
  - Env-var overrides allow per-machine tuning without editing command files (helpful\
  \ for CI vs interactive). Explicit `$ARGUMENTS` flags override env vars.\n- The\
  \ session summary MUST include the stop reason: `Stop reason: queue exhausted |\
  \ max-iterations (N of N) | timeout-minutes (M elapsed) | hard-gate blocker`.\n\n\
  **Why dual limits**: relying on iteration count alone fails when a single complex\
  \ task burns the entire run budget; relying on timeout alone fails when many trivial\
  \ items get cut off without a clean stopping point. Dual limits give a predictable\
  \ upper bound on both attempts and wall-clock.\n\n## Session Resume after Crash\
  \ (`--resume T{id}` — T967)\n\nLong-horizon implementation can be interrupted by\
  \ a process kill, OOM, or power loss. `g-go-code` writes a **continuity artifact**\
  \ at each mid-task checkpoint (step 4a) and the code-complete checkpoint commit\
  \ (step 7b), so a crashed session can resume from the last clean state instead of\
  \ replaying conversation history.\n\nThe continuity artifact (`continuity_artifact.md`,\
  \ written into the task's worktree) is a structured resume summary — **not** a transcript.\
  \ It records: task ID, completed ACs (checked list), pending ACs, last tool summary,\
  \ next planned action, and blockers. It is written **atomically** (temp file + rename)\
  \ and **before** the checkpoint commit, so it survives an interrupt mid-commit.\
  \ It complements `gald3r worktree session` (literal JSONL transcript): the artifact\
  \ answers *\"where was I and what is left\"*.\n\n### Behavior\n\nWhen `$ARGUMENTS`\
  \ contains `--resume T{id}`:\n\n1. **Locate the worktree** for `T{id}` via `gald3r\
  \ worktree resume -TaskId {id} -Role code -Owner {owner}`. The helper reads `.gald3r-worktree.json`\
  \ (`last_checkpoint_sha`, `continuity_artifact_path`) and the worktree's `continuity_artifact.md`.\n\
  2. **Print the resume banner** (verbatim format):\n   ```\n   Resuming from checkpoint\
  \ {sha} — {N} ACs complete, {M} remaining\n   ```\n   `{N}`/`{M}` are the checked\
  \ (`- [x]`) / unchecked (`- [ ]`) AC counts read from the artifact.\n3. **Inject\
  \ the artifact as a context prefix** — the artifact body (returned as `context_prefix`\
  \ under `-Json`) is prepended to the implementation context so the resumed session\
  \ re-grounds on the goal, the ACs already done, and the next planned action before\
  \ claiming new tool work.\n4. **Continue the b/c/d/e/f loop** from the pending ACs.\
  \ The worktree, branch, and `last_checkpoint_sha` are reused — no new worktree is\
  \ created for the resumed task.\n\n```powershell\n# Resume a crashed implementation\
  \ of T824 from its last checkpoint\ngald3r worktree resume -TaskId 824 -Role code\
  \ -Owner cursor -Json\n```\n\nIf no worktree or no `continuity_artifact.md` exists\
  \ for the task, `--resume` reports that there is nothing to resume and falls back\
  \ to a normal (fresh) implementation pass.\n\n## Mid-Flight Course Correction (`/steer`\
  \ + `/queue` — T969)\n\nA running `g-go-code` session does **not** need to be restarted\
  \ to redirect it. Two small files\ndropped into the **worktree root** let a user\
  \ steer the work in flight or queue follow-up work to\nrun after the main goal completes.\
  \ Both files are written by their own commands (`@g-steer`,\n`@g-queue`) and consumed\
  \ by this command at well-defined points in the loop. Like `--resume`, the\nmechanism\
  \ is file-grounded so it survives context compression and works across separate\
  \ sessions.\n\n| File (at worktree root) | Written by | Read by | Lifecycle |\n\
  |---|---|---|---|\n| `steer.md` | `@g-steer T{id} \"...\"` | g-go-code AC-gate poll\
  \ (step b2.5) | One-shot: injected as a steering prompt, then **deleted** |\n| `queue.md`\
  \ | `@g-queue T{id} \"...\"` | g-go-code drain step (step 7d) | Append-only list;\
  \ each `- [ ]` item processed after the main goal completes |\n\nBoth files live\
  \ at the **worktree root** for the task (`<worktree>/steer.md`, `<worktree>/queue.md`),\n\
  i.e. the per-branch isolated checkout created by `gald3r worktree create`. The\n\
  worktree helper owns all reads/writes so the file format and locating logic stay\
  \ in one place:\n\n```powershell\n# @g-steer writes (overwrite — latest steer wins)\n\
  gald3r worktree steer -TaskId 824 -Role code -Owner cursor -SteerText \"focus on\
  \ the accept loop, skip the auth tests\" -Json\n\n# g-go-code AC-gate poll (read\
  \ + clear; one-shot)\ngald3r worktree steer -TaskId 824 -Role code -Owner cursor\
  \ -Json\n\n# @g-queue appends a follow-up\ngald3r worktree queue -TaskId 824 -Role\
  \ code -Owner cursor -QueueText \"after done, also add prometheus metrics\" -Json\n\
  \n# g-go-code drain reads the pending queue\ngald3r worktree queue -TaskId 824 -Role\
  \ code -Owner cursor -Json\n```\n\nInstalled templates may call the helper from\
  \ the `gald3r worktree`\nskill directory when no root `scripts/` copy exists (same\
  \ resolution rule as `--resume`).\n\n### steer.md — interrupt the current trajectory\n\
  \nAt **every AC-gate iteration** (step b2.5 below), the implementer polls for `steer.md`.\
  \ If it\nexists:\n\n1. **Inject** the file's `## Steering Prompt` body as a high-priority\
  \ steering instruction into the\n   next reasoning step — it takes precedence over\
  \ the prior plan for the remainder of the task.\n2. **Log** `STEERED by user at\
  \ turn N` (N = current AC-gate iteration count) to the task's\n   `## Status History`\
  \ and surface the same line in the running output.\n3. **Delete** `steer.md` after\
  \ injection (the helper's read mode does this). The steer is\n   one-shot — a new\
  \ steer requires a new `@g-steer` write. This prevents a stale steer from\n   re-firing\
  \ on every subsequent iteration.\n\nIf no `steer.md` exists, the poll is a silent\
  \ no-op (`steered: false`) and the loop continues.\n\n### queue.md — follow-up work\
  \ after the main goal\n\n`queue.md` is an append-only checklist of follow-up prompts.\
  \ It is **not** processed mid-task —\nitems are drained only after the main goal's\
  \ acceptance criteria are all met and the task reaches\n`[\U0001F50D]` (step 7d\
  \ below). Each `- [ ]` item becomes a follow-up unit of work: the implementer either\n\
  (a) handles it inline within the same worktree when it is small and in-scope, or\
  \ (b) when it is a\ndistinct deliverable, files a real follow-up task via `g-skl-tasks\
  \ CREATE TASK` (per the Follow-Up\nTask Filing Gate) and references it. Drained\
  \ items are checked off (`- [x]`) in `queue.md` so a\nresumed or re-run session\
  \ does not reprocess them.\n\n## ⚙️ Pure Executor Contract\n\n`g-go-code` is a **pure\
  \ executor** — it receives a task spec routed by the `g-go` coordinator and\nproduces\
  \ implementation output. It does **not** self-route to other agents, does **not**\
  \ spawn\nreviewers, and does **not** write shared `.gald3r/` coordination surfaces\
  \ directly.\n\n**Bucket mode** (received via swarm briefing from the coordinator):\n\
  - **`parallel`** — this bucket has no cross-bucket dependencies; implement independently\
  \ and return results.\n- **`sequential`** — this bucket depends on upstream bucket\
  \ handoff data; read the upstream output before implementing.\n\nBucket agents return\
  \ to the coordinator: patch bundle, generated artifacts, test/lint evidence,\nchanged-file\
  \ inventory, and proposed Status History rows. The coordinator performs **all**\
  \ shared\nwrites (TASKS.md, BUGS.md, task files, CHANGELOG.md, generated prompts,\
  \ parity output, commits).\n\n---\n\n\n### Step 0 — Workspace Member Clean-Status\
  \ Preflight (T1431)\n\nBefore the WPAC gate / task selection / claim / worktree\
  \ creation, run the **read-only** workspace\nmember clean-status preflight: scan\
  \ `.gald3r/linking/workspace_manifest.yaml`, run\n`git -C <path> status --short`\
  \ on each `autonomous_child` member, and either print\n`Workspace clean -- N members\
  \ checked` (proceed) or a per-repo dirty-status table asking the user\nto commit/stash\
  \ first. Never auto-commits or writes. `--skip-member-clean-check` bypasses with\
  \ a\nprinted warning. Additive to the Housekeeping Commit Gate. **Full authoritative\
  \ algorithm: see\n`g-go.md` Step 0.**\n\n---\n\n### WPAC inbox Gate (Only When WPAC\
  \ is configured)\n\nBefore task claiming, implementation, verification, planning,\
  \ or swarm partitioning, first determine whether this project is a WPAC participant.\
  \ WPAC is configured only when `.gald3r/linking/link_topology.md` declares at least\
  \ one parent/child/sibling relationship, or `.gald3r/PROJECT.md` explicitly declares\
  \ WPAC project linking relationships. A Workspace-Control manifest and local `INBOX.md`\
  \ alone do not make the project a WPAC group member.\n\nIf WPAC is configured, run\
  \ the re-callable WPAC inbox check when the hook exists.\n\n> **Tool routing (BUG-031)**:\
  \ on Windows, invoke this snippet through the **PowerShell tool**, not Bash. It\
  \ uses PowerShell-only syntax (`@(...)` array, `Where-Object`, `Test-Path`, `Select-Object`,\
  \ pipeline). Routing it through Bash produces a parse error such as ``syntax error\
  \ near unexpected token `('`` — that failure is a tool-selection error, **NOT**\
  \ a real WPAC conflict gate. Re-run via PowerShell. On Linux/macOS hosts use `pwsh`\
  \ if available; if neither shell can reach the hook, treat the gate as advisory\
  \ and let Workspace-Control routing re-evaluate.\n\n```powershell\n$hook = @( \"\
  .cursor\\hooks\\g-hk-wpac-inbox-check.py\", \".claude\\hooks\\g-hk-wpac-inbox-check.py\"\
  , \".agent\\hooks\\g-hk-wpac-inbox-check.py\", \".codex\\hooks\\g-hk-wpac-inbox-check.py\"\
  , \".opencode\\hooks\\g-hk-wpac-inbox-check.py\" ) | Where-Object { Test-Path $_\
  \ } | Select-Object -First 1\nif ($hook) { python $hook -ProjectRoot . -BlockOnConflict\
  \ }\n```\n\nInstalled templates may call the equivalent hook from the active IDE\
  \ folder. If the check reports `INBOX CONFLICT GATE` or exits with code `2`, stop\
  \ immediately and run `@g-wpac-read`; do not claim tasks, create worktrees, spawn\
  \ reviewers, or continue planning until conflicts are resolved. Non-conflict requests,\
  \ broadcasts, and syncs are advisory and should be surfaced in the session summary.\n\
  \n\n### Gald3r Housekeeping Commit Gate (T531)\n\n<!-- T531-HOUSEKEEPING-GATE -->\n\
  After the WPAC gate is skipped or passes and **before** the Clean Controller Gate\
  \ hard-blocks the run, run the safety classifier helper at the orchestration root:\n\
  \n```powershell\ngald3r housekeep -Mode preflight -Apply -TaskId <id-when-known>\
  \ -Json\n```\n\nBehavior:\n\n- **`clean`** -> continue.\n- **`safe-gald3r-housekeeping`**\
  \ -> the helper stages **only** allowlisted controller `.gald3r/` paths via explicit\
  \ `git add -- <paths>` (never `git add .`), re-checks for drift, and creates a focused\
  \ `chore(gald3r): preflight gald3r housekeeping` commit. The run continues automatically.\n\
  - **`unsafe-gald3r` / `mixed-dirty` / `conflict` / `drift-detected` / unknown `.gald3r`\
  \ paths / member-repo `config-fault`** -> the helper exits non-zero, the existing\
  \ Clean Controller Gate hard-block applies, and the run STOPs with the exact unsafe\
  \ paths listed.\n\nThe helper allowlist covers the safe controller `.gald3r/` coordination\
  \ surfaces (TASKS.md, BUGS.md, FEATURES.md, PRDS.md, SUBSYSTEMS.md, IDEA_BOARD.md,\
  \ learned-facts.md, tasks/, bugs/, features/, prds/, subsystems/, reports/, logs/wpac_auto_actions.log,\
  \ linking/sent_orders/, linking/INBOX.md). The deny list covers `.identity`, `.user_id`,\
  \ `.project_id`, `.vault_location`, `vault/`, `config/`, `.gald3r-worktree.json`,\
  \ secret-named files, and unknown `.gald3r/` paths. Member-repo targets (marker-only\
  \ `.gald3r/`) are refused -- this gate is **controller-only**.\n\nRe-run the helper\
  \ in `-Mode post-write -Apply` immediately after coordinator-owned shared `.gald3r`\
  \ writes (task/bug status writes, review-result writes, sent_orders ledger updates,\
  \ safe report/log outputs) and before the next major phase so the shared-state dirty\
  \ window stays short. In `--swarm` flows only the coordinator runs the helper; bucket\
  \ agents remain handoff producers.\n### Clean Controller Gate (before claims, worktrees,\
  \ reconciliation)\n\nAfter the WPAC gate is skipped or passes:\n\n1. At the **orchestration\
  \ git root** (the repo from which you run this command — normally the Workspace-Control\
  \ owner, e.g. `<gald3r_source>`): run `git status --short`. If anything is listed\
  \ **outside** this run's explicit coordinator staging allowlist for the active task\
  \ and bug IDs, **STOP** here. Do not claim tasks or bugs, create or reuse T170 worktrees,\
  \ partition swarms, or write coordinator-owned updates to `.gald3r/TASKS.md`, `.gald3r/BUGS.md`,\
  \ other shared `.gald3r` coordination files, `CHANGELOG.md`, generated Copilot prompts,\
  \ or parity output until unrelated changes are committed, stashed, or moved to a\
  \ prior focused commit. Preserve any bucket handoff artifacts already produced and\
  \ list the paths that blocked progress.\n\n2. **`gald3r worktree create -AllowDirty`**:\
  \ do not use this switch for `g-go`, `g-go-code`, `g-go-review`, or any `--swarm`\
  \ variant **except** when every dirty path is owned exclusively by the active task/bug\
  \ scope and a `## Status History` row documents that override. Otherwise clean the\
  \ checkout first. The same **per-root** `-AllowDirty` discipline applies to every\
  \ repository included in the touch set below when multi-repo work is in scope.\n\
  \n3. **Member touch-set (v1 — `workspace_repos`)** — The orchestration root is **always**\
  \ gated. When the active task or bug declares **`workspace_repos:`** with manifest\
  \ `repository.id` entries, extend the gate to each **other** resolved member root\
  \ (blast radius follows declared cross-repo scope). Read `.gald3r/linking/workspace_manifest.yaml`\
  \ when present; map each listed ID (deduplicated) to `repositories[?].local_path`.\
  \ For each existing path, run `git -C \"<path>\" rev-parse --show-toplevel` then\
  \ `git status --short` at that root. Apply the same **explicit coordinator staging\
  \ allowlist** per root. Skip IDs whose paths are missing while `lifecycle_status`\
  \ is a planned/bootstrap gap (report only; do not expand the touch set). If the\
  \ manifest is missing while `workspace_repos` is non-empty, or an ID is unknown\
  \ under `repositories:`, **STOP** multi-repo coordinator work until manifest or\
  \ frontmatter is repaired (controller-only queue items whose `workspace_repos` lists\
  \ only the owner id may proceed once that id resolves).\n\n4. **Touch-set expansion\
  \ (v2 — optional signals)** — Union extra repository roots into the same per-root\
  \ checks (still **not** a blanket scan of every manifest member):\n   - **`extended_touch_repos:`**\
  \ — optional task/bug YAML list of additional manifest `repository.id` values beyond\
  \ `workspace_repos`.\n   - **`touch_repos:` (swarm handoffs)** — In `--swarm` runs,\
  \ when bucket work edits roots not already covered by `workspace_repos` + `extended_touch_repos:`,\
  \ bucket summaries and the coordinator reconciliation block MUST list those ids\
  \ under `touch_repos:` so the union is gated before shared writes.\n   - **Subsystem\
  \ `locations:` absolutes** — When the active item declares **`subsystems:`**, read\
  \ each `.gald3r/subsystems/{name}.md` frontmatter **`locations:`** (all nested strings).\
  \ For values matching a host **absolute** path (`^[A-Za-z]:[/\\\\]` on Windows,\
  \ or POSIX `/` rooted at `/` elsewhere), if the path exists, resolve `git -C <dir>\
  \ rev-parse --show-toplevel` (use the file's parent directory when the path is a\
  \ file). Each distinct root **other than** the orchestration root joins the touch\
  \ set. Relative paths do not expand the set.\n\n### Pre-Reconciliation Clean Gate\
  \ (before coordinator shared writes)\n\nAlso re-run the **Gald3r Housekeeping Commit\
  \ Gate** with `-Mode post-write -Apply` against the orchestration root immediately\
  \ after each coordinator-owned shared `.gald3r` write so safe controller coordination\
  \ state lands in a focused `chore(gald3r): commit g-go coordination state` commit\
  \ before the next major phase begins.\n\n\nImmediately before the coordinator merges\
  \ bucket results into the primary checkout, updates shared `.gald3r` indexes or\
  \ task/bug files as coordinator-owned writes, touches `CHANGELOG.md`, or creates\
  \ checkpoint / review-result commits: **re-run** `git status --short` on the **orchestration\
  \ root and every other repository root in the computed touch set** (steps 1 + 3\
  \ + 4). For `--swarm` runs, if unrelated dirty paths appear in **any** of those\
  \ roots during parallel bucket work, **fail closed** — do not apply those shared\
  \ writes; keep patches, artifacts, and evidence; report **per-root** blockers using\
  \ the same blocker family as checkpoint and review-result commits.\n\n## Session-Start:\
  \ Load Active Goal (Goal-Locked Loop)\n\n> Fires immediately after safety gates\
  \ pass, before implementation begins. If no active goal is set, this section is\
  \ a no-op.\n\nIf `.gald3r/config/ACTIVE_GOAL.md` exists:\n\n1. Read the file. Parse\
  \ its YAML frontmatter (`description`, `linked_task`, `set_at`, `turn_budget`, `turns_consumed`).\n\
  2. Inject into working context as the prefix:\n   ```\n   CURRENT GOAL: <description>\
  \ (turn <turns_consumed>/<turn_budget>, task T{id})\n   ```\n3. Increment `turns_consumed`\
  \ by 1 and write the updated value back to `ACTIVE_GOAL.md`.\n4. If `turns_consumed\
  \ >= turn_budget`:\n   - Surface `\U0001F3AF Goal turn budget exhausted — pausing\
  \ for user direction.`\n   - Stop the run cleanly. The user must extend the budget\
  \ (`@g-goal <description>` to reset) or clear the goal (`@g-goal clear`).\n\nIf\
  \ `--with-goal T{id}` was passed in `$ARGUMENTS`:\n\n1. Treat as if `@g-goal --from-task\
  \ T{id}` were just run: read `.gald3r/tasks/task{id}_*.md` (active or archive),\
  \ set `ACTIVE_GOAL.md` from the task title, then proceed with `tasks {id}` as the\
  \ work filter.\n2. Set `linked_task: T{id}` and the description from the task `title:`\
  \ field. Default `turn_budget: 50`.\n\nIf no `ACTIVE_GOAL.md` exists and no `--with-goal`\
  \ flag is present, proceed without a goal lock (normal operation).\n\n**Goal-aligned\
  \ AC gate**: after each AC-gate iteration (step b2 below), the implementing agent\
  \ self-checks: \"Did this action advance `<description>`?\" If not, re-anchor on\
  \ the goal in the next reasoning step. This is a soft drift-correction — not a hard\
  \ block. If drift is severe (3+ consecutive AC-gate iterations failing the alignment\
  \ check), surface a `\U0001F3AF Goal drift detected` notice in the session summary\
  \ and consider invoking `@g-goal status` to verify the lock is current.\n\nSee `g-goal`\
  \ command (parity across all 6 IDE platforms) for the full goal-locked loop specification.\n\
  \n---\n\n## Execution Protocol\n\n### Step 0a — Shell Router (T1144, before any\
  \ tool call)\n\nBefore issuing any shell, hook, or git command in this run, **probe\
  \ once** and lock the shell route for the session. This complements the always-apply\
  \ rule `g-rl-00-always` §6 (\"Shell Context — OS + Shell Probe\") and prevents the\
  \ bash-vs-PowerShell token-waste loop documented in BUG-031 / T1144.\n\n**Probe\
  \ (one signal, not a diagnostic loop):**\n\n| Signal | Route |\n|---|---|\n| `$env:OS`\
  \ contains `Windows`, or `$IsWindows -eq $true`, or harness reports `Shell: PowerShell`\
  \ | **PowerShell route** — use a `PowerShell` / `Shell` tool when available |\n\
  | `uname -s` returns `Linux` / `Darwin`, `$BASH_VERSION` is set, or harness reports\
  \ `Shell: Bash` | **bash/zsh route** — use the `Bash` tool |\n\n**Lock and route\
  \ every subsequent invocation through the chosen interpreter.** Do not mix syntaxes\
  \ inside a single tool call — the tool, not the snippet, picks the parser. If the\
  \ harness exposes both `Bash` and `PowerShell` tools on Windows, prefer the PowerShell\
  \ tool for PowerShell snippets.\n\nConcrete syntax differences to keep in mind (mirrors\
  \ `g-rl-00-always` §6):\n\n- Arrays: `@(...)` (PS) vs `(...)` / `arr=(a b c)` (bash)\n\
  - Statement separators: `;` sequential (PS, both); `&&` short-circuit (bash always,\
  \ PS 7+)\n- Env vars: `$env:VAR` (PS) vs `$VAR` / `${VAR}` (bash)\n- Paths: `\\\
  ` (PS, `/` also accepted on Windows) vs `/` (bash)\n- File-exists test: `Test-Path\
  \ $p` (PS) vs `[ -f \"$p\" ]` (bash)\n- Pipeline filters: `Where-Object { ... }`\
  \ (PS) vs `grep` / `awk` / `xargs` (bash)\n\n**Regression canonical (BUG-031 family)**\
  \ — the WPAC inbox hook lookup snippet that triggered T1144:\n\n```powershell\n\
  $hook = @( \".cursor\\hooks\\g-hk-wpac-inbox-check.py\", \".claude\\hooks\\g-hk-wpac-inbox-check.py\"\
  \ ) | Where-Object { Test-Path $_ } | Select-Object -First 1\n```\n\nThis snippet\
  \ appears literally in the WPAC inbox Gate section below. It is PowerShell-only\
  \ — invoking it via `Bash(...)` produces `syntax error near unexpected token '('`\
  \ (exit 2). That error is a **tool-routing failure**, NOT a real WPAC conflict or\
  \ hook-missing state. Re-route through PowerShell and the call succeeds; do not\
  \ enter an error-driven retry loop.\n\nWhen in doubt on Windows, default to PowerShell\
  \ for any snippet that uses `@(`, `$env:`, `Where-Object`, `Select-Object`, `Test-Path`,\
  \ or backslash paths. Linux/macOS hosts use `pwsh` if available, otherwise fall\
  \ back to bash equivalents.\n\n---\n\n### Step 0b — CLI Invocation Rule: `uv run\
  \ gald3r` (BUG-591)\n\nEvery `gald3r <verb>` call in this run — including the ones\
  \ later in this document\n(`gald3r worktree create`, `gald3r housekeep`, `gald3r\
  \ project-type resolve`, `gald3r search`,\n`gald3r task`/`gald3r bug` verbs, `gald3r\
  \ validate`, etc.) — MUST be run as **`uv run gald3r\n<verb>`**, never bare `gald3r`,\
  \ whenever cwd is a dev checkout of `gald3r_core` (this repo, a\nworktree of it,\
  \ or a Workspace-Control member that is itself such a checkout). A bare `gald3r`\n\
  call can silently resolve to a stale globally-installed PATH binary that shadows\
  \ this checkout's\nown dev source — confirmed damage (BUG-591) includes wrong `db\
  \ backfill` counts, missing verb\ngroups misreported as \"invalid choice\", and\
  \ a worktree-isolated agent's own status-update call\nlanding in the MAIN checkout's\
  \ `.gald3r/` instead of its own, defeating worktree isolation.\n**Full text, rationale,\
  \ and the optional machine-actionable staleness hard-fail check: see\n`g-go.md`\
  \ Step 0b.**\n\n---\n\n### 1. Load Context (Before Touching Anything)\n\nRead in\
  \ this order:\n- `.gald3r/PROJECT.md` — mission, goals, ecosystem context\n- `.gald3r/PLAN.md`\
  \ — current milestones\n- `.gald3r/BUGS.md` — open bugs (**read before TASKS** —\
  \ bugs run first)\n- `.gald3r/TASKS.md` — master task list\n- `.gald3r/CONSTRAINTS.md`\
  \ — guardrails (if exists)\n- `.gald3r/DECISIONS.md` — past decisions (if exists,\
  \ read-only)\n- **Active workflow profile (T1239)** — load once via `gald3r project-type\
  \ resolve` (active\n  skill folder; see g-skl-tasks \"Reading the active profile\"\
  ). Its\n  `task_statuses[]` (`id`, `symbol`, `skip_in_pipeline`) is the source of\
  \ truth\n  for claimable-vs-skip and status-transition order, replacing hardcoded\
  \ status\n  strings (AC1). Absent `.gald3r/config/workflow_profiles/` → built-in\n\
  \  `software_dev` lifecycle (unchanged behavior).\n- `git log --oneline -10` — recent\
  \ changes\n\n> **Codebase search (g-rl-43 / BUG-519)**: for any codebase content\
  \ search, prefer\n> `gald3r search <pattern> [--path DIR]`; it is **mandatory**,\
  \ not just preferred, whenever\n> a search must see inside `.gald3r/` or `.gald3r_sys/`\
  \ — the harness/ripgrep `Grep` tool is\n> gitignore-aware and silently misses gitignored\
  \ trees like `.gald3r_sys/` on broad searches.\n\n### 2. Build the Work Queue\n\n\
  **Bugs first (Tier 1), then tasks (Tier 2).** Claimable-vs-skip below follows the\n\
  active profile's `task_statuses[].skip_in_pipeline` (T1239 AC1); the symbols shown\n\
  are the `software_dev` defaults.\n\n**Tier 1 — Open bugs:**\n- From `BUGS.md` +\
  \ `bugs/` files; Critical → High → Medium → Low\n- Skip bugs with external blockers\n\
  - **Skip `[\U0001F6A8]` bugs** — log in Skipped section as \"Requires-User-Attention\
  \ — human review needed\"\n\n**Tier 2 — Pending tasks:**\n- Status `[ ]` (pending),\
  \ `[\U0001F4CB]` (ready), or stale `[\U0001F4DD]` (speccing claim expired)\n- **Skip\
  \ non-expired `[\U0001F4DD]` speccing claims** — log owner/expiry in Skipped section\
  \ as \"Speccing-In-Progress\"\n- For stale `[\U0001F4DD]` claims, append a Status\
  \ History takeover row naming the prior `spec_owner` before proceeding\n- **NOT**\
  \ `[\U0001F6A8]` (requires-user-attention) — **skip entirely**, log in Skipped section\
  \ as \"Requires-User-Attention — human review needed\"\n- **Skip `[⌛]` (waiting)\
  \ tasks** — prerequisites (`spec_task_reqs` or `spec_reqs`) not yet met; use `@g-task-upd\
  \ --promote` when ready\n- **Skip `[⏸️]` (paused) tasks** — stored in `tasks/paused/`;\
  \ must be manually unpaused before g-go-code picks them up\n- **Skip `[\U0001F6AB\
  ]` (cancelled) tasks** — stored in `tasks/cancelled/`; terminal state, never eligible\
  \ for implementation\n- No unmet dependencies, with the rolling-pipeline exception\
  \ below: a dependency at `[\U0001F50D]` counts as **implementation-satisfied** for\
  \ follow-on coding unless the downstream task declares `requires_verified_dependencies:\
  \ true`\n- Not `ai_safe: false`\n- Priority: Critical → High → Medium → Low\n\n\
  Supported `$ARGUMENTS` filters:\n- Task IDs: `@g-go-code tasks 7, 9`\n- Bug IDs:\
  \ `@g-go-code bugs BUG-003`\n- Subsystem: `@g-go-code subsystem vault-hooks-automation`\n\
  - `@g-go-code bugs-only` / `@g-go-code tasks-only`\n\n### 2a. Resolve Speccing Claims\
  \ Before Worktrees\n\nBefore Step 3 worktree allocation, resolve task-spec claims\
  \ in the primary checkout:\n- For a bare `[ ]` task with no complete task file,\
  \ run `g-skl-tasks` `CLAIM-FOR-SPEC` -> `WRITE-SPEC` -> `PROMOTE-SPEC` first.\n\
  - Skip non-expired `[\U0001F4DD]` claims before allocating a coding worktree.\n\
  - For expired `[\U0001F4DD]` claims, append a Status History takeover row naming\
  \ the prior `spec_owner`, then finish/promote the spec before worktree creation.\n\
  - Only `[\U0001F4CB]` tasks or stale claims successfully promoted to `[\U0001F4CB\
  ]` proceed to coding worktree creation.\n\n### 2b. Harvested Task Pre-Flight Check\
  \ (T810)\n\n**Applies to any task with `harvested_from:` in its YAML frontmatter.**\
  \ Tasks created before this feature lacked the field — those pass silently. Only\
  \ tasks explicitly generated by `g-skl-res-apply` will carry the field.\n\nFor each\
  \ queued task that has `harvested_from:` set:\n\n1. **Read subsystem spec** — Find\
  \ the task's `subsystems:` list. For each subsystem, read `.gald3r/subsystems/{name}.md`.\
  \ Extract the `locations:` paths and read the key files there. Produce a 3-5 line\
  \ bullet summary of what is currently implemented.\n\n2. **Scan pending queue**\
  \ — Search `TASKS.md` for other tasks in status `[\U0001F4CB]` or `[\U0001F504]`\
  \ that reference the same subsystem(s) in their frontmatter. List: task ID, title,\
  \ status.\n\n3. **Display context panel:**\n   ```\n   ⚠️ HARVESTED TASK PRE-FLIGHT\n\
  \   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n   Task:    T{id} — {title}\n   Source:\
  \  {harvested_from} (analyzed {harvest_date})\n   Type:    {harvest_type}\n\n  \
  \ Subsystem: {subsystem_name}\n   Existing implementation:\n     • {bullet 1}\n\
  \     • {bullet 2}\n     • {bullet 3}\n\n   Other pending tasks for same subsystem:\n\
  \     T{n}: \"{title}\" [{status}]\n     (none) if queue is empty\n   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\
  \   ```\n\n4. **Decision gate by `harvest_type`:**\n   - `harvest_type: additive`\
  \ — Display panel, then **proceed automatically.** The task adds new capability;\
  \ no comparison gate needed.\n   - `harvest_type: replacement` without `harvest_approved:\
  \ true` — **BLOCK.** Do not implement. Pause and present the panel to the user asking:\
  \ \"This harvested task would replace existing functionality. Confirm to proceed,\
  \ or type `skip` to defer this task.\" Log the task in the run's Skipped section\
  \ as \"Awaiting harvest comparison confirmation.\"\n   - `harvest_type: replacement`\
  \ with `harvest_approved: true` — Display panel as context, then proceed.\n   -\
  \ No `harvest_from:` field — Pass silently; no panel shown. (Legacy tasks created\
  \ before T810.)\n\n> **`--override-harvest-check` flag** — When this flag is passed\
  \ to `@g-go-code`, replacement-type harvested tasks are treated as if `harvest_approved:\
  \ true` and proceed without blocking. Use for batch runs after explicit human review\
  \ of the harvest intake report.\n\n### Step 0: Generate Locked Implementation Plan\
  \ (Manus Planning Gate — T879)\n\n**Runs after work queue is finalized, before any\
  \ file edits or worktree creation.**\n\nSkip this step only when `--skip-plan` is\
  \ explicitly passed (trivial single-file tasks). `--skip-plan` is not the default\
  \ and must be justified in the session summary.\n\nFor each queued task or bug,\
  \ generate a locked implementation plan and append it to the task/bug file under\
  \ `## Implementation Plan`. The plan locks intent before code touches the filesystem.\
  \ Any mid-implementation divergence must be documented as a `DEVIATION:` note —\
  \ do not silently rewrite history.\n\n**Plan template** (append to the task file):\n\
  \n```markdown\n## Implementation Plan\n**Objectives:** [each Acceptance Criterion\
  \ reworded as a concrete objective]\n**Constraints:** [active CONSTRAINTS.md constraints\
  \ relevant to this task's subsystems — list by ID and 1-line summary]\n**Steps:**\n\
  1. [first concrete implementation step — name the file and operation]\n2. [second\
  \ step]\n3. [continue as needed]\n**Success Criteria:** [mirrors the AC checkboxes\
  \ verbatim]\n**Lock Status:** LOCKED\n**Locked at:** YYYY-MM-DD\n```\n\n**Lock rules:**\n\
  - Write the plan, set `Lock Status: LOCKED`, then proceed to coding. Never skip\
  \ writing the plan section.\n- If implementation must deviate from a planned step,\
  \ append `DEVIATION: {reason}` under the affected step and continue — do not stop,\
  \ do not silently rewrite.\n- After implementation, `g-go-review` reads `## Implementation\
  \ Plan` and compares against the actual diff to flag undocumented divergences.\n\
  - Use `g-skl-plan` `LOCK_PLAN` operation to generate the plan (reads AC + active\
  \ CONSTRAINTS.md constraints).\n\n### 3. Pre-Create Coding Worktrees (Before Editing)\n\
  \nAfter speccing claims are resolved and before any implementation file changes\
  \ or primary-checkout status writes, isolate every queued item with the T170 helper:\n\
  \n```powershell\ngald3r worktree create -TaskId {id} -Role code -Json\n```\n\nInstalled\
  \ templates may call the helper from the `gald3r worktree` skill directory when\
  \ no root `scripts/` copy exists.\n\nRules:\n- **Owner (T580/BUG-612)**: omit `-Owner`\
  \ — the helper auto-resolves it from your ACTUAL routed provider (`agent_role_routing.resolve_worktree_owner_label`,\
  \ reading `GALD3R_GGO_IMPLEMENTER_PROVIDER`/`GALD3R_GGO_COORDINATOR_PROVIDER`, whichever\
  \ `-Role` maps to) before falling back to `USERNAME`/`USER`/`agent`. A Claude-hosted\
  \ or override-free run resolves nothing extra here and keeps the pre-T580 USERNAME-based\
  \ owner unchanged; a Cursor-hosted run (or any explicit `--provider`/role override)\
  \ gets a real, non-`claude` owner label instead of a guessed literal. Pass `-Owner\
  \ <value>` explicitly only when you need to override that resolution yourself.\n\
  - Worktree root defaults to `$env:GALD3R_WORKTREE_ROOT`, else `<repo-parent>/.gald3r-worktrees/<repo-name>`.\n\
  - The helper must refuse nested worktrees inside the active checkout.\n- The helper\
  \ blocks when the active checkout is dirty unless the **Clean Controller Gate**\
  \ is satisfied with a documented `-AllowDirty` override in the owning task or bug\
  \ `## Status History` (see `g-rl-33`).\n- Map helper JSON to claim metadata: `worktree_path`\
  \ → `worktree_path`, `worktree_branch` → `worktree_branch`, `created_at` → `worktree_created_at`,\
  \ and `owner` → `worktree_owner`.\n- Run implementation commands from the worktree\
  \ root. Keep the primary checkout for queue coordination and final status writes.\n\
  - Pre-create all queued item worktrees before marking any item `[\U0001F50D]`; this\
  \ prevents legitimate gald3r status writes from making later worktree creation look\
  \ unsafe.\n- If worktree creation fails, preserve any existing files, record the\
  \ reason in Deferred Items, and skip the item rather than editing the primary checkout.\n\
  - **Agent liveness heartbeat (T1058)**: at claim time, write `agent_heartbeat: now`\
  \ and `agent_heartbeat_expires: now + 10 min` to the task YAML. Refresh both fields\
  \ every 5 minutes during active bucket work. Use the env var `GALD3R_HEARTBEAT_TTL_MINUTES`\
  \ if set.\n\n### 4. Work Through Items Sequentially\n\nFor each item:\n\n**a)**\
  \ Read the task/bug file — understand objective and acceptance criteria\n**b)**\
  \ If the item is a bare `[ ]` task with no complete spec, run `g-skl-tasks` `CLAIM-FOR-SPEC`\
  \ → `WRITE-SPEC` → `PROMOTE-SPEC` first; skip non-expired `[\U0001F4DD]` claims.\
  \ Then create/reuse the coding worktree and implement the solution inside that worktree\n\
  \n**b-1) Validation Contract Pre-Gate (T1096)** — before claiming any task, verify\
  \ the `## Acceptance Criteria` section contains **checkbox items** (`- [ ]`). If\
  \ the AC section is missing or contains only prose (no checkboxes):\n\n- **Block**\
  \ the task claim\n- Write a note: \"AC_VALIDATION_FAIL: task {N} — Acceptance Criteria\
  \ missing or prose-only; requires checkbox format before implementation can begin\"\
  \n- Log to work queue as \"Skipped - AC_GATE: needs checkbox AC before implement\"\
  \n- Move to the next task\n\nThis gate ensures g-go-review has a pre-defined, unambiguous\
  \ contract to check. AC prose = unbounded scope = high re-work risk.\n\n**Fast pass**:\
  \ If the task has ≥3 checkbox AC items, the gate passes immediately with no extra\
  \ action.\n\n**b0) Impact Scan + Code-Graph Context Query (T921 + T874b + T1158)**\
  \ — before writing any file, run the cross-file impact analysis to understand blast\
  \ radius, and (when enabled) query the pre-built code graph to seed implementer\
  \ context with ~200 tokens instead of grepping linearly.\n\n**b0.1 Impact Scan (T921\
  \ → T1158, default-on)**\n\nCall `graph_impact` on each file in the task touch set\
  \ via gald3r_muninn MCP. The Python wrapper is the canonical entry point and falls\
  \ back automatically when the muninn graph is not indexed:\n\n```bash\npython scripts/graph_impact.py\
  \ -File \"{file_to_be_modified}\" -Depth 2 -Json\n```\n\nDirect MCP equivalent (when\
  \ calling tools by name):\n\n```jsonc\n// example_app MCP server (muninn plugin)\n\
  { \"tool\": \"graph_impact\", \"arguments\": { \"file_path\": \"{file_to_be_modified}\"\
  \ } }\n```\n\nReview the returned `files` list (each entry `{path, relation}` with\
  \ `relation` ∈ `imports | calls | imports+calls`). If the impact scan reveals >\
  \ 3 transitively dependent files, add them to the implementation context window\
  \ before writing. This prevents cross-file breakage (\"agent edits one file and\
  \ breaks another\"). Non-blocking: proceed even if the script returns `warning:\
  \ not_indexed` or falls back to the ripgrep backend.\n\nUse `.claude/skills/g-skl-muninn/scripts/graph_impact.py`\
  \ for all impact analysis (T1158).\n\n**b0.1a Index freshness check (T1149)** —\
  \ before relying on impact results, check index state (the wrapper reports it; or\
  \ call `graph_status` via MCP):\n\n- **Index absent** (`index_missing` / `warning:\
  \ not_indexed`) → emit this warning, then proceed on the ripgrep fallback (non-blocking):\n\
  \  ```\n  ⚠️ Codebase graph index not found.\n     Build it:  python -m docker.gald3r.tools.plugins.muninn.indexers.python_indexer\
  \ --root .\n                node  docker/gald3r/tools/plugins/muninn/indexers/ts_indexer.js\
  \  --root .   (TS/JS)\n     Or run @g-setup (it offers to build the index + wire\
  \ the post-commit refresh hook).\n     Impact scan falling back to ripgrep — blast-radius\
  \ estimates may be incomplete.\n  ```\n- **Index stale** (`graph_status` → `stale:\
  \ true`, >24h old) **AND** the post-commit hook (`g-hk-graph-update.py`) is not\
  \ installed → surface a one-line advisory (non-blocking): `ℹ️ Graph index >24h old;\
  \ install the post-commit refresh hook (see @g-setup) to keep it fresh.`\n- **Index\
  \ fresh** (post-commit hook running) → run silently; no output unless the `files`\
  \ list is non-empty.\n\n**b0.2 Graphify Code-Graph Query (T874b, opt-in)**\n\nRead\
  \ `.gald3r/config/AGENT_CONFIG.md` → `context_reduction_mode.graphify_b0_enabled`.\
  \ When `true`, the coordinator runs a single graph query before bucket spawn (or\
  \ before single-agent implementation), captures the result as a small context block\
  \ (typical ≤200 tokens), and passes it to implementer subagents as part of the briefing.\
  \ When `false` (safe default), this step is skipped and Step b0.1 alone gates the\
  \ impact context.\n\nBackend fallback order (g-skl-graphify §Backends):\n\n1. **gald3r_muninn\
  \ MCP** (preferred, T1158) — `graph_impact` / `graph_callers` / `graph_callees`\
  \ / `graph_deps` for symbol-level call/import resolution. Auto-loaded into the example_app\
  \ MCP server; see `.mcp.json` `gald3r_muninn` entry.\n2. **graphify CLI** — when\
  \ muninn is unavailable, run `graphify query --root . --symbol {target}` against\
  \ the local `.graphify/` index. See g-skl-graphify §SETUP for indexing guidance.\n\
  3. **tree-sitter + ripgrep fallback** — when neither backend is reachable, fall\
  \ back to the legacy grep-based context-prep (Step b0.1 + ad-hoc reads). Do NOT\
  \ halt the run.\n\nFailure modes (never halt the run):\n\n- **Missing backend**\
  \ — example_app MCP server unreachable AND muninn plugin import fails AND `graphify`\
  \ CLI not on PATH AND no `.graphify/` index → log \"graphify b0 skipped: no backend\
  \ reachable\" and fall through to legacy.\n- **Graph staleness** — index older than\
  \ the orchestration root's last commit (muninn `graph_status` returns `stale: true`\
  \ when index >24h old) → emit a warning; still use the result (advisory) and append\
  \ a note recommending re-indexing via the muninn indexer or `graphify update`.\n\
  - **Query timeout** (>5s) — abort the query, log \"graphify b0 timeout — fell back\
  \ to legacy\", proceed.\n- **Empty result** — query returned no symbols / no edges\
  \ → log \"graphify b0 empty — fell back to legacy\"; proceed with Step b0.1 context.\n\
  \nThe b0.2 query is **advisory**, **non-blocking**, and **single tool call** (g-rl-37\
  \ \"Think in Code\" — one query, ≤200 tokens of returned context). Operators opt\
  \ in by flipping `graphify_b0_enabled: true` in `AGENT_CONFIG.md`.\n\n**b1) `post_write_lint`\
  \ step — Post-Write Lint Gate (T919 + T977)** — this is the **delta-lint** step\
  \ of the implementation loop. It runs **immediately after each `Write` or `StrReplace`/Edit\
  \ tool call**, inside the per-item b/c/d/e/f loop — *not* at the end-of-task AC\
  \ gate (b2). The goal is to shrink the feedback loop: catch a syntax error on the\
  \ file you just wrote and fix it inline **before** advancing to the next write,\
  \ instead of discovering a pile of broken files when the b2 AC gate or a downstream\
  \ test runs.\n\n> **Loop placement (explicit)**: `post_write_lint` belongs to the\
  \ implementation loop (Step 4 → b), one rung below b2. After every Write/Edit, run\
  \ `post_write_lint` → fix inline if it fails → then continue editing. The b2 AC\
  \ gate and the b3.5 Definition-of-Done gate remain the end-of-task gates; `post_write_lint`\
  \ is the per-write gate that feeds them clean files.\n\nCanonical entry point (single\
  \ native verb, runs the per-extension check for you):\n\n```powershell\ngald3r lint\
  \ post-write \"{relative_path_to_written_file}\" --project-root . --json\n```\n\n\
  Per-language lint commands (single-line PowerShell-safe per g-rl-08 — no multi-line\
  \ `python -c`):\n\n| Extension | PowerShell lint command (run from the worktree/project\
  \ root) |\n|-----------|-------------|\n| `.py` | `python -m py_compile \"{file}\"\
  ` |\n| `.json` | `python -c \"import json,sys; json.load(open(sys.argv[1]))\" \"\
  {file}\"` |\n| `.yaml` / `.yml` | `python -c \"import yaml,sys; yaml.safe_load(open(sys.argv[1]).read())\"\
  \ \"{file}\"` |\n| `.toml` | `python -c \"import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))\"\
  \ \"{file}\"` |\n| `.ts` / `.tsx` / `.js` | `npx tsc --noEmit` (only when a `tsconfig.json`\
  \ is present; else skip) |\n| `.ps1` / `.psm1` / `.psd1` | `$errs=$null; [System.Management.Automation.Language.Parser]::ParseFile(\"\
  {file}\", [ref]$null, [ref]$errs) > $null; if ($errs.Count) { throw $errs[0].Message\
  \ }` — or the lighter `[scriptblock]::Create((Get-Content \"{file}\" -Raw)) > $null`\
  \ (throws on a syntax error). `gald3r lint post-write` uses the same `Parser::ParseFile`\
  \ form (not `PSParser::Tokenize`), so structural errors such as unbalanced braces\
  \ are also caught. |\n| Markdown / `.md` / TASKS.md / other prose | Pass silently\
  \ (use `--skip-post-lint` for explicit prose-only runs) |\n\nEach `python -c` form\
  \ is **single-line** and passes the file as `sys.argv[1]` so PowerShell never has\
  \ to interpolate the path into the Python string (avoids the quoting/parse pitfalls\
  \ called out in g-rl-08). On a clean parse the command exits `0`; on a syntax error\
  \ it raises and exits non-zero.\n\nIf `gald3r lint post-write` exits non-zero (`exit\
  \ 2` = syntax error), **stop and fix the file before proceeding (AC4 — inline fix)**.\
  \ Do not advance to the next write. Treat a `post_write_lint` failure the same as\
  \ a TypeScript compile error — it blocks continuation. Re-run `post_write_lint`\
  \ on the fixed file; only a clean (exit 0) result lets the loop continue.\n\n**`--skip-post-lint`\
  \ flag (AC5)** — when `$ARGUMENTS` contains `--skip-post-lint`, the `post_write_lint`\
  \ step is suppressed for the whole session. Use it for documentation-only or coordination-only\
  \ runs (Markdown, `TASKS.md`/`BUGS.md` index edits, `.gald3r/` housekeeping) where\
  \ a syntax linter has nothing meaningful to check. The flag does **not** disable\
  \ the b2 AC gate or b3.5 DoD gate — it only skips the per-write delta lint. `gald3r\
  \ lint post-write` already passes silently on prose/unknown extensions, so `--skip-post-lint`\
  \ is mainly an explicit-intent signal that avoids spawning the lint subprocess at\
  \ all on non-code writes; record `post_write_lint: SKIPPED (--skip-post-lint)` once\
  \ in the session summary when it is set.\n\n**Worked examples (AC6)** — three delta-lint\
  \ scenarios showing the fix-inline-before-proceeding loop:\n\n*Python write* — you\
  \ just wrote `src/services/charge.py`:\n\n```powershell\n# Right after the Write/Edit\
  \ tool call:\ngald3r lint post-write \"src/services/charge.py\" --project-root .\
  \ --json\n# Equivalent raw check the verb runs:\npython -m py_compile \"src/services/charge.py\"\
  \n# exit 0  -> {\"ok\":true,\"message\":\"Syntax OK (.py)\",...}  -> continue the\
  \ loop\n# exit 2  -> {\"ok\":false,\"message\":\"Syntax error (.py)\",\"detail\"\
  :\"... IndentationError ...\"}\n#            -> STOP, fix the indentation/typo in\
  \ charge.py, re-run the lint, only then proceed\n```\n\n*JSON write* — you just\
  \ wrote `config/feature_flags.json`:\n\n```powershell\ngald3r lint post-write \"\
  config/feature_flags.json\" --project-root . --json\n# Equivalent raw check:\npython\
  \ -c \"import json,sys; json.load(open(sys.argv[1]))\" \"config/feature_flags.json\"\
  \n# A trailing comma -> json.decoder.JSONDecodeError -> exit 2 -> fix the comma\
  \ inline, re-run, then continue\n```\n\n*YAML write* — you just wrote `.github/workflows/ci.yml`:\n\
  \n```powershell\ngald3r lint post-write \".github/workflows/ci.yml\" --project-root\
  \ . --json\n# Equivalent raw check:\npython -c \"import yaml,sys; yaml.safe_load(open(sys.argv[1]).read())\"\
  \ \".github/workflows/ci.yml\"\n# A bad indent / tab -> yaml.scanner.ScannerError\
  \ -> exit 2 -> fix the indentation inline, re-run, then continue\n```\n\nIn all\
  \ three cases the rule is identical: **lint the file you just wrote → if it fails,\
  \ fix it inline and re-lint → only a clean exit 0 advances the loop to the next\
  \ write.**\n\n**Parity note (AC7)** — `gald3r lint post-write` is a native verb\
  \ of the compiled `gald3r` engine (T284 absorb), not a loose per-project script,\
  \ so every IDE mirror invokes the byte-identical command — there is no separate\
  \ helper script to keep in sync. This `g-go-code.md` under canonical `project_template/.claude/commands/`\
  \ remains the **source of truth** for the wording of the `post_write_lint` step;\
  \ the per-IDE mirrors (`.claude/commands/g-go-code.md`, `.cursor/commands/g-go-code.md`,\
  \ and the other platform copies) are still **propagated later** by `custom_scripts/platform_parity_sync.ps1`\
  \ — do **not** hand-edit the mirrors.\n\n**b2) AC gate** — before moving on, walk\
  \ every `- [ ]` acceptance criterion in the task spec:\n  - Is this criterion now\
  \ satisfied? Check the actual files, not just intent.\n  - Any unmet criterion →\
  \ return to **(b)** and address it.\n  - Cannot meet a criterion this session →\
  \ log as a Blocker in step 5 and **skip this task entirely** (do not mark `[\U0001F50D\
  ]` for partial work).\n  - **Stub/TODO scan**: search files modified for this task\
  \ for bare `# TODO`, `// TODO`, `pass` (non-abstract), `raise NotImplementedError`,\
  \ `throw new Error(\"not implemented\")` — each is an unmet criterion until annotated\
  \ `TODO[TASK-X→TASK-Y]` with a follow-up task created (see `g-rl-34`)\n  - **Bug-discovery\
  \ check**: any pre-existing bug encountered while implementing must have a BUG entry\
  \ + `BUG[BUG-{id}]` comment before `[\U0001F50D]`; bugs introduced by this task\
  \ must be fixed inline (see `g-rl-35`)\n  - **Constraint check**: run `@g-constraint-check`\
  \ mentally — does this implementation violate any active constraint? Any `\U0001F6AB\
  \ VIOLATION` blocks `[\U0001F50D]`\n  - **Workspace boundary check**: run `g-skl-workspace`\
  \ ENFORCE_SCOPE before editing and before `[\U0001F50D]`; omitted metadata is current-repo-only,\
  \ unknown manifest repo IDs block, and member repo writes require explicit `workspace_repos`,\
  \ compatible `workspace_touch_policy`, authorization text, reviewed member git status,\
  \ and manifest write permission. **`workspace_touch_policy: member_only` is a write-scope\
  \ limiter (changes land exclusively in the named member repo) — it is NOT a location\
  \ gate requiring the agent to be opened inside the member repo. The controller may\
  \ implement `member_only` tasks by writing to member on-disk paths after the Clean\
  \ Controller Gate passes on that member root. (BUG-098)**\n  - All criteria confirmed\
  \ met → continue.\n**b2.5) Steer poll (T969)** — at every AC-gate iteration, poll\
  \ for a user steer dropped into the worktree root:\n  ```powershell\n  gald3r worktree\
  \ steer -TaskId {id} -Role code -Owner {owner} -Json\n  ```\n  - `steered: false`\
  \ → silent no-op; continue the loop.\n  - `steered: true` → **inject** the returned\
  \ `steer_prompt` body as a high-priority steering instruction for the next reasoning\
  \ step (it takes precedence over the prior plan for the rest of this task), **log**\
  \ `STEERED by user at turn N` to `## Status History` (and the running output), and\
  \ note that the helper has already **deleted** `steer.md` so the steer fires exactly\
  \ once. Re-evaluate the AC list under the new steering before proceeding. See \"\
  Mid-Flight Course Correction (`/steer` + `/queue`)\" above.\n**b3) Queue Status\
  \ History** — collect the row that will be appended before marking `[\U0001F50D\
  ]`:\n  ```\n  | YYYY-MM-DD | pending | awaiting-verification | Implementation complete;\
  \ {1-line summary} |\n  ```\n  If the task file has no `## Status History` section\
  \ yet, add it first (backfill row: `| {created_date} | — | pending | Task created\
  \ (backfill) |`).\n**b3.5) Definition-of-Done Gate — Per-Criterion Model Evaluator\
  \ (T1099 + T1168)** — after implementation, before marking `[\U0001F50D]`, run a\
  \ per-criterion structured evaluation of the task's `## Acceptance Criteria` checklist\
  \ using a cheap model tier (Haiku, gemini-flash-lite, etc.). This catches confirmation-bias\
  \ premature `[\U0001F50D]` marks where the implementation agent thinks it shipped\
  \ AC but missed a checkbox.\n\n**Opt-in policy**: This gate is opt-in per task.\
  \ Run it when **any** of the following is true:\n\n1. Task YAML frontmatter has\
  \ `requires_dod_gate: true`\n2. Project `.gald3r/config/AGENT_CONFIG.md` sets `dod_gate_enabled:\
  \ always`\n3. Task has `requires_verification: true` AND `AGENT_CONFIG.md` sets\
  \ `dod_gate_enabled: auto` (default)\n\nWhen `dod_gate_enabled: never` is set project-wide,\
  \ the gate is suppressed regardless of task-level flags. When task has `requires_dod_gate:\
  \ false` (explicit), the gate is suppressed even if `dod_gate_enabled: always`.\n\
  \nWhen the gate does not run, log `dod_gate: SKIPPED (opt-out)` to Status History\
  \ and proceed to **b4**.\n\n**Per-criterion evaluator prompt** (invoke once per\
  \ `- [ ] criterion` row using the cheapest available model):\n\n```\nYou are evaluating\
  \ ONE acceptance criterion against an implementation.\n\nCriterion: {criterion text}\n\
  \nFiles modified this task:\n{list of file paths from b4 Handoff Report — files\
  \ changed/created/deleted}\n\nBrief implementation summary:\n{1-3 sentence summary\
  \ of what was done}\n\nQuestion: Is this criterion satisfied by the current code?\n\
  Respond in this exact format:\nVERDICT: PASS | FAIL | UNSURE\nEVIDENCE: <file:line>\
  \ or <file (no line)> or \"no direct evidence found\"\nREASON: <one-sentence justification>\n\
  ```\n\n**Aggregation logic**:\n\n| Outcome | Action |\n|---------|--------|\n| All\
  \ criteria `PASS` | Proceed to **b4 Handoff Report** → `[\U0001F50D]` |\n| Any criterion\
  \ `FAIL` | **BLOCK**. Do not mark `[\U0001F50D]`. Return to **(b)** for one targeted\
  \ fix pass, then re-run the gate (max 1 retry). After 1 failed retry, log Status\
  \ History `dod_gate: FAIL` and either (i) keep the task at `[\U0001F504]` with a\
  \ Blocker note for the next session, or (ii) if `--swarm`, return the FAIL verdict\
  \ to the coordinator as part of the bucket handoff. |\n| Any criterion `UNSURE`\
  \ (none `FAIL`) | Surface to coordinator (single-agent: surface to user; `--swarm`:\
  \ include in bucket handoff). Coordinator/user decides: (a) treat as PASS and mark\
  \ `[\U0001F50D]`, (b) treat as FAIL and loop, or (c) escalate to `g-go-review` for\
  \ human-style verification. Do NOT silently auto-pass UNSURE. |\n| Cheap model unavailable\
  \ / network error | Log `dod_gate: SKIPPED (model unavailable)` and fall through\
  \ to legacy YES/NO check (T1099 behavior). Never halt the run on infrastructure\
  \ failure. |\n\n**Status History row** (always append after gate, even on SKIP):\n\
  \n```\n| {timestamp} | in-progress | {next_status} | {agent} | dod_gate: {PASS|FAIL|UNSURE|SKIPPED}\
  \ — {summary_line} |\n```\n\nWhere `{summary_line}` is one of:\n\n- `all N criteria\
  \ PASS`\n- `N PASS / M FAIL / K UNSURE — FAIL: {first_failed_criterion_short_label}`\n\
  - `N PASS / K UNSURE — needs coordinator decision`\n- `SKIPPED ({opt-out|model-unavailable|opt-out-task-flag})`\n\
  \n**Per-criterion detail** (optional, append below Status History row when at least\
  \ one FAIL or UNSURE exists, for audit and `g-go-review` cross-check):\n\n```\n\
  ### DoD Gate Detail — {timestamp}\n- AC1 `{first 60 chars of criterion}`: PASS —\
  \ commands/g-go-code.md:416 — \"criterion text matches step b3.5\"\n- AC2 `{...}`:\
  \ FAIL — no direct evidence found — \"criterion not visible in modified files\"\n\
  - AC3 `{...}`: UNSURE — skills/g-skl-tasks/SKILL.md:197 — \"field present but behavior\
  \ not exercised\"\n```\n\n**Cost guard**: The gate runs **once** per task per `[\U0001F50D\
  ]` attempt (plus 1 retry after FAIL). Per-criterion prompts are short and target\
  \ a Haiku-tier model — typical cost is well under the savings from preventing one\
  \ failed `g-go-review` cycle.\n**b4) Fill Handoff Report** (REQUIRED before `[\U0001F50D\
  ]`) — fill in the `## Handoff Report` section of the task file:\n  - **Files Changed**:\
  \ list every file created, modified, or deleted (one path per line)\n  - **Commands\
  \ Run**: key commands with exit codes (e.g. `uv run pytest` → exit 0)\n  - **Issues\
  \ Discovered**: pre-existing bugs found, blockers hit, surprises\n  - **Left Undone**:\
  \ stubbed items, deferred scope, `TODO[TASK-X→TASK-Y]` references\n  - **Procedure\
  \ Compliance**: Yes / Partial / No — note any gate deviations\n  If the task file\
  \ has no `## Handoff Report` section, create it above `## Agent Notes`.\n**c)**\
  \ Validate — lint, test, check files exist\n**d)** Record decisions — if you chose\
  \ approach A over B, append to `.gald3r/DECISIONS.md`\n**e)** Update subsystem Activity\
  \ Log — for each subsystem in the task's `subsystems:` field, append to `.gald3r/subsystems/{name}.md`\
  \ Activity Log: `| {date} | TASK | {id} | {title} | — |`. Create a stub spec if\
  \ the file doesn't exist.\n**f)** Stamp implementation branch + SHA on task file\
  \ frontmatter (BUG-095 fix, T1373):\n  Before writing the `[\U0001F50D]` status,\
  \ capture and write to the task file's YAML frontmatter:\n  ```powershell\n  $branch\
  \ = git branch --show-current 2>$null\n  $sha    = git rev-parse HEAD 2>$null\n\
  \  ```\n  Write both into the task file immediately after `completed_date:`:\n \
  \ ```yaml\n  implementation_branch: <branch>   # e.g. dev\n  implementation_sha:\
  \ <full-40-char-sha>\n  ```\n  If `git` is unavailable or returns an error, leave\
  \ both fields as empty string `''` — a stamping failure must NEVER prevent the `[\U0001F50D\
  ]` transition. In `--swarm` mode, each bucket agent stamps its own tasks; the coordinator\
  \ does NOT re-stamp.\n**g)** Queue status update → mark `[\U0001F50D]` (NOT `[✅]`)\
  \ in both task file and TASKS.md during the final batch write\n**h)** Move to next\
  \ item\n\n> **IMPORTANT**: Mark every completed item `[\U0001F50D]`, never `[✅]`.\n\
  > `[✅]` requires a separate agent session running `@g-go-review`.\n\n### 4a. Mid-Task\
  \ Checkpoint (Mandatory, Every N Major Operations)\n\n**`CHECKPOINT_TOOL_CALL_INTERVAL`**:\
  \ Default **20** major operations (file reads, shell commands, file writes). Override\
  \ via `.gald3r/config/AGENT_CONFIG.md` key `checkpoint_interval`.\n\n**Trigger**:\
  \ After every N major tool operations within a single task's implementation, pause\
  \ for a brief self-evaluation **before continuing**.\n\n**Self-evaluation covers:**\n\
  1. **AC alignment** — How many acceptance criteria are satisfied vs. remaining?\
  \ Is current trajectory sufficient?\n2. **Scope check** — Am I within the declared\
  \ `subsystems:` and `workspace_repos:` boundaries? Any creep?\n3. **Blocking obstacles**\
  \ — Anything discovered that may prevent completing this task? (missing files, unclear\
  \ spec, external dep)\n4. **Token budget** — Rough estimate of remaining context;\
  \ flag if >75% consumed with significant work still remaining.\n\n**Output formats:**\n\
  \nHealthy:\n```\n## Mid-Task Checkpoint (operation N/20): HEALTHY\nAC progress:\
  \ {X}/{total} satisfied. No blockers. Continuing.\n```\n\nNeeds correction:\n```\n\
  ## Mid-Task Checkpoint (operation N/20): NEEDS_CORRECTION\n⚠️ CHECKPOINT: {issue\
  \ description}\nAC progress: {X}/{total} satisfied. Blocker: {description}.\nCorrection\
  \ plan: {1-2 sentences}.\n```\n\n**Task file audit trail** — Before continuing,\
  \ append to the task's `## Status History`:\n```\n| YYYY-MM-DD | in-progress | in-progress\
  \ | CHECKPOINT {N}: {1-line summary}. AC: {X}/{total}. Blockers: {none|description}.\
  \ Continuing. |\n```\n\n**Continuity artifact write (T967):** after the self-evaluation\
  \ and the Status History row, write the **continuity artifact** so the session is\
  \ resumable from this checkpoint after a crash:\n\n```powershell\ngald3r worktree\
  \ checkpoint -TaskId {id} -Role code -Owner {owner} `\n    -Goal \"{1-line task\
  \ goal}\" `\n    -CompletedAcs \"{AC text}\",\"{AC text}\" `\n    -PendingAcs \"\
  {AC text}\",\"{AC text}\" `\n    -LastToolSummary \"{what the last operations did}\"\
  \ `\n    -NextAction \"{what this session will do next}\" `\n    -Blockers \"{none|description}\"\
  \n```\n\nThis writes `continuity_artifact.md` atomically into the worktree and updates\
  \ the `.gald3r-worktree.json` marker (`continuity_artifact_path`; `last_checkpoint_sha`\
  \ is set later by step 7b once a commit exists). The artifact is the structured\
  \ resume summary read by `g-go-code --resume T{id}`.\n\n**Rules:**\n- Checkpoint\
  \ is **mandatory** — not optional. Fires every N major operations with no exceptions.\n\
  - A task completed with ≥1 checkpoints must show those rows in `## Status History`\
  \ before being marked `[\U0001F50D]`.\n- The continuity artifact write is part of\
  \ the checkpoint — write it BEFORE any checkpoint commit so it survives a crash\
  \ mid-commit.\n- If checkpoint yields `NEEDS_CORRECTION` with an unresolvable blocker,\
  \ surface `⚠️ CHECKPOINT: [issue]` in the next message and log as Blocked in step\
  \ 6.\n- In `--swarm` mode, each bucket agent runs independent checkpoints; the coordinator\
  \ does not aggregate them.\n\n### 5. Docs Check (Per Task)\n\nAfter each task, ask:\
  \ does this add/remove/change user-facing behavior?\n- **YES** → Append entry to\
  \ `CHANGELOG.md` (root); update `README.md` if relevant section exists\n- **NO**\
  \ (internal refactor only) → skip\n\n### 5a. Auto-Learn Extraction (Per Task)\n\n\
  After the docs check, run the auto-learn extraction for each task moved to `[\U0001F50D\
  ]`:\n\n1. **Read the task's `## Status History`** and implementation notes from\
  \ the task file.\n2. **Extract**: \"Given this implementation, what architectural\
  \ decision, pattern, or watch-out should the next agent know?\" Produce 0–3 candidate\
  \ facts. Skip entirely if no meaningful insight emerges.\n3. **Dedup**: read `.gald3r/learned-facts.md`.\
  \ Skip any candidate fact that is a substring match (case-insensitive, first 80\
  \ chars) of an existing entry.\n4. **Append** novel facts with the format:\n   ```\n\
  \   - [YYYY-MM-DD] {extracted_fact} (context: T{task_id})\n   ```\n   Append under\
  \ the most appropriate heading (`## Architecture & Conventions`, `## Recurring Preferences`,\
  \ or `## Watch-Outs & Gotchas`). Create the section if missing.\n5. **Count new\
  \ facts** and include in the handoff summary: `\U0001F9E0 {N} new fact(s) learned\
  \ from T{task_id}` (omit if 0).\n6. **MCP chain** (when backend is available): call\
  \ `memory_capture_session` with the extracted facts as the session content.\n\n\
  > **Skip silently** when `.gald3r/learned-facts.md` does not exist — note in summary\
  \ as `\U0001F9E0 learned-facts.md not found — skipped`.\n> **Manual `/g-learn` still\
  \ works** as before; this step does not replace it.\n\n### 5b. Skill Authoring (Opt-In,\
  \ Complexity-Gated) (T1251)\n\nAfter Auto-Learn captures *facts*, this step optionally\
  \ captures a *procedure* — authoring a\nnew `SKILL.md` when the just-completed task\
  \ discovered a non-trivial repeatable workflow. This\ncloses the procedural-memory\
  \ loop: the skill library grows through use instead of only by hand.\nFact capture\
  \ (5a) is \"what I now know\"; skill authoring (5b) is \"how I'd do this again\"\
  .\n\n**Runs only after the task is marked `[\U0001F50D]`, before Step 6.** It is\
  \ opt-in and never blocks the\npipeline — declining or skipping is a normal outcome,\
  \ not an error.\n\n**AC1 — Complexity gate (ALL evaluated; trigger when ANY ≥1 fires):**\n\
  \n| Signal | How it is measured |\n|--------|--------------------|\n| 5+ distinct\
  \ file edits | Count `Write` + `Edit`/`StrReplace` calls in this task's b4 Handoff\
  \ Report `Files Changed` |\n| Error recovery occurred | A post-write lint/syntax\
  \ check returned `exit 2` and was fixed, OR `Issues Discovered` is non-empty |\n\
  | User course-correction | A `/steer` interrupt (Step 156 flow) was applied during\
  \ this task |\n| Non-trivial multi-step pattern | Task `complexity_score` ≥ 7 in\
  \ frontmatter, OR the locked Implementation Plan (Step 0) had ≥4 ordered steps |\n\
  \nIf **no** signal fires → skip silently (note `\U0001F9E9 skill-authoring: not\
  \ triggered (below complexity gate)`).\n\n**AC6 — Opt-out:** When the gate fires,\
  \ prompt once: *\"This task discovered a reusable\nworkflow. Author a draft skill\
  \ for it? (y/N)\"*. In autopilot / non-interactive / swarm runs the\ndefault is\
  \ **N** (defer) — record the candidate in the Handoff Report (see AC7) rather than\n\
  writing a file unprompted. Declining is **not** an error and never fails the task.\n\
  \n**AC3 — Synthesis:** When authoring proceeds, synthesize the discovered pattern\
  \ into gald3r's\nnative `SKILL.md` format (the format already defined in `AGENTS.md`).\
  \ Capture: the trigger\ncondition, the ordered procedure, the gotchas hit (from\
  \ `Issues Discovered`), and a worked\nexample. Do **not** copy task-specific identifiers\
  \ — generalize to the reusable pattern.\n\n**AC4 — Write location (canonical-first):**\
  \ Write the draft to the canonical source as an\nauto-generated skill, distinguished\
  \ by the `g-skl-auto-` prefix and `auto_generated: true`\nfrontmatter (NOT a subfolder\
  \ — the skills tree is flat for parity deployment):\n\n```\n.claude/skills/g-skl-auto-<slug>/SKILL.md\n\
  ```\n\nFrontmatter (gald3r SKILL.md standard + provenance):\n\n```yaml\n---\nname:\
  \ g-skl-auto-<slug>\ndescription: <one-line trigger + what it does>\ntags: [auto-generated,\
  \ <domain-tags>]\ncategory: auto-generated\nauto_generated: true\nsource_task: T<id>\n\
  authored_date: \"<YYYY-MM-DD>\"\nreview_status: draft   # human promotes to `reviewed`\
  \ to bless it\n---\n```\n\n> Auto-generated skills land as `review_status: draft`.\
  \ They are usable immediately but flagged\n> for human blessing — surface drafts\
  \ via `@g-skill-review`.\n\n**AC5 — Cross-platform parity:** Never hand-copy into\
  \ each IDE platform dir. After writing the\ncanonical skill, deployment to `.claude/skills/`,\
  \ `.cursor/skills/`, `.agent/skills/`, etc. is\nhandled by:\n\n```powershell\ncustom_scripts/platform_parity_sync.ps1\
  \ -SyncGaldSys -Sync\n```\n\nIn a single-repo / member-only run where cross-repo\
  \ propagation is out of scope, deploy only to\nthe **local** platform dirs of the\
  \ active repo and note that ecosystem-wide parity is deferred to\nthe next `-SyncGaldSys\
  \ -Sync`.\n\n**AC7 — Handoff Report event:** Record the outcome as a `[\U0001F4DD\
  ]` line in the task's\n`## Handoff Report` (under a `Skills Authored` note), regardless\
  \ of branch taken:\n\n```markdown\n- [\U0001F4DD] Skill authoring: <one of>\n  \
  \    authored g-skl-auto-<slug> (review_status: draft)   |\n      candidate deferred\
  \ (opt-out) — pattern: <summary>    |\n      not triggered (below complexity gate)\n\
  ```\n\nInclude a one-line summary in the handoff: `\U0001F4DD 1 draft skill authored\
  \ (g-skl-auto-<slug>)` —\nomit when not triggered.\n\n> **Skill *update*** (improving\
  \ an existing skill) is out of scope here — creation only.\n\n### 6. Question &\
  \ Blocker Collection\n\nDO NOT stop to ask. Collect silently:\n\n```markdown\n##\
  \ Deferred Items\n\n### Questions (Need Human Answer)\n- Q1: [question] (task #X)\n\
  \n### Blockers (Could Not Proceed)\n- B1: Task #X — [reason]\n\n### Decisions Made\
  \ (FYI)\n- D1: Task #X — chose A over B because [reason]\n```\n\n### 7. Record Decisions\n\
  \nBefore the handoff message, append any new decisions to `.gald3r/DECISIONS.md`:\n\
  - Use the next sequential ID after the last entry (`D{NNN}`)\n- Include: Date |\
  \ Decision | Rationale | this-agent\n\n### 7a. Coordinator-Only Shared Writes\n\n\
  For swarm mode, bucket agents are patch producers, not shared-ledger writers. They\
  \ must return:\n\n- Patch bundle or explicit changed-file list.\n- Generated artifacts\
  \ produced inside the assigned worktree.\n- Test/lint evidence.\n- Proposed Status\
  \ History rows and status transitions.\n- Requested shared writes (`.gald3r`, `CHANGELOG.md`,\
  \ generated prompts, parity sync) for the coordinator to perform.\n\nBucket agents\
  \ must not directly write or commit shared coordination surfaces:\n\n- `.gald3r/TASKS.md`,\
  \ `.gald3r/BUGS.md`, task files, bug files, archive indexes, INBOX/sent_orders ledgers.\n\
  - `CHANGELOG.md`, `README.md`, `AGENTS.md`, `CLAUDE.md`.\n- Generated Copilot prompts/instructions,\
  \ parity copies, or platform-wide sync output.\n- Final `git add`, `git commit`,\
  \ `git merge`, or broad staging commands.\n\nThe coordinator alone performs shared\
  \ writes after all bucket outputs are collected and reconciled.\n\n### 7b. Code-Complete\
  \ Checkpoint Commit\n\nDefault review handoff is branch-addressable. After successful\
  \ implementation reconciliation and shared writes, the coordinator creates a code-complete\
  \ checkpoint commit before handing work to review:\n\n0. **Continuity artifact first\
  \ (T967)**: ensure the worktree's `continuity_artifact.md` reflects the final pre-commit\
  \ state (run `gald3r worktree checkpoint ...` if it has drifted since the last mid-task\
  \ checkpoint). Writing it before the commit guarantees a crash mid-commit still\
  \ leaves a resumable artifact.\n1. Stage only intended paths by explicit allowlist.\n\
  2. Include implementation files plus coordinator-owned shared writes needed for\
  \ `[\U0001F50D]` handoff.\n3. Commit with a message that names the implemented task/bug\
  \ IDs and states that the commit is ready for independent review.\n4. Record the\
  \ checkpoint branch and commit SHA in the handoff summary, and write the SHA back\
  \ onto the marker so resume reports it: `gald3r worktree checkpoint -TaskId {id}\
  \ -Role code -Owner {owner} -CheckpointSha {sha}` (updates `last_checkpoint_sha`\
  \ + refreshes the artifact).\n\nSnapshot review mode is fallback-only. Use it when\
  \ the user explicitly requests uncommitted review, when a source cannot be made\
  \ branch-addressable, or when a failed reconciliation must be inspected read-only.\
  \ Do not make dirty snapshot mode the default.\n\n### 7b-pr. Optional GitHub PR-Open\
  \ Hook (T1291)\n\n**Run AFTER the checkpoint commit in step 7b — never before.**\
  \ This hook is triple-gated to ensure zero behavior change when GitHub integration\
  \ is disabled.\n\n**Triple-gate evaluation (must ALL be true to invoke):**\n1. Read\
  \ `.gald3r/.identity` → `project_type=software_development` (else skip silently)\n\
  2. Read `.gald3r/config/AGENT_CONFIG.md` → `github_integration: enabled` (else skip\
  \ silently)\n3. Read `.gald3r/config/AGENT_CONFIG.md` → `github_pr_hooks: enabled`\
  \ (else skip silently)\n\n**When all three gates pass:** invoke `g-pr-open --task\
  \ <id>` for each task that transitioned `[\U0001F504]→[\U0001F50D]` this session.\n\
  \n**Behavior:**\n- Invocation happens AFTER shared writes (TASKS.md, task file)\
  \ AND the checkpoint commit.\n- A PR-open failure does NOT roll back the `[\U0001F50D\
  ]` status — the implementation is done; the PR is a delivery artifact.\n- On success:\
  \ append Status History row: `| {date} | in-progress | awaiting-verification | {agent}\
  \ | PR opened: {pr_url} |`\n- On failure: append Status History row: `| {date} |\
  \ awaiting-verification | awaiting-verification | {agent} | PR-open failed: {error};\
  \ task stays [\U0001F50D] |` and surface a notice in the session summary so the\
  \ user can retry manually.\n- In `--swarm` mode: the coordinator runs this hook\
  \ once per completed task after reconciliation, not per-bucket.\n\n**Default state:**\
  \ all three flags are `disabled` / absent → behavior is byte-identical to pre-T1291.\n\
  \n### 7c. Rolling Implementation Waves\n\n`g-go-code` and `g-go-code --swarm` must\
  \ optimize for throughput. A code-complete checkpoint is a stable handoff point,\
  \ not a global stop sign.\n\nAfter a checkpoint commit is created:\n\n1. Recompute\
  \ the runnable queue immediately.\n2. Treat dependencies that are `[\U0001F50D]`\
  \ / `awaiting-verification` as implementation-satisfied when they have a branch-addressable\
  \ checkpoint and the downstream task does not declare `requires_verified_dependencies:\
  \ true`.\n3. Start the next coding wave from the latest checkpoint or member-repo\
  \ branch that contains the dependency output.\n4. Record checkpoint-dependent downstream\
  \ work in the dependent task's Status History:\n   `Started on unverified dependency\
  \ T{id} at checkpoint {sha}; rework required if review fails.`\n5. Continue coding\
  \ until no runnable work remains, a WPAC conflict appears, Workspace-Control preflight\
  \ fails, or a task explicitly requires verified dependencies.\n\nReview remains\
  \ mandatory, but `g-go-code*` only prepares the handoff. It must not start the review\
  \ lane itself. A later review failure requeues only the failed item and any downstream\
  \ tasks that explicitly consumed its checkpoint. Do not stop unrelated implementation\
  \ work merely because a prior item is awaiting review.\n\nTasks may force the old\
  \ strict behavior with:\n\n```yaml\nrequires_verified_dependencies: true\n```\n\n\
  Use that field for destructive operations, irreversible migrations, public release/signing,\
  \ production writes, security-sensitive changes, or any task whose acceptance criteria\
  \ explicitly require verified predecessor behavior.\n\n### 7d. Drain Follow-Up Queue\
  \ (T969)\n\nAfter a task's main goal is complete (all AC met, task at `[\U0001F50D\
  ]`) and before recomputing the next rolling wave, drain any follow-up prompts the\
  \ user queued for that task's worktree:\n\n```powershell\ngald3r worktree queue\
  \ -TaskId {id} -Role code -Owner {owner} -Json\n```\n\nFor each pending `- [ ]`\
  \ item returned in `items`:\n\n1. **In-scope + small** → handle it inline within\
  \ the same worktree (additional edits + the standard b1/b2/b2.5 gates), then check\
  \ the item off (`- [x]`) in `queue.md`.\n2. **Distinct deliverable** → file a real\
  \ follow-up task via `g-skl-tasks CREATE TASK` (Follow-Up Task Filing Gate — never\
  \ a slug-only name), reference the new `T{id}` next to the checked-off item, and\
  \ include it in the session summary's \"Follow-Up Tasks Filed\" block.\n\nIf `pending_count:\
  \ 0`, this step is a silent no-op. Queue draining never blocks the `[\U0001F50D\
  ]` of the main task — the main goal completing is what triggers the drain, not the\
  \ other way around.\n\n### 8. Final Status Batch + Handoff\n\nAfter all attempted\
  \ items are implemented and validated, reconcile their worktree diffs into the primary\
  \ checkout, then batch-write `.gald3r/TASKS.md`, `.gald3r/BUGS.md`, task files,\
  \ bug files, docs logs, and changelog entries for all successful items. Do not let\
  \ one item's status write block another item's worktree creation.\n\nReconciliation\
  \ rule for each successful worktree:\n1. Inspect `git status --short` in the worktree.\n\
  2. Stage only intended implementation files in the worktree with `git add -A --\
  \ {paths}` so new files are included. Never use `git add .` in a swarm worktree.\n\
  3. Export `git diff --binary --cached HEAD` from the worktree.\n4. Apply to the\
  \ primary checkout with `git apply --3way --index`.\n5. If the patch does not apply\
  \ cleanly, leave the worktree and branch intact and list the item under Skipped\
  \ / Blocked with its path.\n6. Reject or manually resolve any patch that touches\
  \ shared coordination surfaces; those changes must be represented as coordinator\
  \ requests, not applied as bucket-owned edits.\n\nAfter the final shared-write pass,\
  \ create the checkpoint commit before review. If the checkpoint commit cannot be\
  \ created, leave the implemented items at `[\U0001F50D]` only when the handoff explicitly\
  \ names snapshot mode and the dirty checkout path reviewers must inspect.\n\n```markdown\n\
  ## Implementation Session Summary\n\n> **Follow-Up Task Filing Gate**: Before writing\
  \ this summary, call `g-skl-tasks CREATE TASK` for\n> every follow-up item surfaced\
  \ during this run (deferred sub-features, out-of-scope gaps, stub\n> annotations).\
  \ Reference actual task IDs (e.g. `T1110`) — NEVER slug-style names. If task creation\n\
  > fails, log it as a BLOCKER. Named-but-not-filed follow-ups are a policy violation.\n\
  \n### Moved to [\U0001F50D] (Awaiting Verification)\n- [\U0001F50D] Task #X: {title}\n\
  - [\U0001F50D] Bug BUG-00N: {title}\n\n### Skipped (Blocked)\n- Task #Y: {reason}\n\
  \n### Deferred Questions & Blockers\n{collected items from step 5}\n\n### Follow-Up\
  \ Tasks Filed\n- T{id}: {title} — {why surfaced during this run}\n(none surfaced\
  \ — or list all filed task IDs with titles)\n\n### Decisions Made This Session\n\
  {append these to .gald3r/DECISIONS.md}\n\n### \U0001F9E0 Auto-Learn Summary\n{N}\
  \ new fact(s) appended to `.gald3r/learned-facts.md` (or \"none / file not found\"\
  ).\n\n### Handoff\n{N} task(s) / {M} bug(s) moved to [\U0001F50D].\nImplementation\
  \ checkpoint: {branch}@{commit_sha} (default review source)\nHandoff only: for independent\
  \ verification, open a NEW agent session and run @g-go-review. Do not launch that\
  \ reviewer from g-go-code.\nRolling waves: {continued|stopped}; next runnable queue:\
  \ {ids or none}; verified-dependency blockers: {ids or none}\n```\n\n## Spawned-agent\
  \ task/bug creation (T585 AC3)\n\nDuring this run, **any** task or bug a spawned\
  \ agent needs to create (deferred sub-feature,\nnewly discovered bug, follow-up)\
  \ goes into the **hot inbox**, never a direct `tasks/open/` /\n`bugs/open/` write\
  \ + index regeneration:\n\n- **Preferred** — call the engine verb (`gald3r task\
  \ create …` / `gald3r bug report …`, or the\n  `gald3r_task_*` / `gald3r_bug_*`\
  \ MCP tools). When the run marker\n  (`.gald3r/logs/ggo_run_state.json` `active:\
  \ true`, or `GALD3R_AGENT_RUN=1`) is set, the engine\n  **auto-routes** the new\
  \ item to `tasks/inbox/` / `bugs/inbox/` as an id-less, uuid-suffixed\n  draft —\
  \ no id is assigned at create time.\n- **Manual fallback** (no engine) — hand-write\
  \ the draft directly into `tasks/inbox/` /\n  `bugs/inbox/` (id-less, uuid-suffixed\
  \ filename). Do **not** write `tasks/open/` / `bugs/open/`\n  or touch `TASKS.md`\
  \ / `BUGS.md`.\n\nThe hot-inbox **intake** (run at each iteration boundary — see\
  \ the inbox-intake step) is the\n*single ID-assigning authority*: it assigns ids\
  \ atomically, so N concurrent agents can never\ncollide on the next id. This is\
  \ the spawn-side complement of that intake step.\n\n## Behavioral Rules\n\n| Rule\
  \ | Why |\n|------|-----|\n| Never ask questions mid-execution | Uninterrupted autonomous\
  \ work |\n| Never spawn reviewer agents from g-go-code* | Implementation mode stays\
  \ focused on coding and readiness checks |\n| Mark completed items `[\U0001F50D\
  ]`, never `[✅]` | Enforce independent verification gate |\n| Keep coding across\
  \ `[\U0001F50D]` dependencies unless strict verification is declared | Preserve\
  \ fast product development while review catches up |\n| Log every decision made\
  \ | Future agents and humans need the audit trail |\n| Skip tasks you can't complete\
  \ | Maximize total output |\n| Respect CONSTRAINTS.md | Never violate project guardrails\
  \ |\n| Abort if destructive (schema drop, data loss) | Safety first — log it as\
  \ a blocker |\n\n\n### WPAC inbox Heartbeats (Swarm / Long Runs)\n\nFor swarm mode\
  \ or any run lasting more than 30 minutes, the coordinator reruns the WPAC inbox\
  \ check every 30 minutes and once more before the final summary. If a conflict appears\
  \ mid-run, pause new claims/spawns/reconciliation, preserve worktrees and partial\
  \ outputs, and require `@g-wpac-read` before continuing.\n\n## Swarm Mode (`--swarm`)\n\
  \nWhen `$ARGUMENTS` includes `--swarm`, activate the **COORDINATOR PHASE** before\
  \ any implementation.\nSwarm mode partitions the work queue into conflict-safe buckets\
  \ and spawns N parallel agents.\n\n### Coordinator Phase (runs FIRST when --swarm\
  \ is present)\n\n**Step S1: Build full work queue** — same rules as standard mode\
  \ (Steps 1–2 above), including skipping non-expired `[\U0001F4DD]` speccing claims\
  \ and logging stale-claim takeovers.\n\n**Step S2: Evaluate swarm eligibility after\
  \ workspace preflight**\n- If 0 qualifying items remain → exit with the existing\
  \ empty queue or blocker message.\n- If workspace preflight rejects a candidate\
  \ (unknown `workspace_repos` member, target path is not a git root, unauthorized\
  \ member write, or similar Workspace-Control denial) → stop with a blocker message.\
  \ Do not offer swarm fallback for invalid workspace routing.\n- If exactly 1 qualifying\
  \ item remains and preflight passes → automatically downgrade to standard single-agent\
  \ implementation mode and continue without asking for confirmation:\n  `[SWARM]\
  \ Single runnable item — auto-downgrading to @g-go-code standard mode`\n- If 2 or\
  \ more qualifying items remain → continue with swarm agent-count calculation and\
  \ partitioning.\n- After each checkpoint, rerun S1/S2 as a rolling wave. Previously\
  \ completed `[\U0001F50D]` dependencies from this or earlier checkpoints count as\
  \ implementation-satisfied unless a downstream task declares `requires_verified_dependencies:\
  \ true`.\n\n**Step S3: Compute agent count** (Smart Agent Count Formula)\n\n| Queue\
  \ size | Agents |\n|-----------|--------|\n| 1 | 1 (no swarm — fallback) |\n| 2–4\
  \ | 2 |\n| 5–9 | `ceil(count / 3)` (2–3) |\n| 10–14 | 4 |\n| 15+ | 5 (hard cap)\
  \ |\n\n**Step S4: Partition into conflict-safe buckets**\n\n```\n1. Build conflict_graph:\n\
  \   For each pair (A, B) in work_queue:\n     CONFLICT if: shared subsystem in subsystems[]\
  \ OR A depends_on B OR B depends_on A\n\n2. Greedy partition:\n   Sort work_queue\
  \ by priority (Critical→Low)\n   For each item:\n     Assign to the first existing\
  \ bucket with no conflict with any item already in it\n     If no bucket fits →\
  \ open new bucket (up to agent_count limit)\n     If max buckets hit → assign to\
  \ smallest bucket (accept conflict; note it)\n\n3. Output: buckets = [[task_ids...],\
  \ [task_ids...], ...]\n```\n\n**Primary axis**: subsystem boundaries (same subsystem\
  \ → same bucket).\n**Secondary axis**: file-lock zones (tasks both touching TASKS.md/BUGS.md\
  \ directly → same bucket).\n**Dependency rule**: if A depends on B → same bucket,\
  \ or B's bucket runs first.\n\n**File-scope output (T1059 lock claim)**: alongside\
  \ `buckets = [[task_ids...]]`, record each bucket's planned file set (`bucket_planned_paths`\
  \ = the union of its tasks' `workspace_repos` / planned touch set / subsystem-to-file\
  \ mapping, as repo-relative paths). Because buckets are partitioned on subsystem/file\
  \ boundaries, these sets do not overlap by construction. Each set is passed verbatim\
  \ to `-LockFiles` at Step S6 so overlaps are enforced as `LOCK_CONFLICT` at worktree-create\
  \ time.\n\n**Step S5: Display partition plan**\n```\n[SWARM] Work queue: {M} items\
  \ → {N} agents\n  Bucket 1: Task 7 (vault-knowledge-store), Task 9 (vault-knowledge-store)\n\
  \  Bucket 2: Task 10 (task-lifecycle-management), Task 11 (behavioral-rules-engine)\n\
  \  Bucket 3: Task 12 (cross-project-coordination-WPAC)\nSpawning {N} implementation\
  \ agents...\n```\n\n**Step S6: Spawn sub-agents**\n- Before spawning, create or\
  \ reuse one coding worktree per bucket:\n  ```powershell\n  gald3r worktree create\
  \ -TaskId bucket-{bucket_number} -Role code-swarm -BucketId {bucket_number} -LockFiles\
  \ {bucket_planned_paths} -BucketTtlMinutes 60 -StaleBaseAction Recreate -Json\n\
  \  ```\n  Owner is auto-resolved (T580/BUG-612) — see Step 3's owner-resolution\
  \ note above; omit `-Owner` here too unless you need an explicit override.\n  **`-StaleBaseAction\
  \ Recreate` is mandatory for rolling-wave bucket worktrees.** Without it,\n  iteration-2+\
  \ bucket worktrees silently reuse the iteration-1 worktrees (same `TaskId\n  bucket-N`),\
  \ which forked from the session-start HEAD. Implementers then miss all Alembic\n\
  \  migrations, model files, and router wiring committed by prior iterations. With\
  \ `Recreate`,\n  the helper detects that the stored `base_sha` predates the current\
  \ HEAD, removes the stale\n  worktree, and creates a fresh one from the latest commit.\
  \ Task-specific worktrees (not\n  bucket worktrees) should default to `-StaleBaseAction\
  \ Warn` so stale-base conditions are\n  surfaced but not silently discarded.\n-\
  \ **Swarm file-lock claim (T1059, mandatory for `code-swarm`).** `-BucketId {bucket_number}`\
  \ plus `-LockFiles {bucket_planned_paths}` (the bucket's planned file set from Step\
  \ S4) make the helper write a lock manifest *before* the worktree exists. If another\
  \ active bucket already claims an overlapping path, `-Action Create` fails with\
  \ `LOCK_CONFLICT` and the colliding bucket is never spawned. `-Role code-swarm`\
  \ **fails closed** (`LOCK_REQUIRED`) when `-LockFiles` is empty, so the lock layer\
  \ can never silently no-op. Routing every bucket through `gald3r worktree` is what\
  \ makes the lock apply — do not create bucket worktrees by any other path. `-BucketTtlMinutes\
  \ 60` sets the claim lifetime (expiry = created_at + 2×TTL).\n- Branch/worktree\
  \ names must include the bucket role plus repo/owner suffix from the helper contract.\n\
  - Each bucket agent receives its assigned `worktree_path` and `worktree_branch`\
  \ and must run implementation from that worktree root.\n- Bucket agents MUST NOT\
  \ directly write shared `.gald3r/TASKS.md` / `.gald3r/BUGS.md`, task/bug status\
  \ files, `CHANGELOG.md`, generated Copilot prompts, parity output, or commits. They\
  \ return proposed status changes, changed-file inventory, generated artifacts, and\
  \ evidence to the coordinator.\n- Bucket agents MUST NOT run `git add .`; use explicit\
  \ path staging only when creating a patch bundle, and exclude `.gald3r-worktree.json`,\
  \ worktree ownership metadata, terminal transcripts, local logs, and other non-deliverable\
  \ artifacts.\n- Use the Agent tool to spawn N agents, each receiving:\n  - The full\
  \ `g-go-code` prompt (this command file content)\n  - A `tasks X, Y, Z` filter argument\
  \ restricting to that bucket's items only\n  - The bucket worktree metadata\n- Run\
  \ all agents. Each follows the standard protocol on its slice.\n\n**Step S7: Collect\
  \ and merge**\nAfter all sub-agents complete:\n0. **Lock report (T1059)**: before\
  \ reconciling, run `gald3r worktree lock-report -Json` and surface any multi-bucket\
  \ path in the session summary as a `WARN` (not a hard block) — this complements\
  \ the overlap check in step 2 and the Swarm Reconciliation Gate.\n1. Inspect each\
  \ bucket worktree with `git status --short` and `git diff --stat`.\n2. Detect overlapping\
  \ shared-file edits before applying patches. If two buckets request the same shared\
  \ file, defer that file to the coordinator's final write.\n3. Reconcile one bucket\
  \ at a time: stage only intended bucket files in the bucket worktree with `git add\
  \ -A -- {paths}`, export `git diff --binary --cached HEAD`, then apply it to the\
  \ primary checkout with `git apply --3way --index`; do not overwrite user edits.\n\
  4. If reconciliation cannot be completed cleanly, leave the bucket worktree and\
  \ branch intact and list it under Skipped / Blocked with its path.\n5. Batch-write\
  \ `.gald3r/TASKS.md`, `.gald3r/BUGS.md`, task files, bug files, `CHANGELOG.md`,\
  \ generated Copilot prompts/instructions, and parity outputs only after bucket outputs\
  \ are reconciled.\n6. Run parity sync and prompt regeneration at most once from\
  \ the coordinator after final shared writes.\n7. Create one code-complete checkpoint\
  \ commit from the primary checkout so review swarms can create clean `review-swarm`\
  \ worktrees from a committed source.\n8. Recompute the work queue for the next rolling\
  \ wave. Continue immediately when new items become runnable through `[\U0001F50D\
  ]` checkpoint dependencies and no strict verification gate applies.\n9. Write the\
  \ unified handoff when no further coding wave can run:\n\n```markdown\n## Swarm\
  \ Implementation Session Summary\n\n### Swarm Configuration\n- Agents spawned: N\n\
  - Partition strategy: subsystem-boundary\n- Total items in queue: M\n\n### Bucket\
  \ Results\n| Bucket | Agent | Tasks | Status |\n|--------|-------|-------|--------|\n\
  | 1 | Agent-1 | 7, 9 | [\U0001F50D] ×2 |\n| 2 | Agent-2 | 10, 11 | [\U0001F50D]\
  \ ×1, Blocked ×1 |\n\n### Moved to [\U0001F50D] (Awaiting Verification)\n{merged\
  \ list from all agents}\n\n### Skipped / Blocked\n{merged list from all agents}\n\
  \n### Follow-Up Tasks Filed\n- T{id}: {title} — {why surfaced}\n(none surfaced —\
  \ or list all filed task IDs with titles. Named-but-not-filed follow-ups are a policy\
  \ violation.)\n\n### Handoff\n{total} task(s) / {total} bug(s) moved to [\U0001F50D\
  ].\nImplementation checkpoint: {branch}@{commit_sha} (default review-swarm source)\n\
  Handoff only: for independent verification, open a NEW agent session and run @g-go-review\
  \ --swarm. Do not launch that reviewer from g-go-code-swarm.\nRolling waves completed:\
  \ {count}; checkpoint-dependent downstream items: {ids}; strict verified-dependency\
  \ blockers: {ids or none}\n```\n\n---\n\n## Usage Examples\n\n```\n@g-go-code\n\
  @g-go-code tasks 14, 15\n@g-go-code bugs BUG-001, BUG-002\n@g-go-code subsystem\
  \ cross-project\n@g-go-code bugs-only\n@g-go-code --swarm\n@g-go-code --swarm tasks\
  \ 7, 9, 10, 11, 12\n@g-go-code --swarm bugs-only\n@g-go-code --mode fast tasks 14,\
  \ 15\n@g-go-code --mode standard tasks 14, 15\n@g-go-code --mode cheap bugs BUG-001\n\
  @g-go-code --swarm --mode fast\n@g-go-code --max-iterations 3 tasks 14, 15, 16,\
  \ 17, 18\n@g-go-code --timeout-minutes 15 bugs-only\n@g-go-code --max-iterations\
  \ 10 --timeout-minutes 60 --swarm\n@g-go-code --max-iterations 1 tasks 14\n@g-go-code\
  \ --skip-post-lint docs-only\n```\n\n`--skip-post-lint` suppresses the per-write\
  \ `post_write_lint` delta-lint step (Step 4 b1) for the\nsession — use it for documentation-only\
  \ / `TASKS.md`-update runs where a syntax linter has nothing\nto check. It does\
  \ not disable the b2 AC gate or b3.5 DoD gate.\n\n`--mode fast` and `--mode cheap`\
  \ are equivalent (both → haiku-class). `--mode standard` is\nthe explicit form of\
  \ the default (sonnet-class). Omit the flag to inherit the host IDE's\ncurrent model.\n\
  \n`--max-iterations N` caps the total item count for the session (default `5`, env\
  \ override\n`GALD3R_MAX_ITERATIONS`). `--timeout-minutes M` caps the wall-clock\
  \ budget (default `30`,\nenv override `GALD3R_TIMEOUT_MINUTES`). Whichever hits\
  \ first stops new claims cleanly; the\nin-flight item finishes and the session writes\
  \ its summary. See \"Iteration and Timeout\nLimits\" above for full semantics.\n\
  \nLet's implement.\n\n## Push offer (final session summary only)\n\nAfter all items\
  \ are marked `[\U0001F50D]` and the session summary is written, include a single\
  \ push offer:\n\n```\n{N} commits are ready on {branch}. Review and push when satisfied:\n\
  \  git log origin/{branch}..HEAD --oneline\n  git push origin {branch}\nWant me\
  \ to push now?\n```\n\n**Rules:** Offer push **once**, at the end of the session\
  \ summary only. Do NOT offer push after each individual task commit — the session\
  \ is still running. If the user replies \"yes\": push immediately.\n\n\n## Structured\
  \ output (`--json` / `--toon`) — T1381 / T1382\n\nThis command supports machine-readable\
  \ output in addition to its default text/markdown:\n\n- `--json` → structured JSON\
  \ envelope via **g-skl-json-output** (`{ gald3r_version, generated_at, command,\
  \ schema, data }`). For scripting, CI gates, dashboards.\n- `--toon` → **g-skl-toon-output**\
  \ TOON: compact, lossless, LLM-friendly (tabular arrays state keys once; ≥20% smaller\
  \ than JSON). For agent handoff / context injection / vault ingestion.\n- `--md`\
  \ forces markdown. With no flag, AGENT_CONFIG `output_format` decides (default `markdown`,\
  \ unchanged).\n\nOutput is saved to `html_output_dir` (default `docs/`) as `YYYYMMDD_HHMMSS_<IDE>_<TOPIC>.json|.toon`\
  \ per g-rl-01."
