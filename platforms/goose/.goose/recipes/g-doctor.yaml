version: 1.0.0
title: g-doctor
description: '@g-doctor — Environment Health Check'
instructions: "# @g-doctor — Environment Health Check\n\nValidate the complete gald3r\
  \ environment: Docker MCP health, `.gald3r/` structure, vault configuration,\ntask\
  \ sync state, and platform IDE targets. Outputs a structured pass/fail report with\
  \ fix suggestions.\n\n```\n@g-doctor                # Full health report (read-only)\n\
  @g-doctor --fix          # Apply safe auto-fixes (narrow scope — see below)\n@g-doctor\
  \ identity       # Identity & Config checks only\n@g-doctor tasks          # Task\
  \ sync checks only\n@g-doctor mcp            # MCP / Docker checks only\n@g-doctor\
  \ vault          # Vault checks only\n@g-doctor platform       # Platform IDE parity\
  \ checks only\n```\n\n**Fix scope is intentionally narrow** (the OpenClaw 5.5 lesson\
  \ — their `doctor --fix` silently\nrerouted API calls and broke user setups overnight):\n\
  - Creates missing `.gald3r/` subdirectories\n- Writes a minimal `.gald3r/.identity`\
  \ stub when the file is absent\n- **NEVER** touches routing, credentials, connection\
  \ types, or task state\n\n---\n\n## Execution Protocol\n\n### Step 1: Run the Python\
  \ Script\n\n```bash\nscriptPath=\"\"\nfor cand in \\\n    \"gald3r doctor\" \\\n\
  \    \"gald3r doctor\" \\\n    \"gald3r doctor\"; do\n    if [ -f \"$cand\" ]; then\
  \ scriptPath=\"$cand\"; break; fi\ndone\n\nif [ -n \"$scriptPath\" ]; then\n   \
  \ fixFlag=\"\"; [ \"$*\" = \"${*/--fix/}\" ] || fixFlag=\"-Fix\"\n    catFlag=\"\
  \"\n    for c in identity tasks mcp vault platform; do\n        case \" $* \" in\
  \ *\" $c \"*) catFlag=\"-Category $c\";; esac\n    done\n    python \"$scriptPath\"\
  \ $fixFlag $catFlag\nelse\n    echo \"⚠️ gald3r doctor not found — running AI-assisted\
  \ checks below.\"\nfi\n```\n\nIf the script is present, display its output and stop.\
  \ Exit code 1 = at least one FAIL.\n\n### Step 2: AI-Assisted Checks (fallback when\
  \ script is absent)\n\nIf the script could not be located, perform the following\
  \ checks manually:\n\n---\n\n## Check Categories\n\n### 1. Identity & Config\n\n\
  **AC3 — `.gald3r/.identity` validation**\n\nRead `.gald3r/.identity` (key=value\
  \ format, no quotes). Verify these fields are present and non-empty:\n- `project_id`\
  \ — stable UUID, set by `gald3r_install`\n- `gald3r_version` — installed framework\
  \ version\n- `vault_location` — path or `{LOCAL}`\n\n```\n✅ PASS  identity/.identity\
  \ fields  — project_id, gald3r_version, vault_location all present\n❌ FAIL  identity/.identity\
  \ fields  — Missing: project_id, gald3r_version\n         \U0001F4A1 Edit .gald3r/.identity\
  \ and add the missing fields\n```\n\n**`.gald3r/` structure check**\n\nVerify presence\
  \ of: `TASKS.md`, `PLAN.md`, `PROJECT.md`, `CONSTRAINTS.md`, `BUGS.md`, `SUBSYSTEMS.md`\n\
  and subdirectories: `tasks/`, `bugs/`, `subsystems/`\n\nMissing files → `⚠️ WARN`\
  \ (not FAIL — partial setups are valid during onboarding).\n\n---\n\n### 2. Task\
  \ State\n\n**AC5 — Task sync: TASKS.md ↔ tasks/ directory**\n\nParse task IDs from\
  \ `TASKS.md` using both row formats:\n- Table rows: `| [status] | [NNN](tasks/taskNNN_*.md)\
  \ |`\n- Bullet rows: `- [status] **Task NNN**:`\n\nCompare against `tasks/task*.md`\
  \ filenames.\n\n```\n⚠️ WARN  tasks/phantom  — 2 phantom task(s) in TASKS.md with\
  \ no task file: 45, 112\n         \U0001F4A1 Create missing task files or remove\
  \ stale TASKS.md rows\n⚠️ WARN  tasks/orphan   — 1 orphan task file(s) not in TASKS.md:\
  \ 88\n         \U0001F4A1 Add missing rows to TASKS.md or archive stale files\n\
  ```\n\nPhantom tasks and orphan files are `⚠️ WARN` (not `❌ FAIL`) unless count\
  \ > 10.\n\n---\n\n### 3. MCP / Docker\n\n**AC2 — Docker MCP server health**\n\n\
  1. Run `docker info` — PASS if exit 0, WARN if docker not found, FAIL if exit non-zero.\n\
  2. Run `docker ps --filter name=gald3r` — PASS if a container matches.\n3. HTTP\
  \ GET `http://localhost:8092/health` with 5s timeout:\n   - 200 → `✅ PASS`\n   -\
  \ Non-200 → `⚠️ WARN` with status code\n   - Unreachable → `⚠️ WARN` (WARN not FAIL\
  \ — Docker is optional for file-first projects)\n4. Check `node`, `python`, `uv`\
  \ availability via `--version`.\n\n---\n\n### 4. Vault\n\n**AC4 — Vault path validation**\n\
  \nRead `vault_location=` from `.gald3r/.identity`:\n- `{LOCAL}` → look for `vault/`\
  \ relative to project root; check for `_index.yaml`\n- Absolute path → `Test-Path`\
  \ the directory; check for `_index.yaml`\n- HTTP/HTTPS URL → **AC7**: attempt `Invoke-WebRequest`\
  \ with 8s timeout\n\n```\n✅ PASS  vault/location    — vault_location={LOCAL} (local\
  \ vault mode)\n⚠️ WARN  vault/index       — vault/_index.yaml missing\n        \
  \ \U0001F4A1 Run @g-vault-lint to regenerate the index\n❌ FAIL  vault/directory\
  \   — Vault directory not found: <vault_path>\n         \U0001F4A1 Update vault_location\
  \ in .gald3r/.identity or create the directory\n```\n\n---\n\n### 5. Platform IDE\
  \ Parity\n\n**AC6 — Platform targets check**\n\nVerify directory presence for: `.cursor/`,\
  \ `.claude/`, `.agent/`, `.codex/`, `.opencode/`, `.copilot/`\n\nFor `.cursor/`\
  \ and `.claude/` (primary surfaces), also verify `commands/` and `skills/` subdirectories\n\
  and report file counts.\n\nMissing platforms → `⚠️ WARN` with fix suggestion (not\
  \ `❌ FAIL`).\n\n---\n\n### 6. Skills Quality (T1172 / T1259)\n\n**Missing `token_budget:`\
  \ declaration**\n\nScan all canonical SKILL.md files under `.claude/skills/` and\
  \ `.gald3r_sys/skill_packs/`,\nplus the IDE mirrors `.cursor/skills/`, `.claude/skills/`,\
  \ `.codex/skills/`,\n`.opencode/skills/`, `.agent/skills/`. For each SKILL.md, read\
  \ the YAML frontmatter\nand check for the `token_budget:` field.\n\n```\n⚠️ WARN\
  \  skills/token_budget  — N skill(s) missing token_budget: declaration\n       \
  \  \U0001F4A1 Add `token_budget: low|medium|high|very_high` to each skill's frontmatter.\n\
  \            See .gald3r_sys/skill_packs/user-skills/skl-skill-create/SKILL.md\n\
  \            §\"token_budget: declaration (T1172)\" for the band guide.\n```\n\n\
  This is a **low-severity finding** (`⚠️ WARN`, never `❌ FAIL`). Skills without\n\
  `token_budget:` still work — the field is advisory metadata for `g-go`\ncoordinators\
  \ and budget-aware swarm dispatch. The finding surfaces the gap so\nauthors can\
  \ declare it during their next pass.\n\n**Missing `skill_trust_level:` declaration**\
  \ (parallel finding, T1056)\n\nSame scan; check for the `skill_trust_level:` field.\
  \ Same severity (`⚠️ WARN`).\n\n```\n⚠️ WARN  skills/skill_trust_level  — N skill(s)\
  \ missing skill_trust_level: declaration\n         \U0001F4A1 Add `skill_trust_level:\
  \ core|community|local` to each skill's frontmatter.\n            See .gald3r_sys/skill_packs/user-skills/skl-skill-create/SKILL.md\n\
  \            §\"skill_trust_level: declaration (T1056)\" for the values.\n```\n\n\
  **Reporting**: list the first 10 offending skill names; if more, append `... and\
  \ N more`.\nGroup the two findings under a `## Skills Quality` heading in the report\
  \ body when any\nskill is missing either field.\n\n---\n\n## Output Format\n\n**AC8\
  \ — Structured report**\n\n```\ngald3r doctor — Environment Health Report\n==================================================\n\
  \n✅ PASS  identity/.identity fields     — project_id, gald3r_version, vault_location\
  \ all present\n⚠️ WARN  mcp/health-endpoint          — MCP server not reachable\
  \ at http://localhost:8092/health\n         \U0001F4A1 Run: cd docker && docker\
  \ compose up -d\n❌ FAIL  vault/directory               — Vault directory not found:\
  \ <shared_vault>\n         \U0001F4A1 Update vault_location in .gald3r/.identity\
  \ or create the directory\n\n==================================================\n\
  Summary: ✅ 12 PASS  ⚠️  1 WARN  ❌ 1 FAIL\n```\n\n- One line per check: `[status]\
  \  [check name]  — [detail]`\n- Fix hint on the next line, indented, prefixed with\
  \ `\U0001F4A1`\n- Summary line at the end\n- Exit code: `0` = all PASS/WARN, `1`\
  \ = any FAIL\n\n---\n\n## When to Use\n\n- Before starting a new gald3r session\
  \ to verify environment is healthy\n- After installing or upgrading gald3r in a\
  \ project\n- When MCP tools behave unexpectedly\n- As part of a CI preflight check\
  \ (script exits 1 on any FAIL)\n- When onboarding a new project member\n\n## Related\
  \ Commands\n\n- `@g-setup` — Initialize or repair a gald3r project\n- `@g-medic`\
  \ — Deep `.gald3r/` structural health and intervention\n- `@g-status` — Project\
  \ task/bug/phase status overview\n- `@g-vault-lint` — Vault integrity check and\
  \ index regeneration"
prompt: Run the gald3r `g-doctor` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-doctor, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
