version: 1.0.0
title: g-codeowners-gen
description: 'Generate .github/CODEOWNERS from subsystem owners: $ARGUMENTS'
instructions: "Generate .github/CODEOWNERS from subsystem owners: $ARGUMENTS\n\nAuto-generates\
  \ `.github/CODEOWNERS` from `.gald3r/subsystems/*.md` frontmatter\n(`owners:` +\
  \ `locations.code:`, T1298/T1299). Part of the optional GitHub\nIntegration Bundle\
  \ (`project_type=software_development`).\n\n## Gate (first)\n\nIf `.gald3r/.identity`\
  \ `project_type` is not `software_development`, or no subsystem\nspec declares a\
  \ non-empty `owners:` list → **no-op** with a friendly message. No\nGitHub network\
  \ call is ever made (this only reads local specs and writes a file).\n\n## Behavior\n\
  \nRuns the helper `.claude/skills/g-skl-github-pr/scripts/codeowners_gen.py`:\n\n\
  1. Read every `.gald3r/subsystems/**/*.md` spec (skipping `SUBSYSTEM*` index/graph\
  \ artifacts).\n2. For each spec with a non-empty `owners:` list, emit one CODEOWNERS\
  \ line per\n   `locations.code:` path → owners (usernames get a leading `@`; `@org/team`\
  \ slugs pass through).\n3. Write `.github/CODEOWNERS` with the header\n   `# Auto-generated\
  \ by g-codeowners-gen — do not hand-edit above the marker.`\n4. **Preserve** anything\
  \ below the `# CUSTOM ENTRIES BELOW` marker on regeneration.\n5. UTF-8 without BOM.\n\
  \n```powershell\nuv run python .claude/skills/g-skl-github-pr/scripts/codeowners_gen.py\
  \ -DryRun\nuv run python .claude/skills/g-skl-github-pr/scripts/codeowners_gen.py\n\
  ```\n\n## Flags\n\n| Flag | Effect |\n|---|---|\n| `--dry-run` | Print the would-be\
  \ CODEOWNERS to stdout without writing the file |\n\n## Notes\n\n- Idempotent and\
  \ safe to re-run; the auto block is rewritten, custom entries kept.\n- Populate\
  \ a subsystem's `owners:` via `g-skl-subsystems` (T1298).\n- Pairs with the \"Require\
  \ review from Code Owners\" branch-protection rule\n  (`.gald3r/config/branch_protection.md`,\
  \ T1295)."
prompt: Run the gald3r `g-codeowners-gen` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-codeowners-gen, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
