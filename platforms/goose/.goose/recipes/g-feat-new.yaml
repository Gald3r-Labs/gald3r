version: 1.0.0
title: g-feat-new
description: '> **Deprecated**: Use `@g-feat-add` instead. This alias is kept for
  backward compatibility.'
instructions: '> **Deprecated**: Use `@g-feat-add` instead. This alias is kept for
  backward compatibility.


  Stage a new feature in the feature backlog. Activates **g-skl-features** → STAGE
  operation.


  Creates `features/featNNN_slug.md` with `status: staging`. Does NOT create tasks.'
prompt: Run the gald3r `g-feat-new` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-feat-new, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
