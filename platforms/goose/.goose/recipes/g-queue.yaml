version: 1.0.0
title: g-queue
description: 'Queue follow-up work into a running g-go-code worktree session, to run
  after the main goal completes: $ARGUMENTS'
instructions: "Queue follow-up work into a running g-go-code worktree session, to\
  \ run after the main goal completes: $ARGUMENTS\n\n## Usage\n- `@g-queue T{id} \"\
  <follow-up prompt>\"` — append a follow-up item to the running session's queue\n\
  - `@g-queue T{id} --role code --owner {owner} \"<follow-up prompt>\"` — disambiguate\
  \ when multiple worktrees exist for the same task\n- `@g-queue T{id} --list` — read\
  \ the pending follow-up queue without appending\n\n## What it does\n\n`@g-queue`\
  \ appends a follow-up prompt to `queue.md` at the **worktree root** of an in-flight\n\
  `g-go-code` task. Unlike `@g-steer` (which interrupts the current trajectory immediately),\
  \ queued\nitems are **not** processed mid-task — they are drained only after the\
  \ main goal's acceptance criteria\nare all met and the task reaches `[\U0001F50D\
  ]` (g-go-code step 7d).\n\n`queue.md` is an append-only checklist (`- [ ]` per item).\
  \ Each call adds one item; ordering is\npreserved. This lets you stack up \"while\
  \ you're in there, also do X\" work without disrupting the\ncurrent goal or losing\
  \ the worktree's context.\n\n## Sub-operations\n\n### Append a follow-up (`@g-queue\
  \ T{id} \"<prompt>\"`)\n\n1. Parse `T{id}` (the target task) and the quoted `<follow-up\
  \ prompt>` text from `$ARGUMENTS`.\n   Default `--role code` and `--owner` to the\
  \ current session owner when not supplied.\n2. Invoke the worktree helper to append\
  \ the item:\n   ```powershell\n   gald3r worktree queue -TaskId {id} -Role code\
  \ -Owner {owner} -QueueText \"<follow-up prompt>\" -Json\n   ```\n   Checkouts that\
  \ ship a root `gald3r worktree` copy (the gald3r source repo)\n   may call the helper\
  \ from there instead.\n3. The helper creates `queue.md` with a header on first write,\
  \ then appends `- [ ] <prompt>` (internal\n   newlines collapsed so each item stays\
  \ on one row).\n4. Confirm to user: `\U0001F4E5 Queued for T{id} — will be processed\
  \ after the main goal completes ({pending_count} pending).`\n\n### List the queue\
  \ (`@g-queue T{id} --list`)\n\n```powershell\ngald3r worktree queue -TaskId {id}\
  \ -Role code -Owner {owner} -Json\n```\n\nReturns `pending_count` and the `items`\
  \ array. Display each pending item; report `(empty)` when none.\n\nIf no gald3r-owned\
  \ worktree exists for `T{id}` / role / owner, the helper errors — there is no running\n\
  session to queue against. Start one with `@g-go-code tasks {id}` first.\n\n## How\
  \ the running session drains it\n\n`g-go-code` step 7d (Drain Follow-Up Queue) runs\
  \ after the main task reaches `[\U0001F50D]`:\n\n- **In-scope + small** items →\
  \ handled inline within the same worktree, then checked off (`- [x]`).\n- **Distinct\
  \ deliverables** → filed as real follow-up tasks via `g-skl-tasks CREATE TASK` (Follow-Up\n\
  \  Task Filing Gate — never a slug-only name) and referenced next to the checked-off\
  \ item.\n\nDraining never blocks the `[\U0001F50D]` of the main task.\n\n## Related\n\
  \n- Command: `g-steer` — one-shot mid-flight steering (interrupts the current trajectory)\n\
  - Command: `g-go-code` — the session that drains `queue.md` (see step 7d + \"Mid-Flight\
  \ Course Correction\")\n- Helper: `gald3r worktree` (`-Action Queue`)\n- Spec: T969\
  \ — Worktree /steer + /queue\n- File: `<worktree>/queue.md` (append-only checklist)\n\
  \nLet's queue."
prompt: Run the gald3r `g-queue` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-queue, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
