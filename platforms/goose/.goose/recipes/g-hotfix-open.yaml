version: 1.0.0
title: g-hotfix-open
description: 'Open an urgent hotfix branch + task from the latest release tag: $ARGUMENTS'
instructions: "Open an urgent hotfix branch + task from the latest release tag: $ARGUMENTS\n\
  \nHotfix workflow command (T1307). Branches from the latest release tag, scaffolds\
  \ a\n`type: hotfix` task, allocates a T170 worktree, and optionally opens a Draft\
  \ PR. Part of\nthe GitHub Integration Bundle (`project_type=software_development`),\
  \ but the branch/task/\nworktree scaffolding works even when `github_integration:\
  \ disabled` (only the PR step is gated).\n\n## Behavior\n\n1. **Resolve base tag**:\
  \ `git describe --tags --abbrev=0` (or `--from-tag <tag>`).\n2. **Create branch**:\
  \ `hotfix/{tag}-{slug}` cut from that tag (not from `main`).\n3. **Scaffold task**\
  \ via `g-skl-tasks` CREATE TASK:\n   - `type: hotfix`, `priority: high` (or `critical`\
  \ if stated).\n   - `target_branches: [main]` (add `develop` when a `develop` branch\
  \ exists — Gitflow).\n   - `--description <text>` populates the objective.\n4. **Allocate\
  \ worktree**: `gald3r worktree create` on the hotfix branch (records\n   `worktree_branch`,\
  \ `worktree_owner`, etc. in the task frontmatter).\n5. **Optional Draft PR**: if\
  \ `github_integration: enabled` and not `--no-pr`, invoke\n   `g-pr-open --task\
  \ <id>` (base = `main`).\n6. **Cherry-pick guidance**: print the post-merge step\
  \ — after the hotfix merges to `main`,\n   cherry-pick the fix commit(s) onto `develop`\
  \ (if Gitflow) so the fix isn't lost on the next\n   release: `git checkout develop\
  \ && git cherry-pick <sha>...`.\n\n## Flags\n\n| Flag | Effect |\n|---|---|\n| `--from-tag\
  \ <tag>` | Override the base tag (default: latest `git describe`) |\n| `--no-pr`\
  \ | Skip the auto Draft-PR open even when integration is enabled |\n| `--description\
  \ <text>` | Task description / objective |\n\n## Notes\n\n- `hotfix/*` branches\
  \ are exempt from the \"require branches up to date\" rule in\n  `.gald3r/config/branch_protection.md`\
  \ (T1295) for speed; they still require PR + checks.\n- Cherry-pick to `develop`\
  \ is **guidance only** — the command never force-pushes or\n  cherry-picks automatically\
  \ (Autonomous Push Gate, g-rl-33).\n- Helper logic lives in `g-skl-github-pr` (HOTFIX\
  \ scaffolding)."
prompt: Run the gald3r `g-hotfix-open` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-hotfix-open, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
