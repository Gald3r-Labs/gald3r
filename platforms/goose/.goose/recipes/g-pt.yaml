version: 1.0.0
title: g-pt
description: 'Manage workflow profiles (project types): $ARGUMENTS'
instructions: "Manage workflow profiles (project types): $ARGUMENTS\n\n`@g-pt` (\"\
  project type\") lists, switches, copies, locates, and validates gald3r\n**Workflow\
  \ Profiles** — the per-domain task-lifecycle vocabularies under\n`.gald3r/config/workflow_profiles/*.yaml`\
  \ that `gald3r project-type resolve` (T1239/T1335)\nresolves at runtime. It is the\
  \ management front-end for those profiles, so you\nnever have to hand-edit the YAML\
  \ to switch or fork one.\n\n> Not to be confused with `@g-workflow` (task complexity-scoring\
  \ / sprint\n> planning) — that is a separate, unrelated command. `@g-pt` only touches\n\
  > workflow profiles.\n\n## Behavior\n\nRuns the helper `gald3r project-type`:\n\n\
  ```powershell\ngald3r project-type list\ngald3r project-type use content_creation\n\
  gald3r project-type copy software_dev my_workflow\ngald3r project-type edit my_workflow\n\
  gald3r project-type validate my_workflow\n```\n\n## Subcommands\n\n| Subcommand\
  \ | What it does |\n|---|---|\n| `list` | List every built-in + custom profile;\
  \ marks the **active** one with `*` and `(active)`. |\n| `use <profile>` | Set `workflow_profile:\
  \ <profile>` in `.gald3r/PROJECT.md` (creates/updates the frontmatter field). Validates\
  \ the profile exists first. |\n| `copy <src> <new-name>` | Copy `<src>.yaml` to\
  \ `<new-name>.yaml`, rewriting the `id:`/`name:` inside. Refuses if the target already\
  \ exists or the source is missing. |\n| `edit <profile>` | Print the resolved absolute\
  \ path to `<profile>.yaml` so an editor/agent can open it (the no-GUI-safe form\
  \ of \"edit\"). |\n| `validate <profile>` | Structurally check a profile: parses\
  \ as YAML, required fields present (`id`, `name`, `task_statuses`), no duplicate/unknown\
  \ status ids, and `transitions` (if any) reference defined status ids. Exits non-zero\
  \ on any problem. |\n\n## How the active profile is resolved\n\n`list` reuses `gald3r\
  \ project-type resolve`'s hybrid activation chain (highest priority\nfirst): task\
  \ frontmatter `workflow_profile:` → `PROJECT.md` `workflow_profile:`\n→ `.gald3r/.identity`\
  \ `project_type=` → `.gald3r/.project_type` → `freeform`.\nLegacy ids are alias-normalized\
  \ (e.g. `software_development` → `software_dev`).\n\n## Notes\n\n- Profiles are\
  \ **individual `<id>.yaml` files** read by name — there is no\n  single `custom.yaml`.\
  \ `copy` therefore creates `<new-name>.yaml` (a new\n  custom profile), and `use\
  \ <new-name>` activates it.\n- `--project-root <path>` pins the `.gald3r/` root\
  \ (defaults to walking up from\n  the script). Useful for tests and out-of-tree\
  \ invocation.\n- Idempotent: re-running `use` updates the field in place (never\
  \ duplicates it);\n  `copy` never overwrites an existing profile.\n- Built-in profiles\
  \ ship under `.gald3r/config/workflow_profiles/`:\n  `software_dev`, `content_creation`,\
  \ `research`."
prompt: Run the gald3r `g-pt` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-pt, e.g. quoted text or --flag values, exactly
    as you would type them after the command name.
