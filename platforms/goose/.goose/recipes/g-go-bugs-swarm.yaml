version: 1.0.0
title: g-go-bugs-swarm
description: 'Parallel bug-fix swarm — coordinate multiple bug fixes simultaneously:
  $ARGUMENTS'
instructions: "Parallel bug-fix swarm — coordinate multiple bug fixes simultaneously:\
  \ $ARGUMENTS\n\n## Mode: BUG-FIX SWARM (Parallel)\n\n`g-go-bugs-swarm` is the parallel\
  \ variant of `@g-go-bugs`. It follows the same\nreproduce → fix → regression → review\
  \ loop but runs multiple bugs concurrently using\nthe swarm bucket architecture\
  \ from `@g-go --swarm`.\n\n> **Independence guarantee**: Phase 2 reviewer agents\
  \ have no Phase 1 context.\n> Adversarial independence is preserved per bucket.\n\
  \n> **Coordinator-owned writes**: Bucket agents return patch bundles, evidence,\
  \ and proposed\n> status rows only. The coordinator performs all shared `.gald3r/`\
  \ writes, CHANGELOG, and\n> commits. Bucket agents MUST NOT write BUGS.md, bug files,\
  \ or shared coordination surfaces.\n\n> **Provider & model selection (T580, BUG-612\
  \ companion)**: same `--provider`/`--model`/\n> `--implementer-model`/`--reviewer-model`\
  \ surface as `@g-go-bugs`, resolved independently per\n> bucket. See `g-go-go.md`'s\
  \ \"Provider & Model Routing\" for the full precedence and host-mapping\n> table\
  \ (Cursor -> `cursor-agent` + `gpt-5.6-terra-medium` by default).\n\n---\n\n###\
  \ ⛔ NO-PROMPT RULE\n\n**NEVER ask for confirmation, scope choices, or approval mid-run.**\
  \ This is fire-and-forget.\nHard-gate failures are the only valid stop reasons (see\
  \ hard stops below).\n\n---\n\n## Invocation\n\n```\n@g-go-bugs-swarm          \
  \          # all open bugs in parallel, critical→high→medium→low\n@g-go-bugs-swarm\
  \ severity:critical  # only critical bugs, max parallelism\n@g-go-bugs-swarm severity:critical,high\
  \  # critical + high\n@g-go-bugs-swarm bug:BUG-042,BUG-043    # specific bugs in\
  \ parallel\n@g-go-bugs-swarm --dry-run          # preview fix queue and bucket plan\n\
  ```\n\n---\n\n## Phase 1: Parallel Bug-Fix (Swarm)\n\n### Coordinator Preflight\n\
  \nBefore spawning any bucket agents:\n\n1. **WPAC inbox gate** — same as `@g-go-bugs`\
  \ (only when WPAC is configured)\n2. **Housekeeping commit gate** — `gald3r housekeep\
  \ -Mode preflight -Apply -Json`\n3. **Clean Controller Gate** — `git status --short`;\
  \ stop if unrelated dirty paths\n4. **Claim all target bugs at once** — mark every\
  \ target bug `[\U0001F504]` / `in-progress` in BUGS.md\n   (prevents other agents\
  \ from double-claiming during parallel work)\n\n### Bug Partitioning\n\n```\nSmart\
  \ Agent Count:\n  1 bug     → 1 bucket (no swarm — fallback to sequential @g-go-bugs)\n\
  \  2–4 bugs  → 2 buckets\n  5–8 bugs  → 3 buckets\n  9+ bugs   → 4 buckets (hard\
  \ cap — bug-fix buckets are heavier than task buckets)\n\nBatching for low-severity:\n\
  \  medium/low bugs may be batched 2–3 per bucket\n  critical/high bugs always get\
  \ their own bucket\n```\n\nEach bucket is assigned bugs that:\n- Do NOT share subsystems\
  \ (conflict-safety)\n- Are ordered by severity within the bucket (critical first)\n\
  \n### Worktree Creation (Per Bucket)\n\n```powershell\ngald3r worktree create -BugId\
  \ {bug_ids_csv} -Role code-swarm -Owner {owner} -BucketId {bucket_number} -LockFiles\
  \ {bucket_planned_paths} -BucketTtlMinutes 60 -Json\n```\n\nCreate one worktree\
  \ per bucket before spawning agents. Pass `worktree_path` and\n`worktree_branch`\
  \ to each implementer.\n\n**Swarm file-lock claim (T1059, mandatory for `code-swarm`).**\
  \ `-BucketId {bucket_number}` plus `-LockFiles {bucket_planned_paths}` — the repo-relative\
  \ paths the bucket intends to modify, derived from each assigned bug's affected-files\
  \ / subsystem mapping — make the helper write a lock manifest *before* the worktree\
  \ exists. Buckets are partitioned on subsystem boundaries so claims do not overlap\
  \ by construction; on overlap with another active bucket, `-Action Create` fails\
  \ with `LOCK_CONFLICT` and the colliding bucket is never spawned. `-Role code-swarm`\
  \ **fails closed** (`LOCK_REQUIRED`) when `-LockFiles` is empty. Routing every bucket\
  \ through `gald3r worktree` is what makes the lock apply.\n\n### Bucket Agent Protocol\n\
  \nEach bucket agent receives:\n- Assigned bug IDs and their `.gald3r/bugs/open/bugNNN_*.md`\
  \ specs\n- The worktree path to work in\n- Coordinator-managed override: \"Return\
  \ patch bundle, regression test evidence, proposed\n  BUGS.md rows, and Status History\
  \ rows. Do NOT write BUGS.md, shared bug files, CHANGELOG.md,\n  or commit. Use\
  \ explicit path staging only — no `git add .`.\"\n\nFor each assigned bug, bucket\
  \ agents:\n1. Read bug spec (reproduction steps, expected/actual)\n2. Reproduce\
  \ — if cannot reproduce, record `cannot-reproduce` in handoff, skip fix\n3. Fix\
  \ — minimal fix in worktree\n4. Add regression test\n5. Run regression test (must\
  \ pass)\n6. Return handoff:\n   ```\n   bug_id: BUG-{id}\n   verdict: fixed | cannot-reproduce\
  \ | blocked\n   patch: <git diff --binary --cached HEAD output>\n   regression_test:\
  \ {test file path and test name}\n   test_evidence: {test output showing pass}\n\
  \   proposed_bugs_md_row: \"| [\U0001F50D] | BUG-{id} | ... |\"\n   proposed_status_history:\
  \ \"| YYYY-MM-DD | in-progress | awaiting-fix-review | Fixed + regression test |\"\
  \n   changed_files: [list of modified paths]\n   touch_repos: []  # additional repos\
  \ edited, if any\n   ```\n\nBucket agents MUST NOT use `git add .`. Use explicit\
  \ `git add -- {paths}` only.\n\n### Coordinator Reconciliation\n\nAfter all bucket\
  \ handoffs:\n\n1. **Pre-Reconciliation Clean Gate** — re-run `git status --short`\
  \ at orchestration root\n   - **Lock report (T1059)** — run `gald3r worktree lock-report\
  \ -Json` and surface any multi-bucket path in the summary as a `WARN` (not a hard\
  \ block) before applying patches.\n2. For each bucket (in dependency order, lowest\
  \ BUG-NNN first):\n   - Stage only intended files: `git add -A -- {changed_files}`\n\
  \   - Export patch: `git diff --binary --cached HEAD`\n   - Apply to primary checkout:\
  \ `git apply --3way --index`\n   - If patch fails: preserve worktree, mark bug as\
  \ skipped\n3. **Coordinator-owned batch writes**:\n   - Update BUGS.md (all fixed\
  \ bugs → `[\U0001F50D]`)\n   - Update individual bug files (status + Status History)\n\
  \   - Update linked fix tasks (if `fix_task_id:` set via T1114)\n4. **Post-write\
  \ housekeeping gate**: `gald3r housekeep -Mode post-write -Apply -Json`\n5. **Checkpoint\
  \ commit** (one commit for the whole swarm run):\n   ```\n   fix(bugs): swarm fix\
  \ BUG-{id1}, BUG-{id2}, ... ({N} bugs)\n   \n   Bugs: BUG-{id1}, BUG-{id2}, ...\n\
  \   Regression tests added for each fix.\n   ```\n\n---\n\n## Phase 2: Swarm Review\
  \ (Parallel)\n\nPartition the `[\U0001F50D]` bugs round-robin across M reviewer\
  \ agents (same count formula as Phase 1).\n\n### Coordinator Claims Review Slots\n\
  \nBefore spawning reviewers, atomically claim each `[\U0001F50D]` bug as `[\U0001F575\
  ️]` / `verification-in-progress`\n(skip non-expired claims; log stale takeovers).\n\
  \nCreate one `review-swarm` worktree per reviewer from the Phase 1 checkpoint branch/SHA.\n\
  \n### Reviewer Agents\n\nEach reviewer receives:\n- Assigned bug IDs\n- The `review-swarm`\
  \ worktree path\n- Coordinator override: \"Return PASS/FAIL payloads and Status\
  \ History rows only. No shared writes.\"\n\nFor each assigned bug:\n1. Re-run reproduction\
  \ steps → confirm fix resolves symptom\n2. Run regression test → must pass\n3. Run\
  \ full test suite (if available) → no new failures\n4. Return verdict: PASS or FAIL\
  \ + evidence + proposed Status History row\n\n### Coordinator Final Writes\n\nAfter\
  \ all review payloads:\n1. **Invoke `gald3r bug resolve <id>` (PASS) or `gald3r\
  \ bug update <id> --status open --note \"FAIL: ...\"` (FAIL) for every reviewed\
  \ bug — mandatory, once per item (BUG-511).** This resyncs the bug file + `BUGS.md`\
  \ in the same call — do not hand-edit either.\n2. For each linked fix task (`fix_task_id`),\
  \ invoke `gald3r task verify <id> --pass` (PASS) or `gald3r task verify <id> --fail\
  \ --reason \"...\"` (FAIL) — same mandatory rule; do not hand-edit the task file\
  \ or `TASKS.md`.\n3. Stuck-loop check: ≥3 FAILs → `[\U0001F6A8]` (T047 circuit breaker)\
  \ — no CLI verb exists for this escalation status yet; this one step only is a direct\
  \ hand-edit of the bug file/`BUGS.md` indicator.\n4. Post-write housekeeping gate\n\
  5. Review-result commit (one per swarm run):\n   ```\n   fix(bugs): review result\
  \ — {N} resolved, {M} failed\n   \n   Resolved: BUG-{ids}\n   Failed: BUG-{ids}\n\
  \   ```\n\n---\n\n## Follow-Up Task Filing Gate (MANDATORY — before Swarm Summary)\n\
  \nSame as `@g-go-bugs`: all follow-up items MUST be filed as real task files via\n\
  `g-skl-tasks CREATE TASK` before the summary is written. Named-only slugs are a\
  \ policy\nviolation (T1113 enforcement).\n\n---\n\n## Swarm Pipeline Summary\n\n\
  ```markdown\n## g-go-bugs-swarm Session Summary\n\nRun: g-go-bugs-swarm {args}\n\
  Bugs attempted: N\nBuckets (Phase 1): {N implementers}\nReviewers (Phase 2): {M\
  \ reviewers}\n\n### Phase 1: Implementation\n| Bucket | Bugs | Fixed → [\U0001F50D\
  ] | Skipped |\n|--------|------|--------------|---------|\n| 1 | BUG-042, BUG-043\
  \ | 2 | 0 |\n| 2 | BUG-044 | 0 | 1 (cannot reproduce) |\n\nCheckpoint: {branch}@{commit_sha}\n\
  \n### Phase 2: Review\n| Reviewer | Bugs | PASS | FAIL |\n|----------|------|------|------|\n\
  | R-1 | BUG-042, BUG-044 | 2 | 0 |\n| R-2 | BUG-043 | 0 | 1 |\n\nReview commit:\
  \ {sha}\n\n### Results\n- ✅ BUG-{id}: {title} — fixed + verified\n- ❌ BUG-{id}:\
  \ {title} — fix failed: {reason}\n- ⏸️ BUG-{id}: {title} — could not reproduce,\
  \ skipped\n\n### Follow-Up Tasks Filed\n- T{id}: {title} — {reason surfaced}\n(or:\
  \ None)\n\n### Final State\n- ✅ Resolved: {N}\n- \U0001F4CB Failed (back to open):\
  \ {M}\n- ⏸️ Skipped: {K}\n- \U0001F6A8 Requires user attention: {U}\n- Total commits\
  \ this run: {C}\n```\n\n---\n\n## Hard Stops\n\n| Stop reason | Trigger |\n|---|---|\n\
  | WPAC conflict | inbox check exit code `2` |\n| Unsafe dirty root | housekeeping\
  \ gate `unsafe-gald3r` / `mixed-dirty` |\n| Pre-reconciliation dirty drift | coordinator\
  \ detects unrelated changes after parallel work |\n| `[\U0001F6A8]` items only |\
  \ all target bugs are requires-user-attention |\n| Secret detection | secret-pattern\
  \ scanner fires on staged content |\n| No runnable bugs | after scope filter, zero\
  \ eligible bugs |\n\n---\n\n## Behavioral Rules\n\n| Rule | Why |\n|------|-----|\n\
  | Coordinator claims ALL target bugs before spawning buckets | Prevents double-claiming\
  \ during parallel work |\n| Bucket agents return handoffs only — NO shared writes\
  \ | Swarm reconciliation policy (T206) |\n| `git add .` is forbidden in bucket worktrees\
  \ | Prevents leaking transient files to commits |\n| One checkpoint commit for whole\
  \ swarm | Cleaner git history than per-bug commits |\n| `[\U0001F6A8]` bugs never\
  \ retried | Human-only resolution (T047) |\n| NEVER ask questions mid-run | Fire-and-forget\
  \ design |\n\n---\n\n## Examples\n\n```\n@g-go-bugs-swarm                    # all\
  \ open bugs in parallel\n@g-go-bugs-swarm severity:critical  # only critical bugs\n\
  @g-go-bugs-swarm bug:BUG-042,BUG-043,BUG-044  # specific bug batch\n```\n\nSee `@g-go-bugs`\
  \ for sequential (single-agent-per-bug) variant.\n\nLet's swarm those bugs."
prompt: Run the gald3r `g-go-bugs-swarm` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-go-bugs-swarm, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
