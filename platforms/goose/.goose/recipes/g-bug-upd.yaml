version: 1.0.0
title: g-bug-upd
description: Update a bug record. Activates **g-skl-bugs** → UPDATE BUG operation.
instructions: 'Update a bug record. Activates **g-skl-bugs** → UPDATE BUG operation.


  ```

  @g-bug-upd BUG-NNN status resolved

  @g-bug-upd BUG-NNN severity critical

  @g-bug-upd BUG-NNN add-note "Found root cause: null guard missing"

  ```


  Updates bug file fields and BUGS.md index row. Appends to Status History.


  Workspace-Control updates: `@g-bug-upd BUG-NNN workspace-repos <gald3r_source>,<template_full>`
  and `@g-bug-upd BUG-NNN workspace-touch-policy generated_output` must validate IDs/policies
  against `.gald3r/linking/workspace_manifest.yaml` when present. Unknown member IDs
  are invalid. Widening from current-repo-only to member repos, or to `generated_output`/`multi_repo`,
  requires Status History context or equivalent explicit instruction before writing
  the update.'
prompt: Run the gald3r `g-bug-upd` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-bug-upd, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
