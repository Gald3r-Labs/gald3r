version: 1.0.0
title: g-steer
description: 'Steer a running g-go-code worktree session mid-flight without restarting
  it: $ARGUMENTS'
instructions: "Steer a running g-go-code worktree session mid-flight without restarting\
  \ it: $ARGUMENTS\n\n## Usage\n- `@g-steer T{id} \"<steering prompt>\"` — drop a\
  \ one-shot steering instruction into the running session's worktree\n- `@g-steer\
  \ T{id} --role code --owner {owner} \"<steering prompt>\"` — disambiguate when multiple\
  \ worktrees exist for the same task\n\n## What it does\n\n`@g-steer` writes `steer.md`\
  \ to the **worktree root** of an in-flight `g-go-code` task. The running\nimplementation\
  \ session polls for this file at **every AC-gate iteration** (step b2.5). When found,\n\
  it injects the prompt as a high-priority steering instruction, logs `STEERED by\
  \ user at turn N` to\nthe task's `## Status History`, then **deletes** `steer.md`\
  \ so the steer fires exactly once.\n\nThis lets you redirect work in flight — narrow\
  \ the focus, skip a sub-task, change an approach — without\nkilling the session\
  \ and losing its context. It is the complement to `@g-queue` (which adds work to\
  \ do\n*after* the goal completes) and to `g-go-code --resume` (which restarts a\
  \ crashed session).\n\nSteering is **one-shot and latest-wins**: a second `@g-steer`\
  \ before the first is consumed overwrites\nthe pending steer. Each new redirection\
  \ requires a new `@g-steer` call.\n\n## Sub-operations\n\n### Write a steer (`@g-steer\
  \ T{id} \"<prompt>\"`)\n\n1. Parse `T{id}` (the target task) and the quoted `<steering\
  \ prompt>` text from `$ARGUMENTS`.\n   Default `--role code` and `--owner` to the\
  \ current session owner (e.g. the IDE/platform slug) when\n   not supplied.\n2.\
  \ Invoke the worktree helper to write `steer.md` (overwrite — latest steer wins):\n\
  \   ```powershell\n   gald3r worktree steer -TaskId {id} -Role code -Owner {owner}\
  \ -SteerText \"<steering prompt>\" -Json\n   ```\n   Checkouts that ship a root\
  \ `gald3r worktree` copy (the gald3r source repo)\n   may call the helper from there\
  \ instead.\n3. The helper writes `steer.md` atomically (temp file + rename) at the\
  \ worktree root so the running\n   session never reads a half-written file.\n4.\
  \ Confirm to user: `\U0001F9ED Steer queued for T{id} — the running session will\
  \ pick it up at the next AC-gate.`\n\nIf no gald3r-owned worktree exists for `T{id}`\
  \ / role / owner, the helper errors with \"cannot steer\"\n— there is no running\
  \ session to redirect. Start one with `@g-go-code tasks {id}` first.\n\n## How the\
  \ running session consumes it\n\n`g-go-code` step b2.5 (Steer poll) runs the read-and-clear\
  \ mode of the same helper at each AC-gate:\n\n```powershell\ngald3r worktree steer\
  \ -TaskId {id} -Role code -Owner {owner} -Json\n```\n\n- `steered: false` → silent\
  \ no-op, loop continues.\n- `steered: true` → inject `steer_prompt`, log `STEERED\
  \ by user at turn N`, helper deletes `steer.md`.\n\n## Related\n\n- Command: `g-queue`\
  \ — append follow-up work processed after the main goal completes\n- Command: `g-go-code`\
  \ — the session that polls for `steer.md` (see \"Mid-Flight Course Correction\"\
  )\n- Helper: `gald3r worktree` (`-Action Steer`)\n- Spec: T969 — Worktree /steer\
  \ + /queue\n- File: `<worktree>/steer.md` (one-shot, deleted after injection)\n\n\
  Let's steer."
prompt: Run the gald3r `g-steer` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-steer, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
