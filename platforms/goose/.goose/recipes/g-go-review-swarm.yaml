version: 1.0.0
title: g-go-review-swarm
description: 'Alias for `@g-go-review --swarm`: $ARGUMENTS'
instructions: "Alias for `@g-go-review --swarm`: $ARGUMENTS\n\n> **Step 0 — Workspace\
  \ Member Clean-Status Preflight (T1431):** inherited from `@g-go-review`. The\n\
  > read-only member clean-status preflight runs before review-queue build. See `g-go.md`\
  \ Step 0 for\n> the authoritative algorithm.\n\n> **Step 0b — CLI Invocation Rule:\
  \ `uv run gald3r` (BUG-591):** inherited from `@g-go`. Every\n> `gald3r <verb>`\
  \ call this coordinator or any reviewer bucket makes MUST run as `uv run gald3r\n\
  > <verb>`, never bare `gald3r` — a stale PATH binary can silently shadow this checkout's\
  \ dev\n> source, including a reviewer's own PASS/FAIL status-write landing in the\
  \ wrong `.gald3r/` across\n> a worktree boundary. See `g-go.md` Step 0b for full\
  \ text and the optional staleness hard-fail\n> check.\n\nRuns **verification only**\
  \ in swarm mode — splits the `[\U0001F50D]` queue across M parallel\nreviewer agents\
  \ (round-robin).\n\n> **M inheritance (T635):** M (reviewer count) is supplied by\
  \ the `g-go-go` coordinator — this\n> command has **no independent context-aware\
  \ throttle**. Under Rolling Amnesia (default) the\n> coordinator never reduces parallelism\
  \ for context reasons; do not add iteration-count or\n> context-fill throttling\
  \ here. Includes both **tasks** and **bugs** awaiting verification.\nCoordinator\
  \ claims assigned items as `[\U0001F575️]` / `verification-in-progress` before spawning\n\
  reviewers, skips non-expired verifier claims, and batch-writes TASKS.md and BUGS.md\
  \ after\nall reviewers complete. The coordinator also establishes one review isolation\
  \ source per\nbucket: a T170 `review-swarm` worktree for branch-addressable sources,\
  \ or snapshot mode\nfor uncommitted checkout/worktree sources.\nReview bucket agents\
  \ return PASS/FAIL payloads, evidence, proposed Status History rows, and explicitly\
  \ authorized fix-forward patches only. They must not write shared `.gald3r` files,\
  \ changelog/docs, generated prompts, parity output, final staging, or commits.\n\
  The review-swarm coordinator creates a review-result commit after PASS or FAIL status\
  \ writes by default. Do not stop at a commit offer when the commit is safe; commit\
  \ the verdict. The only allowed non-commit blockers are unresolved conflicts, failed\
  \ commit hooks, staged or untracked unrelated changes, detected secrets, dirty generated\
  \ outputs not owned by review, missing user permission for destructive or out-of-scope\
  \ changes, or repository state that prevents a safe commit.\nDefault source is the\
  \ implementation checkpoint commit produced by `g-go-code` / `g-go --swarm`; review\
  \ buckets should create clean `review-swarm` worktrees from that checkpoint. Use\
  \ snapshot mode only when the handoff explicitly says the source is uncommitted,\
  \ dirty, or non-branch-addressable.\n\nThis is exactly `@g-go-review --swarm`. Use\
  \ this command for discoverability.\nAll arguments pass through, including T580's\
  \ `--provider`/`--model`/`--reviewer-provider`/\n`--reviewer-model` (BUG-612 companion)\
  \ — each round-robin reviewer bucket resolves its own\ntarget independently (see\
  \ `@g-go-review`'s \"Provider & Model Selection\" section); a Cursor host\nmaps\
  \ to `cursor-agent` + `gpt-5.6-terra-medium` by default unless overridden.\n\n>\
  \ ⚠️  **Run this in a NEW agent session** — different window, different invocation.\n\
  > If you implemented any of these tasks or bug fixes in this session, skip them.\n\
  \n\n### WPAC inbox Gate (Only When WPAC is configured)\n\nBefore task claiming,\
  \ implementation, verification, planning, or swarm partitioning, first determine\
  \ whether this project is a WPAC participant. WPAC is configured only when `.gald3r/linking/link_topology.md`\
  \ declares at least one parent/child/sibling relationship, or `.gald3r/PROJECT.md`\
  \ explicitly declares WPAC project linking relationships. A Workspace-Control manifest\
  \ and local `INBOX.md` alone do not make the project a WPAC group member.\n\nIf\
  \ WPAC is configured, run the re-callable inbox check when the hook exists:\n\n\
  ```powershell\n$hook = @( \".cursor\\hooks\\g-hk-wpac-inbox-check.py\", \".claude\\\
  hooks\\g-hk-wpac-inbox-check.py\", \".agent\\hooks\\g-hk-wpac-inbox-check.py\",\
  \ \".codex\\hooks\\g-hk-wpac-inbox-check.py\", \".opencode\\hooks\\g-hk-wpac-inbox-check.py\"\
  \ ) | Where-Object { Test-Path $_ } | Select-Object -First 1\nif ($hook) { python\
  \ $hook -ProjectRoot . -BlockOnConflict }\n```\n\nInstalled templates may call the\
  \ equivalent hook from the active IDE folder. If the check reports `INBOX CONFLICT\
  \ GATE` or exits with code `2`, stop immediately and run `@g-wpac-read`; do not\
  \ claim tasks, create worktrees, spawn reviewers, or continue planning until conflicts\
  \ are resolved. Non-conflict requests, broadcasts, and syncs are advisory and should\
  \ be surfaced in the session summary. If WPAC is not configured, skip this gate\
  \ and report `WPAC: not configured / skipped`.\n\n\n### Gald3r Housekeeping Commit\
  \ Gate (T531)\n\n<!-- T531-HOUSEKEEPING-GATE -->\nAfter the WPAC gate is skipped\
  \ or passes and **before** the Clean Controller Gate hard-blocks the run, run the\
  \ safety classifier helper at the orchestration root:\n\n```powershell\ngald3r housekeep\
  \ -Mode preflight -Apply -TaskId <id-when-known> -Json\n```\n\nBehavior:\n\n- **`clean`**\
  \ -> continue.\n- **`safe-gald3r-housekeeping`** -> the helper stages **only** allowlisted\
  \ controller `.gald3r/` paths via explicit `git add -- <paths>` (never `git add\
  \ .`), re-checks for drift, and creates a focused `chore(gald3r): preflight gald3r\
  \ housekeeping` commit. The run continues automatically.\n- **`unsafe-gald3r` /\
  \ `mixed-dirty` / `conflict` / `drift-detected` / unknown `.gald3r` paths / member-repo\
  \ `config-fault`** -> the helper exits non-zero, the existing Clean Controller Gate\
  \ hard-block applies, and the run STOPs with the exact unsafe paths listed.\n\n\
  The helper allowlist covers the safe controller `.gald3r/` coordination surfaces\
  \ (TASKS.md, BUGS.md, FEATURES.md, PRDS.md, SUBSYSTEMS.md, IDEA_BOARD.md, learned-facts.md,\
  \ tasks/, bugs/, features/, prds/, subsystems/, reports/, logs/wpac_auto_actions.log,\
  \ linking/sent_orders/, linking/INBOX.md). The deny list covers `.identity`, `.user_id`,\
  \ `.project_id`, `.vault_location`, `vault/`, `config/`, `.gald3r-worktree.json`,\
  \ secret-named files, and unknown `.gald3r/` paths. Member-repo targets (marker-only\
  \ `.gald3r/`) are refused -- this gate is **controller-only**.\n\nRe-run the helper\
  \ in `-Mode post-write -Apply` immediately after coordinator-owned shared `.gald3r`\
  \ writes (task/bug status writes, review-result writes, sent_orders ledger updates,\
  \ safe report/log outputs) and before the next major phase so the shared-state dirty\
  \ window stays short. In `--swarm` flows only the coordinator runs the helper; bucket\
  \ agents remain handoff producers.\n### Clean Controller Gate (before claims, worktrees,\
  \ reconciliation)\n\nAfter the WPAC gate is skipped or passes:\n\n1. At the **orchestration\
  \ git root** (the repo from which you run this command — normally the Workspace-Control\
  \ owner, e.g. `<gald3r_source>`): run `git status --short`. If anything is listed\
  \ **outside** this run's explicit coordinator staging allowlist for the active task\
  \ and bug IDs, **STOP** here. Do not claim tasks or bugs, create or reuse T170 worktrees,\
  \ partition swarms, or write coordinator-owned updates to `.gald3r/TASKS.md`, `.gald3r/BUGS.md`,\
  \ other shared `.gald3r` coordination files, `CHANGELOG.md`, generated Copilot prompts,\
  \ or parity output until unrelated changes are committed, stashed, or moved to a\
  \ prior focused commit. Preserve any bucket handoff artifacts already produced and\
  \ list the paths that blocked progress.\n\n2. **`gald3r worktree create -AllowDirty`**:\
  \ do not use this switch for `g-go`, `g-go-code`, `g-go-review`, or any `--swarm`\
  \ variant **except** when every dirty path is owned exclusively by the active task/bug\
  \ scope and a `## Status History` row documents that override. Otherwise clean the\
  \ checkout first. The same **per-root** `-AllowDirty` discipline applies to every\
  \ repository included in the touch set below when multi-repo work is in scope.\n\
  \n3. **Member touch-set (v1 — `workspace_repos`)** — The orchestration root is **always**\
  \ gated. When the active task or bug declares **`workspace_repos:`** with manifest\
  \ `repository.id` entries, extend the gate to each **other** resolved member root\
  \ (blast radius follows declared cross-repo scope). Read `.gald3r/linking/workspace_manifest.yaml`\
  \ when present; map each listed ID (deduplicated) to `repositories[?].local_path`.\
  \ For each existing path, run `git -C \"<path>\" rev-parse --show-toplevel` then\
  \ `git status --short` at that root. Apply the same **explicit coordinator staging\
  \ allowlist** per root. Skip IDs whose paths are missing while `lifecycle_status`\
  \ is a planned/bootstrap gap (report only; do not expand the touch set). If the\
  \ manifest is missing while `workspace_repos` is non-empty, or an ID is unknown\
  \ under `repositories:`, **STOP** multi-repo coordinator work until manifest or\
  \ frontmatter is repaired (controller-only queue items whose `workspace_repos` lists\
  \ only the owner id may proceed once that id resolves).\n\n4. **Touch-set expansion\
  \ (v2 — optional signals)** — Union extra repository roots into the same per-root\
  \ checks (still **not** a blanket scan of every manifest member):\n   - **`extended_touch_repos:`**\
  \ — optional task/bug YAML list of additional manifest `repository.id` values beyond\
  \ `workspace_repos`.\n   - **`touch_repos:` (swarm handoffs)** — In `--swarm` runs,\
  \ when bucket work edits roots not already covered by `workspace_repos` + `extended_touch_repos:`,\
  \ bucket summaries and the coordinator reconciliation block MUST list those ids\
  \ under `touch_repos:` so the union is gated before shared writes.\n   - **Subsystem\
  \ `locations:` absolutes** — When the active item declares **`subsystems:`**, read\
  \ each `.gald3r/subsystems/{name}.md` frontmatter **`locations:`** (all nested strings).\
  \ For values matching a host **absolute** path (`^[A-Za-z]:[/\\\\]` on Windows,\
  \ or POSIX `/` rooted at `/` elsewhere), if the path exists, resolve `git -C <dir>\
  \ rev-parse --show-toplevel` (use the file's parent directory when the path is a\
  \ file). Each distinct root **other than** the orchestration root joins the touch\
  \ set. Relative paths do not expand the set.\n\n### Pre-Reconciliation Clean Gate\
  \ (before coordinator shared writes)\n\nAlso re-run the **Gald3r Housekeeping Commit\
  \ Gate** with `-Mode post-write -Apply` against the orchestration root immediately\
  \ after each coordinator-owned shared `.gald3r` write so safe controller coordination\
  \ state lands in a focused `chore(gald3r): commit g-go coordination state` commit\
  \ before the next major phase begins.\n\n\nImmediately before the coordinator merges\
  \ bucket results into the primary checkout, updates shared `.gald3r` indexes or\
  \ task/bug files as coordinator-owned writes, touches `CHANGELOG.md`, or creates\
  \ checkpoint / review-result commits: **re-run** `git status --short` on the **orchestration\
  \ root and every other repository root in the computed touch set** (steps 1 + 3\
  \ + 4). For `--swarm` runs, if unrelated dirty paths appear in **any** of those\
  \ roots during parallel bucket work, **fail closed** — do not apply those shared\
  \ writes; keep patches, artifacts, and evidence; report **per-root** blockers using\
  \ the same blocker family as checkpoint and review-result commits.\n\n### WPAC inbox\
  \ Heartbeats (Swarm / Long Runs)\n\nFor swarm mode or any run lasting more than\
  \ 30 minutes, the coordinator reruns the WPAC inbox check every 30 minutes and once\
  \ more before the final summary. If a conflict appears mid-run, pause new claims/spawns/reconciliation,\
  \ preserve worktrees and partial outputs, and require `@g-wpac-read` before continuing.\n\
  \n## Usage\n\n```\n@g-go-review-swarm\n@g-go-review-swarm tasks 14 15 16 17 18\n\
  @g-go-review-swarm bugs BUG-013 BUG-014\n@g-go-review-swarm tasks 14 15 bugs BUG-013\n\
  ```\n\nAll filter arguments pass through to `@g-go-review --swarm`.\n\nSee `@g-go-review`\
  \ for full review protocol, verifier claim rules, review worktree/snapshot isolation,\
  \ and swarm coordinator rules.\n\nReady to review."
prompt: Run the gald3r `g-go-review-swarm` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-go-review-swarm, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
