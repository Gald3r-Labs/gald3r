version: 1.0.0
title: g-release-new
description: Create a new release. Activates **g-skl-release** → CREATE operation.
instructions: 'Create a new release. Activates **g-skl-release** → CREATE operation.


  ```

  @g-release-new "Release Name"

  @g-release-new "Release Name" --version 1.2.0

  @g-release-new "Release Name" --target 2026-05-15

  @g-release-new "Release Name" --cadence 21

  ```


  Creates `.gald3r/releases/release{NNN}_{slug}.md` and appends a row to `RELEASES.md`.


  - Next ID = highest in `RELEASES.md` + 1 (zero-padded to 3 digits)

  - `target_date` defaults to (most-recent target_date + `cadence_days`); falls back
  to (today + cadence) for the first release

  - `cadence_days` defaults to 14 (biweekly)

  - Status starts at `planned`


  **Before publishing a release:** run a STRIDE threat model check on any new API
  surfaces, authentication changes, or data-handling code included in this release.
  Reference: `@g-skl-code-review` security pass (OWASP Top 10 + STRIDE categories).
  Document findings in the release file under a `## Security Review` section; mark
  as `N/A` if the release contains no API/auth/data changes.'
prompt: Run the gald3r `g-release-new` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-release-new, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
