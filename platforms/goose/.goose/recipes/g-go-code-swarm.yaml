version: 1.0.0
title: g-go-code-swarm
description: 'Alias for `@g-go-code --swarm`: $ARGUMENTS'
instructions: "Alias for `@g-go-code --swarm`: $ARGUMENTS\n\n> **Step 0 — Workspace\
  \ Member Clean-Status Preflight (T1431):** inherited from `@g-go-code`. The\n> read-only\
  \ member clean-status preflight runs before task selection. See `g-go.md` Step 0\
  \ for the\n> authoritative algorithm.\n\n> **Step 0b — CLI Invocation Rule: `uv\
  \ run gald3r` (BUG-591):** inherited from `@g-go`. Every\n> `gald3r <verb>` call\
  \ this coordinator or any bucket agent makes — including `gald3r worktree\n> create`,\
  \ `gald3r housekeep`, and the task/bug status verbs each bucket uses to hand off\
  \ work —\n> MUST run as `uv run gald3r <verb>`, never bare `gald3r`. A stale PATH\
  \ binary can silently shadow\n> this checkout's dev source; confirmed damage includes\
  \ a worktree-isolated agent's status-update\n> call landing in the MAIN checkout's\
  \ `.gald3r/` instead of its own bucket worktree — the exact\n> failure worktree\
  \ isolation exists to prevent. A coordinator MAY additionally run `uv run python\n\
  > -m gald3r_core.core.install.build_fingerprint .` as a hard-fail dispatch preflight\
  \ (exit `2` =\n> real drift, treat as a hard stop). See `g-go.md` Step 0b for full\
  \ text and rationale.\n\nRuns **implementation only** in swarm mode — partitions\
  \ the work queue into conflict-safe\nbuckets and spawns N parallel agents. Every\
  \ completed item is marked `[\U0001F50D]`.\n\n> **N inheritance (T635):** N (bucket\
  \ count) is supplied by the `g-go-go` coordinator — this\n> command has **no independent\
  \ context-aware throttle**. Under Rolling Amnesia (default) the\n> coordinator never\
  \ reduces N for context reasons; do not add iteration-count or context-fill\n> throttling\
  \ here. N flows in only via the partitioned queue handed to this driver.\n\nThis\
  \ is exactly `@g-go-code --swarm`. Use this command for discoverability.\nImplementation-only\
  \ boundary: this command must not spawn reviewer agents, run `g-go-review` / `g-go-review-swarm`,\
  \ or invoke `gald3r-code-reviewer` / full adversarial review subagents. It may run\
  \ only implementation readiness checks: import/build/typecheck/lint, focused tests,\
  \ acceptance-criteria self-check, workspace/constraint/stub/bug-discovery gates,\
  \ and checkpoint/handoff creation.\nIf swarm eligibility leaves exactly one runnable\
  \ item after workspace preflight, auto-downgrade to standard `@g-go-code` mode and\
  \ continue without asking. If workspace preflight fails because the target repo\
  \ is not registered, is not a git root, or is not authorized for the task/bug routing\
  \ metadata, stop with that blocker instead of offering fallback.\nThe coordinator\
  \ must create or reuse one T170 coding worktree per bucket before spawning\nimplementation\
  \ agents, then reconcile bucket outputs back into the primary checkout one at a\
  \ time. Each bucket worktree is created through `gald3r worktree create -Role code-swarm\
  \ … -BucketId {n} -LockFiles {bucket_planned_paths}` (T1059): the lock manifest\
  \ is written before the worktree exists and a path claimed by another active bucket\
  \ fails with `LOCK_CONFLICT` before spawn; `code-swarm` fails closed (`LOCK_REQUIRED`)\
  \ when `-LockFiles` is empty. Before reconciling, the coordinator runs `-Action\
  \ LockReport` and surfaces any multi-bucket path as a `WARN`.\nThe coordinator must\
  \ skip non-expired `[\U0001F4DD]` speccing claims before partitioning and log stale\
  \ speccing-claim takeovers before worktree allocation.\nBucket agents return patch\
  \ bundles, generated artifacts, test evidence, changed-file inventories, and proposed\
  \ status rows. They must not write shared `.gald3r` indexes/status files, `CHANGELOG.md`,\
  \ generated Copilot prompts, parity outputs, final staging, or commits. The coordinator\
  \ performs one final shared-write pass and never accepts broad `git add .` output\
  \ from a bucket.\nAfter the coordinator reconciles buckets and performs final shared\
  \ writes, it creates a code-complete checkpoint commit and emits a review handoff.\
  \ Review swarms later use that checkpoint as their default branch-addressable source;\
  \ dirty snapshot review is fallback-only.\n\nThroughput rule: do not stop the coding\
  \ queue merely because a task moved to `[\U0001F50D]`. After each checkpoint commit,\
  \ recompute the runnable queue and start the next coding wave when dependencies\
  \ are implementation-satisfied by `[\U0001F50D]` checkpointed work. Only pause for\
  \ dependencies that explicitly declare `requires_verified_dependencies: true`, WPAC\
  \ conflicts, Workspace-Control preflight blockers, or unresolved reconciliation\
  \ failures. Review runs later in a separate command or in `g-go --swarm`; do not\
  \ launch it from `g-go-code-swarm`.\n\n\n### WPAC inbox Gate (Only When WPAC is\
  \ configured)\n\nBefore task claiming, implementation, verification, planning, or\
  \ swarm partitioning, first determine whether this project is a WPAC participant.\
  \ WPAC is configured only when `.gald3r/linking/link_topology.md` declares at least\
  \ one parent/child/sibling relationship, or `.gald3r/PROJECT.md` explicitly declares\
  \ WPAC project linking relationships. A Workspace-Control manifest and local `INBOX.md`\
  \ alone do not make the project a WPAC group member.\n\nIf WPAC is configured, run\
  \ the re-callable WPAC inbox check when the hook exists.\n\n> **Tool routing (BUG-031)**:\
  \ on Windows, invoke this snippet through the **PowerShell tool**, not Bash. It\
  \ uses PowerShell-only syntax (`@(...)` array, `Where-Object`, `Test-Path`, `Select-Object`,\
  \ pipeline). Routing it through Bash produces a parse error such as ``syntax error\
  \ near unexpected token `('`` — that failure is a tool-selection error, **NOT**\
  \ a real WPAC conflict gate. Re-run via PowerShell. On Linux/macOS hosts use `pwsh`\
  \ if available; if neither shell can reach the hook, treat the gate as advisory\
  \ and let Workspace-Control routing re-evaluate.\n\n```powershell\n$hook = @( \"\
  .cursor\\hooks\\g-hk-wpac-inbox-check.py\", \".claude\\hooks\\g-hk-wpac-inbox-check.py\"\
  , \".agent\\hooks\\g-hk-wpac-inbox-check.py\", \".codex\\hooks\\g-hk-wpac-inbox-check.py\"\
  , \".opencode\\hooks\\g-hk-wpac-inbox-check.py\" ) | Where-Object { Test-Path $_\
  \ } | Select-Object -First 1\nif ($hook) { python $hook -ProjectRoot . -BlockOnConflict\
  \ }\n```\n\nInstalled templates may call the equivalent hook from the active IDE\
  \ folder. If the check reports `INBOX CONFLICT GATE` or exits with code `2`, stop\
  \ immediately and run `@g-wpac-read`; do not claim tasks, create worktrees, spawn\
  \ reviewers, or continue planning until conflicts are resolved. Non-conflict requests,\
  \ broadcasts, and syncs are advisory and should be surfaced in the session summary.\n\
  \n\n### Gald3r Housekeeping Commit Gate (T531)\n\n<!-- T531-HOUSEKEEPING-GATE -->\n\
  After the WPAC gate is skipped or passes and **before** the Clean Controller Gate\
  \ hard-blocks the run, run the safety classifier helper at the orchestration root:\n\
  \n```powershell\ngald3r housekeep -Mode preflight -Apply -TaskId <id-when-known>\
  \ -Json\n```\n\nBehavior:\n\n- **`clean`** -> continue.\n- **`safe-gald3r-housekeeping`**\
  \ -> the helper stages **only** allowlisted controller `.gald3r/` paths via explicit\
  \ `git add -- <paths>` (never `git add .`), re-checks for drift, and creates a focused\
  \ `chore(gald3r): preflight gald3r housekeeping` commit. The run continues automatically.\n\
  - **`unsafe-gald3r` / `mixed-dirty` / `conflict` / `drift-detected` / unknown `.gald3r`\
  \ paths / member-repo `config-fault`** -> the helper exits non-zero, the existing\
  \ Clean Controller Gate hard-block applies, and the run STOPs with the exact unsafe\
  \ paths listed.\n\nThe helper allowlist covers the safe controller `.gald3r/` coordination\
  \ surfaces (TASKS.md, BUGS.md, FEATURES.md, PRDS.md, SUBSYSTEMS.md, IDEA_BOARD.md,\
  \ learned-facts.md, tasks/, bugs/, features/, prds/, subsystems/, reports/, logs/wpac_auto_actions.log,\
  \ linking/sent_orders/, linking/INBOX.md). The deny list covers `.identity`, `.user_id`,\
  \ `.project_id`, `.vault_location`, `vault/`, `config/`, `.gald3r-worktree.json`,\
  \ secret-named files, and unknown `.gald3r/` paths. Member-repo targets (marker-only\
  \ `.gald3r/`) are refused -- this gate is **controller-only**.\n\nRe-run the helper\
  \ in `-Mode post-write -Apply` immediately after coordinator-owned shared `.gald3r`\
  \ writes (task/bug status writes, review-result writes, sent_orders ledger updates,\
  \ safe report/log outputs) and before the next major phase so the shared-state dirty\
  \ window stays short. In `--swarm` flows only the coordinator runs the helper; bucket\
  \ agents remain handoff producers.\n### Clean Controller Gate (before claims, worktrees,\
  \ reconciliation)\n\nAfter the WPAC gate is skipped or passes:\n\n1. At the **orchestration\
  \ git root** (the repo from which you run this command — normally the Workspace-Control\
  \ owner, e.g. `<gald3r_source>`): run `git status --short`. If anything is listed\
  \ **outside** this run's explicit coordinator staging allowlist for the active task\
  \ and bug IDs, **STOP** here. Do not claim tasks or bugs, create or reuse T170 worktrees,\
  \ partition swarms, or write coordinator-owned updates to `.gald3r/TASKS.md`, `.gald3r/BUGS.md`,\
  \ other shared `.gald3r` coordination files, `CHANGELOG.md`, generated Copilot prompts,\
  \ or parity output until unrelated changes are committed, stashed, or moved to a\
  \ prior focused commit. Preserve any bucket handoff artifacts already produced and\
  \ list the paths that blocked progress.\n\n2. **`gald3r worktree create -AllowDirty`**:\
  \ do not use this switch for `g-go`, `g-go-code`, `g-go-review`, or any `--swarm`\
  \ variant **except** when every dirty path is owned exclusively by the active task/bug\
  \ scope and a `## Status History` row documents that override. Otherwise clean the\
  \ checkout first. The same **per-root** `-AllowDirty` discipline applies to every\
  \ repository included in the touch set below when multi-repo work is in scope.\n\
  \n3. **Member touch-set (v1 — `workspace_repos`)** — The orchestration root is **always**\
  \ gated. When the active task or bug declares **`workspace_repos:`** with manifest\
  \ `repository.id` entries, extend the gate to each **other** resolved member root\
  \ (blast radius follows declared cross-repo scope). Read `.gald3r/linking/workspace_manifest.yaml`\
  \ when present; map each listed ID (deduplicated) to `repositories[?].local_path`.\
  \ For each existing path, run `git -C \"<path>\" rev-parse --show-toplevel` then\
  \ `git status --short` at that root. Apply the same **explicit coordinator staging\
  \ allowlist** per root. Skip IDs whose paths are missing while `lifecycle_status`\
  \ is a planned/bootstrap gap (report only; do not expand the touch set). If the\
  \ manifest is missing while `workspace_repos` is non-empty, or an ID is unknown\
  \ under `repositories:`, **STOP** multi-repo coordinator work until manifest or\
  \ frontmatter is repaired (controller-only queue items whose `workspace_repos` lists\
  \ only the owner id may proceed once that id resolves).\n\n4. **Touch-set expansion\
  \ (v2 — optional signals)** — Union extra repository roots into the same per-root\
  \ checks (still **not** a blanket scan of every manifest member):\n   - **`extended_touch_repos:`**\
  \ — optional task/bug YAML list of additional manifest `repository.id` values beyond\
  \ `workspace_repos`.\n   - **`touch_repos:` (swarm handoffs)** — In `--swarm` runs,\
  \ when bucket work edits roots not already covered by `workspace_repos` + `extended_touch_repos:`,\
  \ bucket summaries and the coordinator reconciliation block MUST list those ids\
  \ under `touch_repos:` so the union is gated before shared writes.\n   - **Subsystem\
  \ `locations:` absolutes** — When the active item declares **`subsystems:`**, read\
  \ each `.gald3r/subsystems/{name}.md` frontmatter **`locations:`** (all nested strings).\
  \ For values matching a host **absolute** path (`^[A-Za-z]:[/\\\\]` on Windows,\
  \ or POSIX `/` rooted at `/` elsewhere), if the path exists, resolve `git -C <dir>\
  \ rev-parse --show-toplevel` (use the file's parent directory when the path is a\
  \ file). Each distinct root **other than** the orchestration root joins the touch\
  \ set. Relative paths do not expand the set.\n\n### Pre-Reconciliation Clean Gate\
  \ (before coordinator shared writes)\n\nAlso re-run the **Gald3r Housekeeping Commit\
  \ Gate** with `-Mode post-write -Apply` against the orchestration root immediately\
  \ after each coordinator-owned shared `.gald3r` write so safe controller coordination\
  \ state lands in a focused `chore(gald3r): commit g-go coordination state` commit\
  \ before the next major phase begins.\n\n\nImmediately before the coordinator merges\
  \ bucket results into the primary checkout, updates shared `.gald3r` indexes or\
  \ task/bug files as coordinator-owned writes, touches `CHANGELOG.md`, or creates\
  \ checkpoint / review-result commits: **re-run** `git status --short` on the **orchestration\
  \ root and every other repository root in the computed touch set** (steps 1 + 3\
  \ + 4). For `--swarm` runs, if unrelated dirty paths appear in **any** of those\
  \ roots during parallel bucket work, **fail closed** — do not apply those shared\
  \ writes; keep patches, artifacts, and evidence; report **per-root** blockers using\
  \ the same blocker family as checkpoint and review-result commits.\n\n### WPAC inbox\
  \ Heartbeats (Swarm / Long Runs)\n\nFor swarm mode or any run lasting more than\
  \ 30 minutes, the coordinator reruns the WPAC inbox check every 30 minutes and once\
  \ more before the final summary. If a conflict appears mid-run, pause new claims/spawns/reconciliation,\
  \ preserve worktrees and partial outputs, and require `@g-wpac-read` before continuing.\n\
  \n## Usage\n\n```\n@g-go-code-swarm\n@g-go-code-swarm tasks 7, 9, 10, 11, 12\n@g-go-code-swarm\
  \ bugs-only\n```\n\nAll filter arguments pass through to `@g-go-code --swarm`, including\
  \ T580's `--provider`/\n`--model`/`--implementer-provider`/`--implementer-model`\
  \ (BUG-612 companion) — see\n`@g-go-code`'s \"Explicit `--provider`/`--model` override\"\
  \ section for the resolution order and\n`g-go-go.md`'s \"Provider & Model Routing\"\
  \ for the full host-mapping table (Cursor ->\n`cursor-agent` + `gpt-5.6-terra-medium`\
  \ by default).\n\nSee `@g-go-code` for the full implementation protocol, worktree\
  \ isolation rules, and swarm coordinator rules.\n\n### Mid-Flight Course Correction\
  \ (`/steer` + `/queue`) in swarm mode (T969)\n\nThe `@g-steer` / `@g-queue` mechanism\
  \ is **per-worktree** (see \"Mid-Flight Course Correction\" in\n`@g-go-code`). In\
  \ swarm mode each bucket owns its own coding worktree, so steer/queue target a\n\
  bucket: `@g-steer T{id} ...` and `@g-queue T{id} ...` resolve to the worktree holding\
  \ `T{id}`. Each\nbucket agent runs its own steer poll (step b2.5) and queue drain\
  \ (step 7d) independently against its\nown worktree root — the coordinator does\
  \ not aggregate steers across buckets.\n\nLet's implement."
prompt: Run the gald3r `g-go-code-swarm` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-go-code-swarm, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
