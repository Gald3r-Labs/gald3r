version: 1.0.0
title: g-release-propose
description: "\uFEFF---"
instructions: "\uFEFF---\nname: g-release-propose\ndescription: Analyze completed\
  \ tasks and propose the next semantic version bump + draft release notes. Creates\
  \ releases/pending/RELEASE_PROPOSAL_vX.Y.Z.md for human review.\nsubsystem_memberships:\
  \ [RELEASE_AND_VERSIONING]\nexecution_tier: guarded_prompt\n---\n\n# @g-release-propose\n\
  \nActivate `g-skl-release` PROPOSE operation.\n\n## What this does\n\nReads the\
  \ task backlog since the last release tag to determine the appropriate semantic\n\
  version bump (PATCH / MINOR / MAJOR), then drafts a release proposal file for review.\n\
  \n## Usage\n\n```\n@g-release-propose\n@g-release-propose --from v1.6.0      # explicitly\
  \ set the base version\n@g-release-propose --bump minor       # override the auto-detected\
  \ bump level\n```\n\n## Output\n\n- Creates `releases/pending/RELEASE_PROPOSAL_v{next}.md`\n\
  - Prints: \"Ready to cut v{next}? Edit the draft or run `@g-release-cut` to accept.\"\
  \n\n## Agents PROPOSE. Humans APPROVE.\n\nThe proposal is advisory. The human reviews\
  \ the version and notes, edits if needed,\nthen runs `@g-release-cut` to accept.\
  \ Delete the proposal file to reject entirely.\n\n## See also\n\n- `@g-release-cut`\
  \ — accept a proposal and cut the release tag\n- `@g-release-publish` — graduate\
  \ accumulated releases to _test or public tier\n- `g-skl-release` PROPOSE operation\
  \ for full bump logic documentation"
prompt: Run the gald3r `g-release-propose` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-release-propose, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
