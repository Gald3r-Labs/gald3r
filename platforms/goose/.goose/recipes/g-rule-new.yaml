version: 1.0.0
title: g-rule-new
description: g-rule-new - Scaffold a new rule in YOUR project
instructions: "# g-rule-new - Scaffold a new rule in YOUR project\n\nCreates a new\
  \ rule for your own project. You choose where it lives - your AI platform folder\n\
  (e.g. `.cursor/rules/`, `.claude/` rules, `AGENTS.md`) or somewhere in your repo's\
  \ contents.\nNever writes to `.gald3r_sys/`.\n\n## Usage\n\n```\n@g-rule-new <slug>\n\
  @g-rule-new \"no-console-logs\"\n```\n\n- `<slug>` - kebab-case slug for the rule.\n\
  \n## Steps\n\n1. Ask **where** to create it:\n   - **(a) Platform folder** - e.g.\
  \ `.cursor/rules/<slug>.mdc` (Cursor), a rules entry for Claude, etc.\n   - **(b)\
  \ Repo contents** - a path you specify inside your project.\n2. Collect the rule\
  \ description and whether it always applies or is scoped to file globs.\n3. Write\
  \ the rule file from the template at the chosen location.\n4. Offer a CHANGELOG\
  \ entry if your project keeps one."
prompt: Run the gald3r `g-rule-new` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-rule-new, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
