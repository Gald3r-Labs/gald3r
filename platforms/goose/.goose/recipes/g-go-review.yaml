version: 1.0.0
title: g-go-review
description: 'Verification-only backlog review: $ARGUMENTS'
instructions: "Verification-only backlog review: $ARGUMENTS\n\n## Mode: REVIEW ONLY\n\
  \n> ⚠️  **Run this in a NEW agent session** — different window, different invocation.\n\
  > If you implemented any of these tasks in this session, **skip them** (leave `[\U0001F50D\
  ]`).\n> Self-review defeats the purpose of this gate.\n\n> **Scope is set by the\
  \ coordinator, not here.** Workspace scope (`--local` / `--workspace <id>`\n> /\
  \ `--workspace` / the `g_go_default_scope` config default) is resolved by the `g-go`\
  \ /\n> `g-go-swarm` coordinator at its Auto-Plan Step 1a and handed down as the\
  \ already-filtered review\n> queue (or explicit task IDs). When `g-go-review` is\
  \ invoked directly with explicit task IDs, it\n> reviews exactly those `[\U0001F50D\
  ]` IDs. When invoked directly with no IDs, treat the scope as\n> **local-only**\
  \ — `g-go-review` does not re-evaluate `g_go_default_scope`; let `g-go` own the\n\
  > controller-default workspace_all expansion.\n\n## Provider & Model Selection (T580,\
  \ BUG-612 companion)\n\n`$ARGUMENTS` MAY carry an explicit `--provider <provider>[:<model>]`\
  \ and/or `--model <model>`\n(global) plus `--reviewer-provider`/`--reviewer-model`\
  \ (role-explicit — identical to the global\nform here since this command's only\
  \ role IS the reviewer). Resolution order: role-specific /\nglobal CLI override\
  \ > invoking host/parent-model mapping (a detected Cursor host maps to\n`cursor-agent`\
  \ + `gpt-5.6-terra-medium` by default; Claude Code / unknown hosts stay `claude`)\
  \ >\ntask `preferred_model:` > session default — see `g-go-go.md`'s \"Provider &\
  \ Model Routing\"\nsection for the full precedence/host-mapping table `gald3r autopilot\
  \ loop` implements in code\n(`agent_role_routing.resolve_agent_target(\"reviewer\"\
  , ...)`). **Independence is unaffected by\nprovider/model choice** — a reviewer\
  \ resolved to a different provider or model than the\nimplementer still runs in\
  \ a fresh session with no Phase 1 context; provider/model selection and\nreview\
  \ independence are orthogonal concerns and this command enforces both regardless\
  \ of which\nprovider was used to implement the work under review.\n\n---\n\n\n###\
  \ Step 0 — Workspace Member Clean-Status Preflight (T1431)\n\nBefore the WPAC gate\
  \ / review-queue build / claim / review-worktree creation, run the **read-only**\n\
  workspace member clean-status preflight: scan `.gald3r/linking/workspace_manifest.yaml`,\
  \ run\n`git -C <path> status --short` on each `autonomous_child` member, and either\
  \ print\n`Workspace clean -- N members checked` (proceed) or a per-repo dirty-status\
  \ table asking the user\nto commit/stash first. Never auto-commits or writes. `--skip-member-clean-check`\
  \ bypasses with a\nprinted warning. Additive to the Housekeeping Commit Gate. **Full\
  \ authoritative algorithm: see\n`g-go.md` Step 0.**\n\n---\n\n### Step 0b — CLI\
  \ Invocation Rule: `uv run gald3r` (BUG-591)\n\nEvery `gald3r <verb>` call in this\
  \ run (`gald3r housekeep`, `gald3r task`/`gald3r bug` verdict\nverbs, `gald3r worktree\
  \ create` for a review-swarm bucket, `gald3r search`, etc.) MUST run as\n**`uv run\
  \ gald3r <verb>`**, never bare `gald3r`, whenever cwd is a dev checkout of `gald3r_core`.\n\
  A bare call can resolve to a stale PATH binary that silently shadows this checkout's\
  \ dev source\n(BUG-591) — including a reviewer's own PASS/FAIL status-write landing\
  \ in the wrong `.gald3r/`\nacross a worktree boundary. **Full text, rationale, and\
  \ the optional machine-actionable staleness\nhard-fail check: see `g-go.md` Step\
  \ 0b.**\n\n---\n\n### WPAC inbox Gate (Only When WPAC is configured)\n\nBefore task\
  \ claiming, implementation, verification, planning, or swarm partitioning, first\
  \ determine whether this project is a WPAC participant. WPAC is configured only\
  \ when `.gald3r/linking/link_topology.md` declares at least one parent/child/sibling\
  \ relationship, or `.gald3r/PROJECT.md` explicitly declares WPAC project linking\
  \ relationships. A Workspace-Control manifest and local `INBOX.md` alone do not\
  \ make the project a WPAC group member.\n\nIf WPAC is configured, run the re-callable\
  \ inbox check when the hook exists:\n\n```powershell\n$hook = @( \".cursor\\hooks\\\
  g-hk-wpac-inbox-check.py\", \".claude\\hooks\\g-hk-wpac-inbox-check.py\", \".agent\\\
  hooks\\g-hk-wpac-inbox-check.py\", \".codex\\hooks\\g-hk-wpac-inbox-check.py\",\
  \ \".opencode\\hooks\\g-hk-wpac-inbox-check.py\" ) | Where-Object { Test-Path $_\
  \ } | Select-Object -First 1\nif ($hook) { python $hook -ProjectRoot . -BlockOnConflict\
  \ }\n```\n\nInstalled templates may call the equivalent hook from the active IDE\
  \ folder. If the check reports `INBOX CONFLICT GATE` or exits with code `2`, stop\
  \ immediately and run `@g-wpac-read`; do not claim tasks, create worktrees, spawn\
  \ reviewers, or continue planning until conflicts are resolved. Non-conflict requests,\
  \ broadcasts, and syncs are advisory and should be surfaced in the session summary.\
  \ If WPAC is not configured, skip this gate and report `WPAC: not configured / skipped`.\n\
  \n\n### Gald3r Housekeeping Commit Gate (T531)\n\n<!-- T531-HOUSEKEEPING-GATE -->\n\
  After the WPAC gate is skipped or passes and **before** the Clean Controller Gate\
  \ hard-blocks the run, run the safety classifier helper at the orchestration root:\n\
  \n```powershell\ngald3r housekeep -Mode preflight -Apply -TaskId <id-when-known>\
  \ -Json\n```\n\nBehavior:\n\n- **`clean`** -> continue.\n- **`safe-gald3r-housekeeping`**\
  \ -> the helper stages **only** allowlisted controller `.gald3r/` paths via explicit\
  \ `git add -- <paths>` (never `git add .`), re-checks for drift, and creates a focused\
  \ `chore(gald3r): preflight gald3r housekeeping` commit. The run continues automatically.\n\
  - **`unsafe-gald3r` / `mixed-dirty` / `conflict` / `drift-detected` / unknown `.gald3r`\
  \ paths / member-repo `config-fault`** -> the helper exits non-zero, the existing\
  \ Clean Controller Gate hard-block applies, and the run STOPs with the exact unsafe\
  \ paths listed.\n\nThe helper allowlist covers the safe controller `.gald3r/` coordination\
  \ surfaces (TASKS.md, BUGS.md, FEATURES.md, PRDS.md, SUBSYSTEMS.md, IDEA_BOARD.md,\
  \ learned-facts.md, tasks/, bugs/, features/, prds/, subsystems/, reports/, logs/wpac_auto_actions.log,\
  \ linking/sent_orders/, linking/INBOX.md). The deny list covers `.identity`, `.user_id`,\
  \ `.project_id`, `.vault_location`, `vault/`, `config/`, `.gald3r-worktree.json`,\
  \ secret-named files, and unknown `.gald3r/` paths. Member-repo targets (marker-only\
  \ `.gald3r/`) are refused -- this gate is **controller-only**.\n\nRe-run the helper\
  \ in `-Mode post-write -Apply` immediately after coordinator-owned shared `.gald3r`\
  \ writes (task/bug status writes, review-result writes, sent_orders ledger updates,\
  \ safe report/log outputs) and before the next major phase so the shared-state dirty\
  \ window stays short. In `--swarm` flows only the coordinator runs the helper; bucket\
  \ agents remain handoff producers.\n### Clean Controller Gate (before claims, worktrees,\
  \ reconciliation)\n\nAfter the WPAC gate is skipped or passes:\n\n1. At the **orchestration\
  \ git root** (the repo from which you run this command — normally the Workspace-Control\
  \ owner, e.g. `<gald3r_source>`): run `git status --short`. If anything is listed\
  \ **outside** this run's explicit coordinator staging allowlist for the active task\
  \ and bug IDs, **STOP** here. Do not claim tasks or bugs, create or reuse T170 worktrees,\
  \ partition swarms, or write coordinator-owned updates to `.gald3r/TASKS.md`, `.gald3r/BUGS.md`,\
  \ other shared `.gald3r` coordination files, `CHANGELOG.md`, generated Copilot prompts,\
  \ or parity output until unrelated changes are committed, stashed, or moved to a\
  \ prior focused commit. Preserve any bucket handoff artifacts already produced and\
  \ list the paths that blocked progress.\n\n2. **`gald3r worktree create -AllowDirty`**:\
  \ do not use this switch for `g-go`, `g-go-code`, `g-go-review`, or any `--swarm`\
  \ variant **except** when every dirty path is owned exclusively by the active task/bug\
  \ scope and a `## Status History` row documents that override. Otherwise clean the\
  \ checkout first. The same **per-root** `-AllowDirty` discipline applies to every\
  \ repository included in the touch set below when multi-repo work is in scope.\n\
  \n3. **Member touch-set (v1 — `workspace_repos`)** — The orchestration root is **always**\
  \ gated. When the active task or bug declares **`workspace_repos:`** with manifest\
  \ `repository.id` entries, extend the gate to each **other** resolved member root\
  \ (blast radius follows declared cross-repo scope). Read `.gald3r/linking/workspace_manifest.yaml`\
  \ when present; map each listed ID (deduplicated) to `repositories[?].local_path`.\
  \ For each existing path, run `git -C \"<path>\" rev-parse --show-toplevel` then\
  \ `git status --short` at that root. Apply the same **explicit coordinator staging\
  \ allowlist** per root. Skip IDs whose paths are missing while `lifecycle_status`\
  \ is a planned/bootstrap gap (report only; do not expand the touch set). If the\
  \ manifest is missing while `workspace_repos` is non-empty, or an ID is unknown\
  \ under `repositories:`, **STOP** multi-repo coordinator work until manifest or\
  \ frontmatter is repaired (controller-only queue items whose `workspace_repos` lists\
  \ only the owner id may proceed once that id resolves).\n\n4. **Touch-set expansion\
  \ (v2 — optional signals)** — Union extra repository roots into the same per-root\
  \ checks (still **not** a blanket scan of every manifest member):\n   - **`extended_touch_repos:`**\
  \ — optional task/bug YAML list of additional manifest `repository.id` values beyond\
  \ `workspace_repos`.\n   - **`touch_repos:` (swarm handoffs)** — In `--swarm` runs,\
  \ when bucket work edits roots not already covered by `workspace_repos` + `extended_touch_repos:`,\
  \ bucket summaries and the coordinator reconciliation block MUST list those ids\
  \ under `touch_repos:` so the union is gated before shared writes.\n   - **Subsystem\
  \ `locations:` absolutes** — When the active item declares **`subsystems:`**, read\
  \ each `.gald3r/subsystems/{name}.md` frontmatter **`locations:`** (all nested strings).\
  \ For values matching a host **absolute** path (`^[A-Za-z]:[/\\\\]` on Windows,\
  \ or POSIX `/` rooted at `/` elsewhere), if the path exists, resolve `git -C <dir>\
  \ rev-parse --show-toplevel` (use the file's parent directory when the path is a\
  \ file). Each distinct root **other than** the orchestration root joins the touch\
  \ set. Relative paths do not expand the set.\n\n### Pre-Reconciliation Clean Gate\
  \ (before coordinator shared writes)\n\nAlso re-run the **Gald3r Housekeeping Commit\
  \ Gate** with `-Mode post-write -Apply` against the orchestration root immediately\
  \ after each coordinator-owned shared `.gald3r` write so safe controller coordination\
  \ state lands in a focused `chore(gald3r): commit g-go coordination state` commit\
  \ before the next major phase begins.\n\n\nImmediately before the coordinator merges\
  \ bucket results into the primary checkout, updates shared `.gald3r` indexes or\
  \ task/bug files as coordinator-owned writes, touches `CHANGELOG.md`, or creates\
  \ checkpoint / review-result commits: **re-run** `git status --short` on the **orchestration\
  \ root and every other repository root in the computed touch set** (steps 1 + 3\
  \ + 4). For `--swarm` runs, if unrelated dirty paths appear in **any** of those\
  \ roots during parallel bucket work, **fail closed** — do not apply those shared\
  \ writes; keep patches, artifacts, and evidence; report **per-root** blockers using\
  \ the same blocker family as checkpoint and review-result commits.\n\n## Execution\
  \ Protocol\n\n### 0. Branch Pre-Flight (BUG-095 fix, T1374)\n\n**Run before any\
  \ task scanning or review work.**\n\n1. Read `implementation_branch` from all `[\U0001F50D\
  ]` task files in `tasks/verification/` (or wherever TASKS.md points).\n2. Collect\
  \ unique non-empty `implementation_branch` values.\n\n**Case A — all tasks share\
  \ one branch, it differs from current branch:**\n```powershell\n# Preferred: create\
  \ a review worktree from the implementation branch (T207 policy)\ngald3r worktree\
  \ create -Branch <implementation_branch> -Role review\n# Fallback if worktree helper\
  \ unavailable:\ngit checkout <implementation_branch>\n```\nLog: `\U0001F500 Branch\
  \ pre-flight: switched to implementation branch (<branch> / <sha[:8]>)`\n\n**Case\
  \ B — already on the correct branch:**\nLog: `✅ Branch pre-flight: already on implementation\
  \ branch (<branch>)` — continue.\n\n**Case C — `implementation_branch` absent on\
  \ ALL tasks (legacy, no field):**\nLog: `⚠️ Branch pre-flight: no implementation_branch\
  \ field on tasks — legacy fallback, reviewing on current branch (<branch>)`  — continue.\n\
  \n**Case D — tasks have MIXED `implementation_branch` values:**\n```\n⛔ Branch pre-flight:\
  \ multiple implementation branches in review queue:\n   - T-NNN: <branch1>\n   -\
  \ T-MMM: <branch2>\nScope your g-go-review to one branch at a time. Run:\n  git\
  \ checkout <branch> && g-go-review --tasks T-NNN,...\n```\n**STOP — do not proceed.**\n\
  \n**Swarm mode:** The coordinator runs this pre-flight before partitioning buckets.\
  \ All buckets inherit the resolved `implementation_branch`.\n\n---\n\n### 1. Load\
  \ Context\n\nRead in this order:\n- `.gald3r/TASKS.md` — identify all `[\U0001F50D\
  ]` (Awaiting Review) tasks and skip non-expired `[\U0001F575️]` verification claims\n\
  - `.gald3r/BUGS.md` — identify all bugs with `[\U0001F50D]` status in the index\
  \ table and skip non-expired `[\U0001F575️]` verification claims\n- Individual task\
  \ files for each `[\U0001F50D]` task item — **read `## Handoff Report` first** (Files\
  \ Changed, Commands Run, Issues Discovered, Left Undone, Procedure Compliance),\
  \ then read acceptance criteria. The Handoff Report is the primary review context;\
  \ use it to focus verification on changed files and discovered issues.\n- Individual\
  \ bug files (`.gald3r/bugs/bug*.md`) for each `[\U0001F50D]` bug — read fix description\
  \ and affected file/line\n- `git log --oneline -10` — understand what was recently\
  \ implemented\n- `.gald3r/CONSTRAINTS.md` — guardrails\n- **Active workflow profile\
  \ (T1239)** — load once via `gald3r project-type resolve` (active\n  skill folder;\
  \ see g-skl-tasks \"Reading the active profile\"). The review-gate\n  status (the\
  \ `[\U0001F50D]`-equivalent), the PASS target, and the FAIL target come from\n \
  \ the profile's `review_gate` + `task_statuses[]` rather than hardcoded strings\n\
  \  (AC1). For `software_dev` these resolve to `awaiting-verification` → PASS `done`\n\
  \  / FAIL `pending` exactly as before; a `content_creation` project reviews\n  `in_review`\
  \ → PASS `rendering`/`published` per its DAG order. Absent\n  `.gald3r/config/workflow_profiles/`\
  \ → built-in `software_dev` lifecycle.\n\n> If a task has no `## Handoff Report`\
  \ section, note \"No Handoff Report\" in your review summary and proceed to read\
  \ the implementation files listed in acceptance criteria directly.\n\n> **Codebase\
  \ search (g-rl-43 / BUG-519)**: for any codebase content search, prefer\n> `gald3r\
  \ search <pattern> [--path DIR]`; it is **mandatory**, not just preferred, whenever\n\
  > a search must see inside `.gald3r/` or `.gald3r_sys/` — the harness/ripgrep `Grep`\
  \ tool is\n> gitignore-aware and silently misses gitignored trees like `.gald3r_sys/`\
  \ on broad searches.\n\n### 2. Build the Review Queue\n\nCollect all reviewable\
  \ items — both tasks **and bugs**:\n- **Tasks**: all `[\U0001F50D]` entries in `TASKS.md`\n\
  - **Bugs**: all bugs in `BUGS.md` with `[\U0001F50D]` in the status column + verify\
  \ `status: awaiting-verification` in the individual `bugs/bug*.md` file\n- **Skip\
  \ active claims**: any `[\U0001F575️]` item with a future `verifier_claim_expires_at`\n\
  - **Take over stale claims**: include `[\U0001F575️]` items with expired or missing\
  \ `verifier_claim_expires_at`; append a Status History takeover row and reclaim\
  \ before review\n\nIf `$ARGUMENTS` specifies IDs (e.g. `@g-go-review tasks 14 15`\
  \ or `@g-go-review bugs BUG-013`), review only those.\n\n**Skip any item you implemented\
  \ in this session.** Leave it `[\U0001F50D]` for a future agent.\n\nDisplay the\
  \ queue before reviewing:\n```\nReview Queue:\n  T-014 [\U0001F50D] Fix vault path\
  \ resolution (task)\n  T-017 [\U0001F50D] Platform parity sync (task)\n  BUG-013\
  \ [\U0001F50D] Null guard on user.profile (bug)\n```\n\n### 2a. Claim Review Items\n\
  \nBefore inspecting implementation details, claim each selected item:\n\n1. Change\
  \ the task/bug status from `[\U0001F50D]` / `awaiting-verification` to `[\U0001F575\
  ️]` / `verification-in-progress`.\n2. Add or replace verifier claim metadata:\n\
  \   ```yaml\n   verifier_owner: \"{platform_or_agent_slug}\"\n   verifier_claimed_at:\
  \ \"{ISO-8601 timestamp}\"\n   verifier_claim_expires_at: \"{ISO-8601 timestamp}\"\
  \  # default 120 minutes\n   ```\n   **Resolving `{platform_or_agent_slug}` (T580/BUG-612):**\
  \ this is a recorded audit field, not a\n   CLI flag with an auto-default, so it\
  \ must be filled in explicitly. Read\n   `$env:GALD3R_GGO_REVIEWER_PROVIDER` (PowerShell)\
  \ / `$GALD3R_GGO_REVIEWER_PROVIDER` (bash) — the\n   actually-resolved reviewer\
  \ provider T580's role routing exports whenever it differs from the\n   Claude default\
  \ (Cursor host mapping, an explicit `--reviewer-provider`/`--provider` override,\n\
  \   ...). If that variable is unset or empty, use your own real host identity (`claude`,\n\
  \   `cursor-agent`, ...) — never a bare literal guess independent of what actually\
  \ launched you.\n3. Append Status History: `awaiting-verification -> verification-in-progress`.\n\
  4. If reclaiming a stale `[\U0001F575️]` item, the Status History message must name\
  \ the previous `verifier_owner` and claim expiry.\n5. Never review an item currently\
  \ claimed by a different non-expired verifier.\n\n### 2b. Establish Review Isolation\n\
  \nAfter claiming and before inspecting implementation details, isolate the review\
  \ source.\n\n**Default: review worktree from checkpoint commit.** Use the shared\
  \ T170 helper when the review source is branch-addressable. Normal `g-go-code` /\
  \ `g-go --swarm` handoff provides a code-complete checkpoint branch and commit SHA;\
  \ prefer that source over dirty snapshot inspection.\n\n```powershell\ngald3r worktree\
  \ create -TaskId {id_or_bucket} -Role review -BaseBranch {review_source_branch_or_HEAD}\
  \ -Json\n```\n\nOwner is auto-resolved (T580/BUG-612): omitting `-Owner` lets the\
  \ helper pick up your ACTUALLY\nresolved reviewer provider (`GALD3R_GGO_REVIEWER_PROVIDER`)\
  \ before falling back to the pre-T580\n`USERNAME`/`USER`/`agent` default — same\
  \ mechanism as `g-go-code.md` Step 3. Pass `-Owner <value>`\nexplicitly only to\
  \ override it.\n\nBefore using worktree mode, prove the candidate changes are reachable\
  \ from `review_source_branch_or_HEAD`:\n- If the implementation has a checkpoint\
  \ commit, record that branch/commit as the review source and create the review worktree\
  \ from it.\n- If `git diff --quiet` is false for the candidate checkout, or required\
  \ changed paths are not present in the candidate branch, do **not** create a `-BaseBranch\
  \ HEAD` review worktree. Use snapshot mode instead.\n- A review worktree must never\
  \ inspect a stale clean `HEAD` when the actual candidate exists only as dirty files\
  \ in another checkout.\n\nRecord the helper output in task/bug metadata:\n\n```yaml\n\
  review_isolation_mode: worktree\nreview_worktree_path: \"{worktree_path}\"\nreview_worktree_branch:\
  \ \"{worktree_branch}\"\nreview_worktree_owner: \"{owner}\"\nreview_worktree_created_at:\
  \ \"{created_at}\"\nreview_source_branch: \"{base_branch}\"\nreview_source_commit:\
  \ \"{git rev-parse base_branch}\"\n```\n\n**Shared-sandbox mode (T1118).** When\
  \ the `g-go` coordinator hands off `shared_sandbox: true` and a `shared_worktree_path`\
  \ (the `--shared-sandbox` flow), do **NOT** create a separate `review` worktree.\
  \ Reuse the named Phase 1 `code` worktree read-only — the Phase 1 checkpoint commits\
  \ and installed dependencies are already present there, so the reviewer sees the\
  \ same git/filesystem state without re-cloning. Record:\n\n```yaml\nreview_isolation_mode:\
  \ shared-worktree\nreview_worktree_path: \"{shared_worktree_path}\"\nreview_source_branch:\
  \ \"{implementation_branch}\"\nreview_source_commit: \"{git rev-parse implementation_branch}\"\
  \n```\n\nShared-worktree mode is read-only for the reviewer (same boundary as snapshot\
  \ mode): inspect files under `shared_worktree_path`, but never modify implementation\
  \ files there unless the user explicitly requests fix-forward review, in which case\
  \ the coordinator reconciles the changes. The independence guarantee is unaffected\
  \ — the reviewer is still a fresh agent with no Phase 1 reasoning context; only\
  \ the worktree filesystem is shared. This mode applies only when the coordinator\
  \ passes the shared-sandbox handoff; without it, use the default worktree-from-checkpoint\
  \ or snapshot fallback below.\n\n**Snapshot mode fallback.** Use snapshot mode instead\
  \ of creating a review worktree only when the candidate changes are explicitly left\
  \ uncommitted, dirty, or non-branch-addressable. Record:\n\n```yaml\nreview_isolation_mode:\
  \ snapshot\nreview_snapshot_path: \"{absolute checkout/worktree path inspected read-only}\"\
  \nreview_source_branch: \"{git branch --show-current}\"\nreview_source_commit: \"\
  {git rev-parse HEAD}\"\nreview_source_dirty: true\n```\n\nSnapshot mode is read-only.\
  \ The reviewer may inspect files in the source checkout, but must not modify implementation\
  \ files there.\n\nIf the handoff names a checkpoint commit, do not use snapshot\
  \ mode unless the checkpoint is missing required changed paths or the user explicitly\
  \ asks to review dirty state.\n\n**Active implementation worktree conflicts.** If\
  \ an item still has a non-expired implementation claim or active implementation\
  \ worktree metadata, do not create a review worktree from it and do not mutate it.\
  \ Skip the item unless the implementation status is `[\U0001F50D]` / awaiting-verification\
  \ or the handoff explicitly names that worktree as the read-only snapshot source.\n\
  \n**Fix-forward boundary.** Review is read-only by default. If the user explicitly\
  \ requests fix-forward review, the reviewer may write fixes only inside its own\
  \ `review` worktree, must return a patch/result payload, and the coordinator must\
  \ reconcile those changes explicitly. Never edit an implementation worktree or the\
  \ primary checkout directly during review.\n\n### 2b-i. Verify Worktree Base Commit\
  \ — MANDATORY (BUG-620)\n\n**Before trusting ANY code read from `review_worktree_path`\
  \ (or `shared_worktree_path`)**, the\nreviewer MUST independently confirm the worktree\
  \ is actually checked out at, or ahead of, the\nstated checkpoint commit. This applies\
  \ regardless of how the worktree was provisioned — the T170\n`gald3r worktree create`\
  \ helper documented above, or an Agent tool's own `isolation: 'worktree'`\nparam\
  \ when the reviewer itself is spawned as a subagent. BUG-620 confirmed, independently,\
  \ via 3\nof 4 fresh reviewers in one review-swarm iteration, that a worktree can\
  \ be silently pinned at a\ncommit dozens of commits behind the actual checkpoint\
  \ SHA under review — with every fix commit\nunder review literally absent from the\
  \ checked-out files. Trusting the checkout at face value\nrisks a false RESOLVE\
  \ (reviewing stale, already-superseded code that happens to still pass) or a\nfalse\
  \ REOPEN (missing a real fix present only at the true tip). It self-corrected by\
  \ luck in that\nincident, not by design — this step makes the check mandatory instead\
  \ of incidental.\n\nRun, in the worktree directory, **before reading or evaluating\
  \ any file inside it**:\n\n```powershell\ngit -C {review_worktree_path} rev-parse\
  \ HEAD\ngit -C {review_worktree_path} merge-base --is-ancestor {review_source_commit}\
  \ HEAD\n```\n\n- `merge-base --is-ancestor` exits `0` when `HEAD` equals or descends\
  \ from `review_source_commit`\n  (the stated checkpoint SHA) → **verification PASSES**,\
  \ proceed normally.\n- A non-zero exit (or `HEAD` not resolving at all) → the worktree's\
  \ `HEAD` is stale, diverged, or\n  otherwise does not contain the checkpoint commit\
  \ → **verification FAILS**. Do **not** proceed to\n  read or evaluate code from\
  \ this worktree yet.\n\n**On verification failure, self-correct BEFORE proceeding**\
  \ — never silently review whatever\nhappens to be checked out. Pick whichever is\
  \ fastest and safest for the situation:\n- Re-fetch and re-checkout the worktree\
  \ against the stated checkpoint SHA/branch (`git -C\n  {review_worktree_path} fetch`,\
  \ then `git -C {review_worktree_path} checkout\n  {review_source_commit}`), or re-run\
  \ the T170 `gald3r worktree create` helper to reprovision it.\n- Overlay just the\
  \ files needed via `git -C {review_worktree_path} show\n  {review_source_commit}:{path}`,\
  \ reading the correct commit's content directly rather than\n  trusting the rest\
  \ of the stale checkout.\n- A documented fast-forward-only merge into the worktree\
  \ branch (`git -C {review_worktree_path}\n  merge --ff-only {review_source_commit}`),\
  \ review the now-current files, then revert that merge\n  once the review read is\
  \ complete so the worktree is left as found.\n\n**Report the mismatch — mandatory\
  \ when verification failed.** The review report / Review Note\nMUST explicitly state\
  \ that a base-commit mismatch was detected and how it was self-corrected, e.g.:\n\
  `BASE-COMMIT MISMATCH: worktree HEAD was {stale_sha} (worktree not an ancestor of\n\
  {review_source_commit}); re-fetched and re-checked-out before review.` This is required\
  \ even when\nthe self-correction fully resolved the issue — the coordinator/user\
  \ needs to know staleness\noccurred, since the underlying worktree-provisioning\
  \ defect is a separate, out-of-band concern\n(likely the Agent tool's own `isolation:\
  \ 'worktree'` behavior, outside this repo's fix surface)\nthat this check exists\
  \ to catch, not to silently paper over.\n\nApplies to `review_isolation_mode: worktree`\
  \ and `review_isolation_mode: shared-worktree`. Not\nrequired for `review_isolation_mode:\
  \ snapshot`, since snapshot mode reads `review_source_commit`\ndirectly via `git\
  \ rev-parse HEAD` in the actual checkout at read time — there is no separately\n\
  provisioned worktree to drift from what was stated.\n\n**Standalone vs coordinator-managed\
  \ writes.**\n- Standalone `@g-go-review` records the claimed item's verdict via\
  \ the verify verb (`gald3r task verify` / `gald3r bug resolve` / `gald3r bug update`\
  \ — see the Verification Verb Gate in step 3/§\"Verification Verb Gate\" below,\
  \ never a hand-edit of the task/bug file or index), then creates the review-result\
  \ commit after those writes.\n- When spawned by `g-go` Phase 2 or `g-go-review --swarm`,\
  \ reviewers run in coordinator-managed mode: return PASS/FAIL payloads, Status History\
  \ rows, evidence, and authorized fix-forward patches only. The coordinator owns\
  \ all task/bug file, `TASKS.md`, `BUGS.md`, changelog/docs, generated prompt, parity\
  \ sync, final staging, and review-result commit writes.\n\n### 2c. Compute Review\
  \ Depth (Ladder Level) — T539 throughput-20/hr program\n\n**Before inspecting implementation\
  \ details** (immediately after establishing review isolation at 2b), compute a **ladder\
  \ level** for each claimed item. This is the mechanism that lets Step 3 below scale\
  \ review depth to actual risk instead of applying the same full adversarial pass\
  \ to every item — the single biggest lever in the owner's 20-verified-items/hour\
  \ throughput target (2026-07-30, T537-T539).\n\nRun, against the review source resolved\
  \ at 2b (`review_source_commit` / `review_worktree_path` / `review_snapshot_path`):\n\
  \n```powershell\ngald3r task review-depth {id} --diff-range \"$(git merge-base main\
  \ {review_source_commit})..{review_source_commit}\" --json\n```\n\nFor bugs, the\
  \ same verb exists on the `bug` side:\n\n```powershell\ngald3r bug review-depth\
  \ {id} --diff-range \"$(git merge-base main {review_source_commit})..{review_source_commit}\"\
  \ --json\n```\n\n(Substitute the actual merge-base against whatever the project's\
  \ trunk branch is when not `main`. Read-only — this never writes anything; it is\
  \ safe to run before or after the `[\U0001F50D] -> [\U0001F575️]` claim.)\n\nThe\
  \ call returns a JSON payload with `level` (`\"minimal\"` / `\"standard\"` / `\"\
  thorough\"` — see `g-skl-verify-ladder`'s existing level vocabulary; this reuses\
  \ it, not a new scale), `blast_radius` (`\"low\"` / `\"medium\"` / `\"high\"`),\
  \ `score`, and `reasons` (a human-readable trail of which score components fired\
  \ — files touched, subsystem criticality, severity/value score, test delta). Record\
  \ `review_ladder_level`, `review_ladder_score`, and the `reasons` list for this\
  \ item; Step 3 below and the verify-verb call both read them.\n\n**Owner safety\
  \ valve.** The command already applies `review_min_level:` from `.gald3r/config/AGENT_CONFIG.md`\
  \ (or an explicit `--level` override) as a **floor** — it can only raise the effective\
  \ level, never lower it. If `review_min_level: thorough` is set, every item resolves\
  \ to `thorough` regardless of its computed score; this is the sanctioned way to\
  \ force the whole queue back to today's full-depth behavior without touching any\
  \ code. `floored: true` / `floor_level` in the JSON payload tell you when this happened\
  \ — mention it in the per-item review note when it did.\n\n**This is a floor on\
  \ SPEED, never a ceiling on JUDGMENT.** A reviewer who notices something suspicious\
  \ at `minimal` or `standard` depth — an AC that doesn't obviously hold, a diff that\
  \ looks bigger than the numstat implies, a security-sensitive pattern the scorer\
  \ didn't recognize — MUST escalate that item to `thorough` treatment before recording\
  \ a verdict. The computed level sets the DEFAULT depth; it never overrides reviewer\
  \ judgment that more scrutiny is warranted.\n\n### 3. Review Each Item\n\n#### 3A.\
  \ Review Each Task\n\nFor each `[\U0001F575️]` task claimed by this verifier:\n\n\
  **Review depth by ladder level (T539)** — branch on the `review_ladder_level` computed\
  \ at Step 2c before running (a)-(g) below:\n\n| Level | Run | Skip |\n|-------|-----|------|\n\
  | `minimal` | (a) read AC, abbreviated (b) — confirm each criterion against a quick\
  \ read of the diff (not a full re-derivation), confirm lint/tests-green from the\
  \ Handoff Report or a single listed `verification_commands` run, (c), (d) for anything\
  \ obviously encountered, (e), (f), (g) | b2, b3, Step S, Step E, Step U |\n| `standard`\
  \ | (a), full per-criterion (b), b2 (workspace boundary — cheap, always run), b3\
  \ inline OWASP/STRIDE pass (only when the diff already meets its own web/API/auth/data/integration\
  \ trigger), (c), (d), (e), (f), (g) | Step S two-phase adversarial scan, Step U\
  \ (unless an AC explicitly requires a live UI-test gate) |\n| `thorough` | Everything\
  \ — (a) through (g), b2, b3, Step S, Step E, Step U, exactly as documented below\
  \ (today's default, unchanged) | nothing |\n\n**This table sets the DEFAULT depth\
  \ only — it is a floor on speed, never a ceiling on judgment** (see Step 2c). Any\
  \ FAIL, any Critical/High security finding, or reviewer judgment that an item needs\
  \ deeper scrutiny than its computed level provides ESCALATES that item to `thorough`\
  \ treatment before recording a verdict, regardless of what Step 2c computed. When\
  \ you escalate, note why in the review note (`escalated {level} -> thorough: {reason}`).\n\
  \n**a) Read task spec** — list all acceptance criteria\n**b) Check each criterion\
  \ against actual files/code**\n  - If `review_isolation_mode: worktree`, inspect\
  \ files under `review_worktree_path`.\n  - If `review_isolation_mode: snapshot`,\
  \ inspect files under `review_snapshot_path` read-only.\n**b2) Workspace boundary\
  \ check** — run `g-skl-workspace` ENFORCE_SCOPE against changed paths and the task/bug\
  \ routing metadata; unknown manifest repo IDs, undeclared member writes, docs-only\
  \ source changes, or member writes without manifest permission fail the item.\n\
  **b3) Security pass (inline OWASP/STRIDE)** — for tasks that touch web/API/auth/data/integration\
  \ code, apply the OWASP Top 10 checklist from `g-skl-code-review` Step 2 to changed\
  \ files. For tasks adding new services, cross-process boundaries, or significant\
  \ architectural changes, apply STRIDE. Security findings are rated **Critical /\
  \ High / Medium / Low**. Report each finding with OWASP/STRIDE category, file:line,\
  \ and recommended fix. Code annotated with `# nosec: <justification>` or `# security-exempt:\
  \ <reason>` is waived. Any Critical or High finding → flag as unmet criterion (FAIL).\
  \ (T539: SKIPPED entirely at `minimal` ladder level — see the Review-depth-by-level\
  \ table above. Note a critical/security-critical subsystem match already forces\
  \ `thorough` at Step 2c, so this skip only ever applies to genuinely low-blast-radius,\
  \ non-critical-subsystem items.)\n\n**Step S — Two-phase security scan (T1167)**\
  \ — runs **after** b3 inline security pass and **before** the `[\U0001F50D] → [✅]`\
  \ write at step (e). Invokes `g-skl-security-scan` in **Two-Phase Mode** when the\
  \ candidate review source has any changed files outside of `*.md` / `docs/**` /\
  \ `CHANGELOG.md` / `README.md` / `LICENSE`. **T539 gate**: only runs at `thorough`\
  \ ladder level — at `minimal`/`standard`, mark Step S `SKIPPED — ladder level {level}\
  \ (T539)` in the review note and continue to (c) without invoking the two-phase\
  \ scan.\n\n  1. **Eligibility** — list changed files via `git diff HEAD~1..HEAD\
  \ --name-only` against the candidate review source (worktree branch/SHA established\
  \ in Step 2b, or snapshot path). If all changed paths match the doc-only allowlist,\
  \ mark Step S as `SKIPPED` and continue to (c).\n  2. **Invocation** — call `@g-skl-security-scan`\
  \ with the active task ID and review isolation mode passed through. The skill writes\
  \ `.gald3r/reports/security/threat_model.md` (Phase 1) and `.gald3r/reports/security/security_report_YYYYMMDD_HHMMSS.md`\
  \ (Phase 2).\n  3. **Gate verdict** — the skill returns one of:\n     - `verdict:\
  \ PASS` (no Critical/High findings, or all High findings carry justified `# nosec:`\
  \ waivers) → record paths in the review note; continue to (c).\n     - `verdict:\
  \ BLOCK` (any unwaived Critical or High finding) → treat each blocking finding as\
  \ an unmet criterion. For the FAIL handling in step (e):\n       - Append the security\
  \ report path to the task's `## Review Note` section.\n       - The Status History\
  \ FAIL row message must name the blocking findings (e.g., `FAIL: Step S — [HIGH-001]\
  \ SQL injection in api/users.py:87 (see security_report_20260514_213045.md)`).\n\
  \     - `verdict: SKIPPED` (doc-only diff, missing diff range, or `requires_security_scan:\
  \ false` and no non-doc changes) → record skip reason in the review note; continue\
  \ to (c).\n  4. **BUG cross-link** — for each Critical/High finding, `g-skl-security-scan`\
  \ auto-files a BUG via `g-skl-bugs REPORT BUG` (severity mapped from finding severity).\
  \ The returned BUG IDs are recorded in the security report and in the review session\
  \ summary \"Found pre-existing bugs\" list.\n  5. **Waivers** — a High finding is\
  \ honoured as waived only when its line carries a non-empty `# nosec: <≥4-word justification>`\
  \ or `# security-exempt: <reason>` annotation. Critical findings are NEVER waivable\
  \ from inside Step S.\n  6. **Doc-only short-circuit** — Step S is intentionally\
  \ skipped when changed files match `^(\\*.md|docs/.*|CHANGELOG\\.md|README\\.md|LICENSE|\\\
  .gitignore)$`. The skip is recorded in the review note as `Step S SKIPPED — doc-only\
  \ diff`.\n  7. **Idempotency** — re-running Step S overwrites `threat_model.md`\
  \ but never overwrites a timestamped `security_report_*.md`. Multiple runs accumulate;\
  \ the latest report's verdict is the gate verdict for this review pass.\n\n**Step\
  \ E — Encoding CI scan (T1448, optional/non-blocking)** — after Step S and before\
  \ (c), reviewers MAY run the encoding-normalize hook in scan mode as a lightweight\
  \ CI encoding check over the candidate's changed files. (T539: skipped at `minimal`\
  \ ladder level along with the other optional deep-checks; still optional/MAY at\
  \ `standard`/`thorough` as documented below.)\n\n```powershell\n# Reports (exit\
  \ 1) if any changed text file needs encoding normalization; writes nothing.\n.claude/hooks/g-hk-encoding-normalize.py\
  \ -Scan\n```\n\nThis surfaces stray BOMs / CRLF / UTF-16 drift before they reach\
  \ the integration branch. It is **advisory by default** — a non-clean scan is recorded\
  \ in the review note (`Step E: N file(s) need encoding normalization`) and is informational,\
  \ not an automatic FAIL (the pre-commit hook fixes these on commit). Projects that\
  \ want it enforced can treat a non-zero scan as a FAIL via `encoding_scan_enforced:\
  \ true` in `AGENT_CONFIG.md`.\n\n**Step U — UI-Test Verification (Task 190 / BUG-354,\
  \ optional/opt-in)** — after Step E and before (c), reviewers MAY drive+verify a\
  \ native desktop app (Throne, or any OS-level UI) end-to-end when the candidate\
  \ change is UI-affecting (touches the desktop app's UI code, a native dialog, or\
  \ an AC explicitly calls for visual/interaction verification).\n\n  1. **Eligibility**\
  \ — this step only applies when the task/bug touches UI-affecting code (`g-skl-computer-use`\
  \ triggers: desktop UI code paths, native dialogs, screen-driven ACs) **and** the\
  \ reviewer has a concrete, scripted step list to run (see `g-skl-computer-use` SKILL.md\
  \ Quick Start). No eligible change → skip silently, no note required.\n  2. **Invocation**\
  \ — build (or reuse) a JSON step list per `g-skl-computer-use`'s declarative step\
  \ format, then invoke the CLI seam (Task 190 / BUG-354):\n     ```powershell\n \
  \    gald3r ui-test run --steps <path-to-steps.json> --json\n     ```\n     This\
  \ shells out to `UITestDriver` / `run_ui_test` (`gald3r_core.tools.computer.ui_test_driver`)\
  \ without requiring the reviewer to import Python. **Dry-run by default** — records\
  \ the plan, fires no real input, and reports `status: skipped` for any `verify`\
  \ step (this is expected and NOT a failure). Live drive additionally requires **both**\
  \ `--live` on the command **and** the host environment variable `GALD3R_COMPUTER_USE_LIVE=1`\
  \ — the reviewer only sets these deliberately, on a machine handed over for that\
  \ purpose (never on a shared/CI host by default).\n  3. **Gate verdict**:\n    \
  \ - `status: pass` or `status: skipped` (dry-run, no live host available) → record\
  \ in the review note as informational; does not affect the PASS/FAIL verdict at\
  \ (c) unless the task's acceptance criteria explicitly require a live UI verification.\n\
  \     - `status: fail` (live run only — a scripted step or verify check did not\
  \ match) → treat as an unmet criterion for any AC that explicitly required UI verification;\
  \ otherwise record as a note and do not auto-fail unrelated ACs.\n  4. **Non-blocking\
  \ by default** — like Step E, this step is advisory unless the task's acceptance\
  \ criteria explicitly name a live UI-test gate. Most reviews will see it skipped\
  \ (no eligible UI change, or no live host configured) — record `Step U SKIPPED —\
  \ {reason}` in the review note.\n\n**c) Score PASS or FAIL per criterion**\n**d)\
  \ Bug check during review** — if you encounter a bug not covered by the task's ACs:\n\
  \  - Determine: introduced by this task? → flag as unmet criterion → task FAIL\n\
  \  - Pre-existing? → log BUG entry via `g-skl-bugs`, add `BUG[BUG-{id}]` comment,\
  \ note in session summary — does NOT fail this task (see `g-rl-35`)\n**e) Overall\
  \ result:**\n\n**T539 auditability requirement**: every verify-verb call below MUST\
  \ prefix its `--summary`/`--reason` text with `[ladder:{review_ladder_level} score={review_ladder_score}]`\
  \ (values from Step 2c). This is what makes the ladder level auditable — a human\
  \ (or a future agent) reading the task's `## Status History` row can see exactly\
  \ why this item got a lighter or heavier review, without cross-referencing a separate\
  \ log. When Step 2c's `floored: true`, also include the floor: `[ladder:{level}\
  \ score={score} floored-by=review_min_level]`.\n\n  - All criteria PASS → **invoke\
  \ the verify verb — mandatory, this IS how you record the verdict** (see the Verification\
  \ Verb Gate below):\n    ```\n    gald3r task verify {id} --pass --summary \"[ladder:{review_ladder_level}\
  \ score={review_ladder_score}] {brief PASS summary}\"\n    ```\n    This performs\
  \ the DB-first `completed` transition, moves the task file into `tasks/completed/<YYYY>/<MM>/`,\
  \ appends the Status History row, and resyncs `TASKS.md` — all in one call. Do **not**\
  \ hand-edit the task file `status:` field or `TASKS.md`'s indicator directly. Then\
  \ **run docs check (step 3f)**.\n  - Any criterion FAIL → **before recording the\
  \ verdict**:\n    1. **\U0001F6A8 STUCK LOOP CHECK (pre-check)** — count all existing\
  \ rows in the task's `## Status History` where the Message column contains `FAIL:`.\
  \ This determines which path below applies.\n    2. **Count < 3 — invoke the verify\
  \ verb, mandatory:**\n       ```\n       gald3r task verify {id} --fail --reason\
  \ \"[ladder:{review_ladder_level} score={review_ladder_score}] {AC-NNN, AC-NNN}\
  \ not met — {brief reason}\"\n       ```\n       This performs the DB-first `pending`\
  \ transition, appends the `FAIL: {reason}` Status History row, and resyncs the task\
  \ file + `TASKS.md` — all in one call. Do **not** hand-edit the task file `status:`\
  \ field or `TASKS.md`'s indicator directly — that bypasses the SQLite DB `gald3r\
  \ task ready` reads from and leaves the task invisible to future queue scans, silently.\
  \ **This is the exact failure BUG-511 documented**: a review-result commit asserted\
  \ a FAIL transition (`[\U0001F50D] → [\U0001F4CB]`) that no code path had actually\
  \ performed, and the task sat `awaiting-verification` in the DB — invisible to `gald3r\
  \ task ready` — until a human found it by hand.\n    3. **Count ≥ 3 — `[\U0001F6A8\
  ]` escalation:** run the same `gald3r task verify {id} --fail --reason \"...\"`\
  \ call first (still mandatory — it is the only sanctioned way to record the DB-side\
  \ FAIL verdict), then separately mark the task `[\U0001F6A8]` (requires-user-attention)\
  \ by hand-editing the task file YAML `status:` field and `TASKS.md`'s indicator.\
  \ (No CLI verb exists yet for this escalation status — that is a known gap, not\
  \ something to work around by inventing a flag; see this bug's follow-up notes.)\
  \ Append a `## [\U0001F6A8] Requires User Attention` block to the task file:\n \
  \        ```markdown\n         ## [\U0001F6A8] Requires User Attention\n\n     \
  \    This task has failed review **{N} times**. Automated agents will not retry\
  \ it.\n\n         **Last failure reason**: {last FAIL row message}\n\n         **Human\
  \ actions available**:\n         - Revise acceptance criteria → add \"Human reset:\
  \ AC revised\" to Status History → reset to `[\U0001F4CB]`\n         - Split into\
  \ simpler sub-tasks → mark this `[❌]`\n         - Cancel → mark `[❌]` with reason\n\
  \         - Override as complete → mark `[✅]` with manual sign-off note\n      \
  \   ```\n    4. **Clear stale provenance (T1380)** — separately from the verb call,\
  \ reset `implementation_sha: ''` and `implementation_branch: ''` in the task file\
  \ YAML frontmatter (the verify verb does not do this). This prevents the next implementer\
  \ from inheriting a SHA that points at a failed attempt. (PASS path: leave sha/branch\
  \ unchanged — they are correct provenance for completed work.)\n    5. Document\
  \ specific failure reason in task file (Review Note section) — this is supplementary\
  \ context; it augments but never replaces the verify-verb call in step 2/3 above.\n\
  \    - The `--reason` text must name which ACs failed and why. A generic or empty\
  \ reason is not acceptable.\n    - **Agents must NEVER autonomously reset `[\U0001F6A8\
  ]` back to `[\U0001F4CB]` — only a human can do this.**\n\n**f) Docs check** (PASS\
  \ tasks only — fires at true completion):\n  - Does this task add/remove/change\
  \ user-facing behavior? (skills, commands, agents, hooks, rules, conventions)\n\
  \  - **YES** → append entry to `CHANGELOG.md` under `[Unreleased]`; update `README.md`\
  \ if a relevant section exists\n  - **NO** (internal refactor, task file edits,\
  \ bug fixes with no interface change) → skip\n  - Refer to `g-rl-26-readme-changelog.mdc`\
  \ for what qualifies and where to update\n\n**g) Auto-Learn Extraction** (fires\
  \ after each PASS verdict and docs check; also fires for `[\U0001F6A8]` items):\n\
  \n1. **Read the task's `## Status History`** and implementation notes from the task\
  \ file.\n2. **Extract**: \"What architectural decision, pattern, or warning should\
  \ the next agent know from this verified task?\" Produce 0–3 candidate facts. Skip\
  \ entirely if nothing meaningful emerges.\n3. **Dedup**: read `.gald3r/learned-facts.md`;\
  \ skip candidates already present (case-insensitive substring match, first 80 chars).\n\
  4. **Append** novel facts: `- [YYYY-MM-DD] {fact} (context: T{task_id})` under the\
  \ most appropriate section heading (`## Architecture & Conventions`, `## Recurring\
  \ Preferences`, or `## Watch-Outs & Gotchas`). Create section if missing.\n5. **Failure\
  \ trajectory** (fires for `[\U0001F6A8]` items — 3+ FAIL rows — instead of standard\
  \ extract):\n   - Generate a failure-pattern learning: \"T{task_id} reached [\U0001F6A8\
  ] after {N} review attempts. Recurring failure: {brief summary of repeated FAIL\
  \ reason}.\"\n   - Append under `## Watch-Outs & Gotchas`.\n6. **Count and include**\
  \ in the review session summary: `\U0001F9E0 {N} new fact(s) learned` (omit if 0).\n\
  7. **MCP chain** (when backend available): call `memory_capture_session` with the\
  \ extracted facts.\n\n> **Skip silently** when `.gald3r/learned-facts.md` does not\
  \ exist — note as `\U0001F9E0 learned-facts.md not found — skipped`.\n\n**Per-task\
  \ output format:**\n```\nREVIEW: Task 014 — g-go role separation\n  ✅ g-go-code.md\
  \ created in <ECOSYSTEM_ROOT>/<template_full>/.cursor/commands/\n  ✅ g-go-review.md\
  \ created with NEW-SESSION warning\n  ❌ g-go.md not updated — self-review banner\
  \ missing\n  → RESULT: FAIL — moved back to [\U0001F4CB] — reason recorded in task\
  \ file\n```\n\n#### 3B. Review Each Bug\n\nFor each `[\U0001F575️]` bug claimed\
  \ by this verifier:\n\n**Review depth by ladder level (T539)** — same `review_ladder_level`\
  \ computed at Step 2c applies here (via `gald3r bug review-depth`): at `minimal`,\
  \ (c) Regression check is a quick read of the fix's immediate surrounding lines\
  \ only; at `standard`/`thorough`, scan the broader call chain as documented below.\
  \ This is a floor on speed, never a ceiling on judgment — escalate to a full regression\
  \ scan whenever something looks off, same rule as 3A.\n\n**a) Read bug file** —\
  \ note: title, affected file/line, fix description in Status History\n**b) Verify\
  \ the fix is present** — check the referenced file/line; confirm the bug no longer\
  \ exists as described\n**c) Regression check** — scan surrounding code for obvious\
  \ regressions introduced by the fix\n**d) Overall result:**\n  - Fix confirmed present\
  \ + no regression → **invoke the verify verb, mandatory** (see the Verification\
  \ Verb Gate below):\n    ```\n    gald3r bug resolve {id}\n    ```\n    This moves\
  \ the bug to `bugs/completed/`, sets `status: completed`, appends the verification\
  \ note to Status History, and resyncs `BUGS.md` — do **not** hand-edit the bug file\
  \ `status:` field or `BUGS.md`'s indicator directly. **T539 auditability**: `bug\
  \ resolve` has no free-text summary field, so immediately append `[ladder:{review_ladder_level}\
  \ score={review_ladder_score}]` to the bug file's `## Notes` section as a supplementary\
  \ edit (same \"augments, never replaces the verb call\" pattern already used for\
  \ the task-side Review Note).\n  - Fix absent or regression found → **invoke the\
  \ verify verb, mandatory**:\n    ```\n    gald3r bug update {id} --status open --note\
  \ \"[ladder:{review_ladder_level} score={review_ladder_score}] FAIL: {specific reason\
  \ the fix is absent/regressed}\"\n    ```\n    This resyncs the bug file `status:`\
  \ field, `BUGS.md`'s indicator, and appends the note — do **not** hand-edit `BUGS.md`\
  \ or the bug file directly. This is the bug-side equivalent of the gap BUG-511 documented\
  \ for tasks: a commit that only *describes* the reopen, without this call, leaves\
  \ the bug's status stale wherever anything reads it programmatically.\n\n**Bug verdict\
  \ format:**\n```\nREVIEW: BUG-013 — Null guard on user.profile\n  ✅ Null check present\
  \ at src/user.ts:142\n  ✅ No regression visible in calling code\n  → RESULT: PASS\
  \ — marked [✅] in BUGS.md\n```\n\n```\nREVIEW: BUG-007 — Race condition on concurrent\
  \ writes\n  ❌ Fix not found — saveRecord() still has no lock at utils/db.ts:88\n\
  \  → RESULT: FAIL — moved back to [\U0001F4CB] — reason recorded in bug file\n```\n\
  \n### 4. Final Results Table\n\n```\nREVIEW RESULTS\n──────────────────────────────────────────\n\
  Task 014    [✅] PASS — all 6 acceptance criteria met\nTask 015    [❌] FAIL — DECISIONS.md\
  \ missing seed entries (criterion 1)\nTask 016    [✅] PASS — BACKPORT_REPORT.md\
  \ present and complete\nBUG-013     [✅] PASS — null guard confirmed at src/user.ts:142\n\
  BUG-007     [❌] FAIL — fix absent, race condition still present\n──────────────────────────────────────────\n\
  Total: 3 PASS / 2 FAIL  (Tasks: 2P/1F  |  Bugs: 1P/1F)\n```\n\n### 5. Session Summary\n\
  \n```markdown\n## Review Session Summary\n\n### Reviewed PASS → [✅]\n- Task #X:\
  \ {title} — {brief note}\n- BUG-NNN: {title} — {brief note}\n\n### Reviewed FAIL\
  \ → back to [\U0001F4CB]\n- Task #Y: {title} — {specific failure reason}\n- BUG-NNN:\
  \ {title} — {specific failure reason}\n\n### Skipped (Implemented This Session)\n\
  - Task #Z: left at [\U0001F50D] — cannot self-review\n- BUG-NNN: left at [\U0001F50D\
  ] — cannot self-review\n\n### \U0001F9E0 Auto-Learn Summary\n{N} new fact(s) appended\
  \ to `.gald3r/learned-facts.md` (or \"none / file not found\").\n\n### Follow-Up\
  \ Tasks Filed\n- T{id}: {title} — {why surfaced during review}\n(none surfaced —\
  \ or list all filed task IDs with titles. Named-but-not-filed follow-ups are a policy\
  \ violation.)\n\n### Recommended Next Steps\n- Re-implement failed tasks: {list}\n\
  - Re-fix failed bugs: {list}\n- Hand back to implementing agent if blocking\n```\n\
  \n## Behavioral Rules\n\n| Rule | Why |\n|------|-----|\n| Never implement anything\
  \ | This is read-only review |\n| Never mark `[✅]` for work you coded this session\
  \ | Defeats independence guarantee |\n| Document PASS/FAIL per criterion, not just\
  \ overall | Gives implementing agent actionable feedback |\n| Leave `[\U0001F50D\
  ]` items you can't review (no context) | Don't guess |\n| Be strict — partial implementations\
  \ fail | A task either meets criteria or it doesn't |\n\n\n### WPAC inbox Heartbeats\
  \ (Swarm / Long Runs)\n\nFor swarm mode or any run lasting more than 30 minutes,\
  \ the coordinator reruns the WPAC inbox check every 30 minutes and once more before\
  \ the final summary. If a conflict appears mid-run, pause new claims/spawns/reconciliation,\
  \ preserve worktrees and partial outputs, and require `@g-wpac-read` before continuing.\n\
  \n### Coordinator-Only Shared Writes\n\nIn `g-go-review --swarm`, reviewers are\
  \ evidence producers. They must not write shared ledgers or repository-wide generated\
  \ surfaces. Return:\n\n- PASS/FAIL payloads and criteria evidence.\n- Proposed Status\
  \ History rows.\n- Any bug/task follow-up requests (reviewer identifies; coordinator\
  \ MUST file them as real tasks).\n- Fix-forward patch bundles only when the user\
  \ explicitly authorized fix-forward review.\n\nThe coordinator alone performs `.gald3r`\
  \ status writes, `TASKS.md`/`BUGS.md` updates, changelog/docs updates, generated\
  \ prompt regeneration, parity sync, final staging, and review-result commit operations.\n\
  \n**Follow-Up Task Filing Gate (coordinator responsibility)**: After collecting\
  \ all reviewer follow-up requests, and before writing the final Review Session Summary,\
  \ the coordinator MUST call `g-skl-tasks CREATE TASK` for each follow-up item. Reference\
  \ actual task IDs (e.g. `T1110`) in the summary — NEVER slug-style names like `T1043-followup-*`.\
  \ Named-but-not-filed follow-ups are a policy violation.\n\n### Verification Verb\
  \ Gate (BUG-511 — MANDATORY before any review-result commit)\n\n**Before creating\
  \ the review-result commit, you MUST have already invoked the state-transition CLI\
  \ verb for EVERY item in this review batch:**\n\n- Tasks: `gald3r task verify <id>\
  \ --pass [--summary \"...\"]` (PASS) or `gald3r task verify <id> --fail --reason\
  \ \"...\"` (FAIL) — see step 3A(e).\n- Bugs: `gald3r bug resolve <id>` (PASS) or\
  \ `gald3r bug update <id> --status open --note \"FAIL: ...\"` (FAIL) — see step\
  \ 3B(d).\n\nIf you have not run the corresponding verb for every item in this batch,\
  \ **do that now, before committing**. Writing a Status History row, an Agent Notes\
  \ entry, or a commit message that *describes* a PASS/FAIL transition is not the\
  \ same as *performing* it — these CLI verbs are the only path that also writes the\
  \ SQLite DB row that `gald3r task ready` and other queue queries read from (g-rl-40).\
  \ Hand-editing the task/bug file `status:` field or the `TASKS.md`/`BUGS.md` indicator\
  \ directly leaves the DB row stuck at its prior status (e.g. `awaiting-verification`),\
  \ making the item invisible to future queue scans — silently, with no error — exactly\
  \ as BUG-511 documented (commit `799cf510` claimed a FAIL transition that no code\
  \ path actually performed; the task stayed `awaiting-verification` in the DB until\
  \ a human found it by hand).\n\n**A review-result commit with no corresponding verify\
  \ call for any item in the batch is a Review Result Commit Gate violation (g-rl-33),\
  \ not a lesser or partial compliance.** This applies identically in standalone and\
  \ coordinator-managed (`--swarm`) mode — in swarm mode, the coordinator's \"batch-update\
  \ TASKS.md/BUGS.md\" step (Step R7 below) means looping this verb once per item,\
  \ not hand-editing the index files.\n\n### Review-Result Commit\n\nAfter PASS or\
  \ FAIL status writes are complete, create a coordinator-owned review-result commit\
  \ by default. This applies whether all items PASS, all items FAIL, or the review\
  \ result is mixed. The commit is the audit point for the review verdict, not an\
  \ optional follow-up offer.\n\nRequired flow:\n1. Stage only review-owned paths\
  \ by explicit allowlist, such as the touched task/bug files, `.gald3r/TASKS.md`,\
  \ `.gald3r/BUGS.md`, review-owned docs/changelog updates, and regenerated review\
  \ prompt surfaces.\n2. Never use `git add .`; exclude `.gald3r-worktree.json`, terminal\
  \ transcripts, local logs, unrelated files, and other non-deliverable artifacts.\n\
  3. Commit with a message that names the reviewed task/bug IDs and whether the result\
  \ was PASS, FAIL, or mixed.\n4. Include the commit SHA in the final review summary.\n\
  \nAllowed reasons not to create the review-result commit are limited to: unresolved\
  \ conflicts, failed commit hooks, staged or untracked unrelated changes, detected\
  \ secrets, dirty generated outputs not owned by review, missing user permission\
  \ for destructive or out-of-scope changes, or repository state that prevents a safe\
  \ commit. If one of these blockers applies, state the blocker explicitly and leave\
  \ the review status writes uncommitted for human resolution.\n\n### Optional GitHub\
  \ PR-Close Hook (T1292)\n\n**Run AFTER the review-result commit — never before.**\
  \ This hook is triple-gated (same as T1291).\n\n**Triple-gate evaluation (must ALL\
  \ be true to invoke):**\n1. Read `.gald3r/.identity` → `project_type=software_development`\
  \ (else skip silently)\n2. Read `.gald3r/config/AGENT_CONFIG.md` → `github_integration:\
  \ enabled` (else skip silently)\n3. Read `.gald3r/config/AGENT_CONFIG.md` → `github_pr_hooks:\
  \ enabled` (else skip silently)\n\n**When all three gates pass:** invoke `g-pr-close\
  \ --task <id>` for each reviewed item.\n\n**PASS path:** PR is merged (default:\
  \ squash-merge via `gh pr merge --squash`). Append Status History row:\n```\n| {date}\
  \ | awaiting-verification | completed | {agent} | PR merged: {pr_url} |\n```\n\n\
  **FAIL path:** post a review-failure comment on the PR and leave it as Draft. Append\
  \ Status History row:\n```\n| {date} | awaiting-verification | pending | {agent}\
  \ | PR-close skipped (FAIL): failure comment posted on {pr_url} |\n```\n\n**Behavior:**\n\
  - A PR-close failure does NOT roll back the recorded PASS/FAIL verdict.\n- On error:\
  \ append a notice to the session summary so the user can retry manually.\n- In `--swarm`\
  \ mode: the coordinator runs this hook in the batch-write pass, after the review-result\
  \ commit.\n\n**Default state:** all three flags are `disabled` / absent → behavior\
  \ is byte-identical to pre-T1292.\n\n## Swarm Mode (`--swarm`)\n\nWhen `$ARGUMENTS`\
  \ includes `--swarm`, activate the **COORDINATOR PHASE** to parallelize review.\n\
  Review is read-only — partitioning is simpler than `g-go-code --swarm` (no subsystem\
  \ conflicts).\n\n### Coordinator Phase (runs FIRST when --swarm is present)\n\n\
  **Step R1: Collect review queue** — all `[\U0001F50D]` items plus expired/missing\
  \ `[\U0001F575️]` verifier claims (or filtered subset if task IDs specified in `$ARGUMENTS`),\
  \ excluding non-expired `[\U0001F575️]` verifier claims.\nIncludes both tasks (`TASKS.md`)\
  \ and bugs (`BUGS.md` + `bugs/*.md`). Label each item `T-NNN` or `BUG-NNN`. Expired\
  \ `[\U0001F575️]` claims may be reclaimed with a takeover Status History row.\n\n\
  **Step R2: Evaluate swarm eligibility**\n- If only 1 qualifying `[\U0001F50D]` item\
  \ → fallback to standard single-agent mode:\n  `[SWARM] Single item — running standard\
  \ mode`\n- If 0 qualifying items → exit with \"nothing to review\" message\n\n**Step\
  \ R3: Compute agent count** (same Smart Agent Count Formula as g-go-code)\n\n| Queue\
  \ size | Agents |\n|-----------|--------|\n| 1 | 1 (no swarm — fallback) |\n| 2–4\
  \ | 2 |\n| 5–9 | `ceil(count / 3)` (2–3) |\n| 10–14 | 4 |\n| 15+ | 5 (hard cap)\
  \ |\n\n**Step R4: Partition via round-robin**\n```\n1. Sort review_queue by priority\
  \ (Critical→Low)\n2. Buckets = [[] for _ in range(agent_count)]\n3. For i, item\
  \ in enumerate(review_queue):\n     buckets[i % agent_count].append(item)\n4. Output:\
  \ buckets = [[task_ids...], [task_ids...], ...]\n```\n\nNo implementation conflict\
  \ graph is needed because reviewers inspect isolated sources and return payloads;\
  \ the coordinator owns all final task/bug writes.\n\n**Step R5: Display partition\
  \ plan**\n```\n[SWARM] Review queue: {M} items → {N} reviewers\n  Reviewer 1: T-014\
  \ (high), BUG-013 (medium)\n  Reviewer 2: T-015 (high), T-018 (medium)\nSpawning\
  \ {N} reviewer agents...\n```\n\n**Step R6: Spawn reviewer agents**\n- Before spawning,\
  \ the coordinator claims every assigned item as `[\U0001F575️]` with `verification-in-progress`\
  \ metadata.\n- Establish one review isolation source per bucket:\n  - Create a `review-swarm`\
  \ worktree with the T170 helper when the bucket source is branch-addressable.\n\
  \  - Use snapshot mode when the bucket source is an uncommitted checkout/worktree.\n\
  \  - Pass `review_isolation_mode` plus the worktree or snapshot metadata to each\
  \ reviewer.\n- Use the Agent tool to spawn N agents, each receiving:\n  - The full\
  \ `g-go-review` prompt (this command file content)\n  - A filter argument for that\
  \ reviewer's slice — supports both task IDs and bug IDs:\n    `tasks 14 bugs BUG-013`\
  \ OR `tasks 15 18`\n  - Independence reminder: \"Do not review tasks or bugs you\
  \ implemented in this session.\"\n  - Base-commit verification reminder (BUG-620):\
  \ \"Before trusting any code in your worktree, run\n    Step 2b-i — `git rev-parse\
  \ HEAD` + `git merge-base --is-ancestor {review_source_commit}\n    HEAD` — and\
  \ self-correct on mismatch. This applies even if your worktree came from the Agent\n\
  \    tool's own `isolation: 'worktree'` param rather than the T170 helper; the provisioning\n\
  \    mechanism is not your concern, but verifying what it handed you is.\"\n- Each\
  \ bucket reviewer runs its own Step 2c for every item in its slice (`gald3r task\
  \ review-depth` / `gald3r bug review-depth`) before reviewing — this is per-item,\
  \ not per-bucket, since items in the same bucket can carry very different blast\
  \ radii.\n- **IMPORTANT**: Each reviewer produces a **result payload** (PASS/FAIL\
  \ per item + Status History rows + evidence + the computed `review_ladder_level`/`review_ladder_score`\
  \ per item). Reviewers do **not** write to `TASKS.md`, `BUGS.md`, primary-checkout\
  \ task/bug files, changelog/docs, generated prompts, parity outputs, or commits.\
  \ The coordinator owns all final writes.\n\n**Step R7: Collect, invoke verify verbs,\
  \ and merge summary**\n\nAfter all reviewers complete:\n1. Read each reviewer's\
  \ results (which tasks/bugs PASS, which FAIL), the per-item `review_ladder_level`/`review_ladder_score`,\
  \ and any supplementary Review Note / evidence text.\n2. **Invoke the verify verb\
  \ for every item — mandatory (Verification Verb Gate, above). This performs the\
  \ batch update; it is not a separate step from it. Every `--summary`/`--reason`/`--note`\
  \ value MUST be prefixed `[ladder:{level} score={score}]` (T539 auditability requirement,\
  \ same as standalone mode step 3A(e)):**\n   - Tasks: `gald3r task verify <id> --pass\
  \ --summary \"[ladder:{level} score={score}] ...\"` (PASS) or `gald3r task verify\
  \ <id> --fail --reason \"[ladder:{level} score={score}] {AC-NNN not met — reason}\"\
  ` (FAIL), once per item. The verb appends the Status History row and resyncs the\
  \ task file + `TASKS.md` automatically — do not hand-edit either. FAIL items whose\
  \ Status History already has ≥3 `FAIL:` rows also get the `[\U0001F6A8]` escalation\
  \ per step 3A(e)(3) (no CLI verb exists for that status yet — hand-edit is the only\
  \ path there).\n   - Bugs: `gald3r bug resolve <id>` (PASS — append `[ladder:{level}\
  \ score={score}]` to the bug's `## Notes` section separately, since `bug resolve`\
  \ has no free-text field) or `gald3r bug update <id> --status open --note \"[ladder:{level}\
  \ score={score}] FAIL: {reason}\"` (FAIL), once per item — resyncs the bug file\
  \ + `BUGS.md` automatically.\n   - For each FAIL task item, separately reset `implementation_sha:\
  \ ''` and `implementation_branch: ''` in frontmatter (T1380) — the verb does not\
  \ do this.\n   - Append any additional Review Note / evidence text to the task/bug\
  \ file as a supplementary edit — this augments, but never replaces, the verb call\
  \ above.\n3. Preserve review worktrees for failed or fix-forward items; otherwise\
  \ remove them only through the T170 helper after confirming `.gald3r-worktree.json`\
  \ ownership metadata:\n   ```powershell\n   gald3r worktree remove -TaskId {id_or_bucket}\
  \ -Role review-swarm -Apply\n   ```\n   Omit `-Owner` here too — the same T580/BUG-612\
  \ auto-resolution used at creation resolves to the\n   identical value throughout\
  \ this session (the underlying env var does not change mid-session), so\n   it matches\
  \ automatically. For a single-review worktree, use `-Role review` with the same\n\
  \   `-TaskId`. Pass `-Owner <value>` explicitly only if creation itself used an\
  \ explicit override.\n4. Create the review-result commit after PASS/FAIL verify-verb\
  \ writes (step 2), unless one of the narrow non-commit blockers from `Review-Result\
  \ Commit` applies.\n5. Write unified review summary with the review-result commit\
  \ SHA or the explicit non-commit blocker:\n\n```markdown\n## Swarm Review Session\
  \ Summary\n\n### Swarm Configuration\n- Reviewers spawned: N\n- Partition strategy:\
  \ round-robin by priority\n- Total items reviewed: M (tasks: X, bugs: Y)\n\n###\
  \ Reviewer Results\n| Reviewer | Items Assigned | PASS | FAIL | Skipped |\n|----------|---------------|------|------|---------|\n\
  | Reviewer-1 | T-014, BUG-013 | 2 | 0 | 0 |\n| Reviewer-2 | T-015, T-018 | 1 | 1\
  \ | 0 |\n\n### Reviewed PASS → [✅]\n- T-014: {title}\n- BUG-013: {title}\n\n###\
  \ Reviewed FAIL → back to [\U0001F4CB]\n- T-018: {title} — {failure reason}\n\n\
  ### Follow-Up Tasks Filed\n- T{id}: {title} — {why surfaced during review}\n(none\
  \ surfaced — or list all filed task IDs with titles. Named-but-not-filed follow-ups\
  \ are a policy violation.)\n\n### Recommended Next Steps\n- Re-implement failed\
  \ tasks: @g-go-code tasks {failed_ids}\n- Re-fix failed bugs: {bug_ids}\n```\n\n\
  ### Why Coordinator Owns Review Writes\n\nTwo agents updating different lines in\
  \ `TASKS.md` simultaneously causes merge conflicts.\nEach reviewer reports its results;\
  \ the coordinator performs **one atomic batch write** after all finish.\nCoordinator-owned\
  \ writes also keep snapshot reviews read-only and prevent review worktrees from\
  \ mutating the primary checkout accidentally.\n\n---\n\n## Usage Examples\n\n```\n\
  @g-go-review\n@g-go-review tasks 14 15 16\n@g-go-review tasks 14\n@g-go-review --swarm\n\
  @g-go-review --swarm tasks 14 15 16 17 18\n```\n\nReady to review.\n\n## Push offer\
  \ (final review summary only)\n\nAfter all verdicts are written and the review result\
  \ commit is made, include a single push offer in the final summary:\n\n```\nReview\
  \ complete. {N} commits on {branch} — {PASS_count} passed, {FAIL_count} failed.\n\
  Review the full diff and push when satisfied:\n  git log origin/{branch}..HEAD --oneline\n\
  \  git push origin {branch}\nWant me to push now?\n```\n\n**Rules:** Offer push\
  \ **once**, in the final review summary only. Do NOT offer push between individual\
  \ task reviews. If the user replies \"yes\": push immediately.\n\n\n## Structured\
  \ output (`--json` / `--toon`) — T1381 / T1382\n\nThis command supports machine-readable\
  \ output in addition to its default text/markdown:\n\n- `--json` → structured JSON\
  \ envelope via **g-skl-json-output** (`{ gald3r_version, generated_at, command,\
  \ schema, data }`). For scripting, CI gates, dashboards.\n- `--toon` → **g-skl-toon-output**\
  \ TOON: compact, lossless, LLM-friendly (tabular arrays state keys once; ≥20% smaller\
  \ than JSON). For agent handoff / context injection / vault ingestion.\n- `--md`\
  \ forces markdown. With no flag, AGENT_CONFIG `output_format` decides (default `markdown`,\
  \ unchanged).\n\nOutput is saved to `html_output_dir` (default `docs/`) as `YYYYMMDD_HHMMSS_<IDE>_<TOPIC>.json|.toon`\
  \ per g-rl-01.\n\n\n## Skill Proposal (`--propose-skill`) — T992\n\nOptional, **off\
  \ by default**. When `--propose-skill` is passed (or `propose_skills: true` in\n\
  `.gald3r/config/AGENT_CONFIG.md`), the reviewer runs **one extra evaluation step\
  \ after a PASS\nverdict and before the review-result commit** — it never blocks\
  \ or alters the verdict.\n\n**Step (post-PASS, pre-commit):**\n\n1. The reviewer\
  \ asks itself: *\"Did this implementation solve a problem type that is NOT covered\
  \ by\n   any existing skill in `.gald3r_sys/skills/`? Was there a novel, generalizable\
  \ multi-step\n   technique that would help a future agent on a similar task?\"*\
  \ Answer is **No** for routine work\n   — most tasks produce no proposal. This is\
  \ a deliberately high bar.\n2. **If yes**, draft a SKILL.md into **`.gald3r/proposed_skills/{task_id}_{slug}_draft.md`**\n\
  \   (provenance in the filename) using this shape:\n\n   ```markdown\n   ---\n \
  \  name: {proposed-slug}\n   description: <one-line trigger summary>\n   status:\
  \ proposed            # NOT active until promoted\n   proposed_from_task: {task_id}\n\
  \   proposed_date: YYYY-MM-DD\n   ---\n   # {Skill Name}\n   ## When to use\n  \
  \ - <trigger phrase 1>\n   - <trigger phrase 2>\n   ## What it does\n   <1-2 sentence\
  \ summary of the reusable pattern>\n   ## Steps\n   1. <generalized step>  2. ...\n\
  \   ## Example\n   <minimal example drawn from the implementation, redacted of project\
  \ specifics>\n   ```\n\n3. Append an **IDEA_BOARD.md** entry (via `g-skl-ideas CAPTURE`)\
  \ linking the draft:\n   `IDEA-AUTOSKILL-{task_id}: proposed skill '{slug}' — see\
  \ .gald3r/proposed_skills/{task_id}_{slug}_draft.md`.\n4. Note the proposal in the\
  \ review summary (one line) and the task `## Status History`.\n\n**Hard gate — human\
  \ approval required for promotion.** A draft in `proposed_skills/` is **never**\n\
  auto-promoted to `.gald3r_sys/skills/` (and therefore never synced to `.cursor/`/`.claude/`).\
  \ Promotion\nis a separate, human-invoked action via **`@g-skill-review`** (see\
  \ that command), which routes the\npolished draft through the skill-creator/writing-skills\
  \ flow and then a normal parity sync. The\nreviewer's job ends at writing the draft\
  \ + the IDEA_BOARD link.\n\n**Why post-PASS only:** a failed task has no validated\
  \ pattern to generalize. Proposals come only\nfrom work that actually passed verification."
prompt: Run the gald3r `g-go-review` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-go-review, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
