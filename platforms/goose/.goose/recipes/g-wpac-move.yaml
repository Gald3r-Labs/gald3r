version: 1.0.0
title: g-wpac-move
description: 'Transfer files or folders to another project in the topology: $ARGUMENTS'
instructions: "Transfer files or folders to another project in the topology: $ARGUMENTS\n\
  \n## What This Command Does\n\nSafely moves files or entire subsystems from this\
  \ project to a parent, child, or sibling project. Includes provenance tracking,\
  \ safety gates, vault log entries in both projects, and forwarding stubs. Uses `g-skl-wpac-move`.\n\
  \n## Workflow\n\n### 1. Pre-flight Checks\n- Source path exists inside this project\n\
  - Destination project is in topology (`link_topology.md`)\n- No open tasks reference\
  \ source files\n\n### 2. Preview\n```\nMOVE PREVIEW\n  From: {this_project}/{source_path}\n\
  \  To:   {dest_project}/{dest_path}\n  Type: {file | directory | N files}\n  Why:\
  \  {reason}\n\nThis will COPY files to destination (source kept until you confirm\
  \ delete).\nProceed? [yes / no / change destination]\n```\n\n### 3. Copy to Destination\n\
  ```powershell\nCopy-Item -Path {source} -Destination {dest} -Recurse -Force\n```\n\
  \n### 4. Log Provenance in Both Projects\n- Source: append to `.gald3r/vault/log.md`\n\
  - Destination: append to `{dest}/.gald3r/vault/log.md`\n\n### 5. Forwarding Stub\
  \ (optional)\nCreate a stub file at source noting the new location.\n\n### 6. Delete\
  \ Source (separate confirmation)\nOnly deletes if you explicitly say \"yes, delete\"\
  .\n\n### 7. Update References (optional)\nSearch and update `SUBSYSTEMS.md`, `tasks/*.md`,\
  \ `AGENTS.md`.\n\n## Usage Examples\n\n**Migrate a subsystem:**\n```\n@g-wpac-move\
  \ <ECOSYSTEM_ROOT>/<template_full>/.cursor/skills/g-skl-websocket-sync → example_mcp\n\
  ```\n\n**Promote a skill to canonical template:**\n```\n@g-wpac-move .cursor/skills/g-skl-new-thing\
  \ → <template_full>\n```\n\n**Move vault research:**\n```\n@g-wpac-move .gald3r/vault/research/topic.md\
  \ → example_vault\n```\n\n## Delegates To\n`g-skl-wpac-move`"
prompt: Run the gald3r `g-wpac-move` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-wpac-move, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
