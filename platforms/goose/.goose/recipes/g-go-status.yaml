version: 1.0.0
title: g-go-status
description: 'Show whether an active g-go-go run is ALIVE, IDLE-WAIT, or STALLED:
  $ARGUMENTS'
instructions: "Show whether an active g-go-go run is ALIVE, IDLE-WAIT, or STALLED:\
  \ $ARGUMENTS\n\n## Purpose (T1585)\n\n`g-go-status` is a **one-shot health indicator**\
  \ for a `@g-go-go` autopilot run. When the\nconductor runs (detached or in-session)\
  \ there is no glanceable signal that it is alive and\nmaking progress — the launcher\
  \ session may show a red \"Stop hook error\" (the BUG-107\nkeep-alive, which *looks*\
  \ like a failure), so a healthy run is easy to mistake for a wedged\none. This command\
  \ collapses the manual `git log` + PID-probing dance into a single verdict you\n\
  can read in seconds.\n\nIt is strictly **READ-ONLY**: it reads the run-state marker\
  \ and the last git commit, and never\nwrites `.gald3r/` state, never touches the\
  \ marker, and never commits.\n\n## Usage\n\n```\n@g-go-status                  \
  \    # status of the run rooted at the nearest .gald3r\n@g-go-status --json    \
  \           # machine-readable (for scripts / CI gates / dashboards)\n```\n\nRun\
  \ the reader directly (absorbed into the engine as a `go` sibling verb, T285 --\
  \ no\nloose script, no Python invocation required):\n\n```bash\ngald3r go-status\n\
  gald3r go-status --json\ngald3r go-status --project-root <dir>\n```\n\n## What it\
  \ reports\n\n- **VERDICT** — `ALIVE` / `IDLE-WAIT` / `STALLED` (plus `STOPPED`,\
  \ `INACTIVE`, `NO-ACTIVE-RUN`)\n- `active`, `iter`, `budget_remaining`, `mode`,\
  \ `run_scope`, `platform`, `session_id`\n- **Conductor process** — alive (if a PID\
  \ is recorded/derivable), `in-session` (no detached\n  process to probe), or `unknown`\
  \ — best-effort, never hard-depends on a PID\n- **Marker `updated_at`** + age, and\
  \ the **last git commit** (time + subject) + age\n- **Seconds since last progress**\
  \ — the MOST RECENT of the marker stamp and the last commit\n- The last `completed_iterations[]`\
  \ summary, and `authorized_hard_stop` if a run stopped\n\n## Verdict logic (thresholds\
  \ are constants in the script)\n\nProgress age = `min(marker_age, last_commit_age)`\
  \ — the most recent of two independent\nsignals. A long single iteration that is\
  \ still committing work stays ALIVE even while the\nmarker sits between per-iteration\
  \ stamps; a frozen marker with no commits reads as STALLED.\n\n| Verdict | Condition\
  \ | Meaning |\n|---------|-----------|---------|\n| **ALIVE** | progress within\
  \ `ALIVE_THRESHOLD_SEC` (default 10m) | making progress |\n| **IDLE-WAIT** | progress\
  \ between 10m and `STALLED_THRESHOLD_SEC` (default 55m) | healthy but waiting on\
  \ the model — API I/O wait (0% CPU but progressing), **not** a wedge |\n| **STALLED**\
  \ | no progress > 55m and no recent commit | likely wedged — check the conductor\
  \ |\n| **STOPPED** | marker has `authorized_hard_stop` | run halted with a recorded\
  \ reason |\n| **INACTIVE** | marker present but `active:false` | the run has finished\
  \ |\n| **NO-ACTIVE-RUN** | no marker found | nothing running (graceful) |\n\nThe\
  \ default thresholds are tuned to the conductor's behavior: the per-coordinator\
  \ hang timeout\ndefaults to 50 min (BUG-214/T336, raised from 25 min — a full Phase\
  \ 1 + Phase 2 iteration at\nhard-cap N=5 measured 22m49s even after contracting\
  \ N down to fit the old 25-min budget) and a\nsingle iteration legitimately runs\
  \ many minutes while waiting on the model, so the 10–55 min band\nis the normal\
  \ \"long iteration\" zone (IDLE-WAIT), and only past ~55 min with no new commits\
  \ is it\ncalled STALLED. Edit `ALIVE_THRESHOLD_SEC` / `STALLED_THRESHOLD_SEC` in\n\
  `gald3r_core.coordination.autopilot.status` (the engine module backing this verb,\
  \ T285) to\nretune.\n\nExit code: `0` for every verdict except **STALLED**, which\
  \ exits `1` so a watchdog or CI gate\ncan trigger on a likely wedge.\n\n## Follow-up\
  \ — `--watch` (T1585 option 2, NOT in this command)\n\nA refreshing heartbeat view\
  \ (`--watch`, re-rendering this status every N seconds so the user\ncan leave it\
  \ open and see it tick) is the documented next step. It is intentionally **not**\n\
  implemented here — this command is the bounded one-shot indicator (option 1). Track\
  \ the watch\nmode as a follow-up.\n\n## Notes\n\n- The reader depends on the marker\
  \ being refreshed per-iteration (reliable after the\n  BUG-181/182 conductor fixes).\
  \ If the marker is stale but commits are recent, the commit\n  signal keeps the\
  \ verdict honest.\n- PID liveness is best-effort: it uses a recorded `conductor_pid`/`pid`\
  \ if present, otherwise\n  reports `in-session` (when the marker mode indicates\
  \ an in-session coordinator) or `unknown`.\n  It never fails the verdict on a missing\
  \ PID."
prompt: Run the gald3r `g-go-status` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-go-status, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
