version: 1.0.0
title: g-kamikaze
description: g-kamikaze
instructions: '# g-kamikaze


  Alias for `@g-mission`. All-in autonomous loop until a verifiable condition is met:
  $ARGUMENTS


  See `@g-mission` for full documentation.


  ## Usage


  ```

  @g-kamikaze <condition>

  @g-kamikaze <condition> --budget <N>

  @g-kamikaze status

  @g-kamikaze clear

  @g-kamikaze <condition> --until-empty

  @g-kamikaze --from-task T{id}

  ```


  This command is identical to `@g-mission` in every way. The name evokes total commitment
  — burning all available turns toward the stated condition with no retreat.


  > Note: `@g-kamikaze` does NOT reduce safety checks or skip verification gates.
  The name is flavor only. All gald3r safety invariants apply.


  **Delegates to**: `@g-mission $ARGUMENTS`'
prompt: Run the gald3r `g-kamikaze` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-kamikaze, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
