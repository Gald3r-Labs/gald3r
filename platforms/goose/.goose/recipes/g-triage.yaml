version: 1.0.0
title: g-triage
description: g-triage — External Backlog Intake
instructions: "# g-triage — External Backlog Intake\n\nParse unstructured external\
  \ input (emails, Slack dumps, meeting notes, pasted URLs) and route each item to\
  \ the correct gald3r destination.\n\n> **Human-gated**: generates a triage table\
  \ for review BEFORE any `.gald3r/` writes.\n\n## Usage\n\n```\n@g-triage \"paste\
  \ your email/Slack/notes here\"\n@g-triage --file path/to/notes.txt\n@g-triage https://github.com/org/repo/issues/42\n\
  @g-triage --clipboard     # read from clipboard contents\n```\n\n## What It Does\n\
  \n### Phase 1 — Parse & Classify (no writes)\n\n1. Accept input as: inline text\
  \ block, `--file` path, URL, or `--clipboard`\n2. Split input into individual items:\n\
  \   - Bullet list items (`-`, `*`, `•`, numbered)\n   - Paragraph breaks (double\
  \ newline = new item)\n   - Quoted Slack/email threads (parse by sender line if\
  \ detectable)\n3. Classify each item into one of four categories:\n\n| Category\
  \ | Signals | Route |\n|----------|---------|-------|\n| `IDEA` | \"would be nice\"\
  , \"what if\", \"consider\", \"we should eventually\", feature requests | → `IDEA_BOARD.md`\
  \ |\n| `BUG` | \"broken\", \"crash\", \"error\", \"doesn't work\", \"regression\"\
  , \"wrong output\" | → `BUGS.md` stub |\n| `TASK` | \"please implement\", \"we need\"\
  , \"deadline\", \"by Friday\", \"action item\", \"assigned\" | → task spec stub\
  \ |\n| `INFO` | status updates, FYIs, meeting recaps with no action | → no write\
  \ (logged only) |\n\n4. Assign a confidence score (`high` / `medium` / `low`) to\
  \ each classification\n5. For `IDEA` items: propose a one-line IDEA_BOARD summary\n\
  6. For `BUG` items: propose severity (`critical` / `high` / `medium` / `low`) based\
  \ on language signals\n7. For `TASK` items: extract title + any deadline signals\n\
  \n### Phase 2 — Triage Table Output (no writes yet)\n\nDisplay a triage table:\n\
  \n```\n## Triage Results — N items found\n\n| # | Category | Confidence | Summary\
  \ | Proposed Destination |\n|---|----------|------------|---------|---------------------|\n\
  | 1 | IDEA     | high       | Dark mode toggle for dashboard | IDEA_BOARD — Medium\
  \ priority |\n| 2 | BUG      | high       | Login fails on Safari iOS 17 | BUGS.md\
  \ — Severity: High |\n| 3 | TASK     | medium     | Update pricing page before Monday\
  \ | Task spec — Priority: High |\n| 4 | INFO     | high       | Sprint review scheduled\
  \ Thu 3pm | No write (info only) |\n\n> **Review the table above. Edit routing if\
  \ needed, then choose:**\n> - `approve all` — write all non-INFO items as proposed\n\
  > - `approve N,M` — write only items N and M (e.g., `approve 1,3`)\n> - `reclassify\
  \ N as IDEA` — override classification for item N\n> - `discard` — cancel all writes\n\
  ```\n\n### Phase 3 — Human Gate (HARD STOP)\n\n**DO NOT write to `.gald3r/` until\
  \ the user responds.** Wait for explicit approval.\n\nAccepted responses:\n- `approve\
  \ all` → write all non-INFO items\n- `approve 1,3` or `approve 2` → write only specified\
  \ items\n- `reclassify 2 as TASK` → change item 2's category, re-display table\n\
  - `discard` or `cancel` → abort with no writes\n\n### Phase 4 — Writes (after approval)\n\
  \nFor each approved item, route to the appropriate skill:\n\n**IDEA items** → activate\
  \ `g-skl-ideas` CAPTURE operation:\n- Title: extracted summary\n- Priority: derived\
  \ from signals (urgent language → high, vague → low)\n- Source: `triage` (+ original\
  \ text excerpt as note)\n\n**BUG items** → activate `g-skl-bugs` REPORT operation:\n\
  - Title: extracted summary\n- Severity: derived classification\n- Note: \"Triaged\
  \ from external input — confirm details before assigning\"\n- Source excerpt in\
  \ bug file\n\n**TASK items** → activate `g-skl-tasks` CREATE TASK operation:\n-\
  \ Title: extracted title\n- Type: `feature` (default) or `bug_fix` if bug signals\
  \ present\n- Priority: derived from deadline signals\n- Note: \"Triaged from external\
  \ input — [source excerpt]\"\n\n### Phase 5 — Summary\n\nAfter writes complete,\
  \ output:\n```\n## Triage Complete — N items written\n\n✅ IDEA-NNN: Dark mode toggle\
  \ for dashboard\n✅ BUG-NNN: Login fails on Safari iOS 17 (Severity: High)\n✅ Task\
  \ NNN: Update pricing page (Priority: High)\nℹ️  1 INFO item logged (no write)\n\
  ```\n\n## Classification Heuristics\n\n**Urgency signals** (elevate priority):\n\
  - \"ASAP\", \"urgent\", \"by EOD\", \"critical\", \"blocking\", \"P0\"\n- Specific\
  \ dates within 7 days\n- Multiple exclamation points\n\n**Bug signals**:\n- Stack\
  \ traces, error codes, HTTP status codes\n- \"expected X but got Y\"\n- \"worked\
  \ before\", \"regression\", \"broke after\"\n\n**Idea signals**:\n- Conditional\
  \ phrasing: \"if we had...\", \"it would be great if...\"\n- Competitor comparisons:\
  \ \"like Notion does it\"\n- \"Nice to have\", \"future\", \"backlog\", \"someday\"\
  \n\n**Task signals**:\n- Assignee names, \"please\", \"can you\", \"we need\"\n\
  - Hard deadlines with specific dates\n- \"action item\", \"follow up\", \"I'll need\"\
  \n\n## Tips\n\n- Paste a full email thread — the command extracts the actionable\
  \ items\n- Paste a Slack export — items are split by message\n- For meeting notes,\
  \ paste the raw transcript; INFO lines are skipped cleanly\n- Use `--file` for long\
  \ documents (PDFs converted to text, DOCX exports)\n- The triage table is editable\
  \ before approval — reclassify freely\n\n## Related Commands\n\n- `@g-idea-capture`\
  \ — direct single-idea capture (no triage step)\n- `@g-task-add` — direct task creation\
  \ (no triage step)\n- `@g-bug-add` — direct bug report (no triage step)\n- `@g-propose`\
  \ — full proposal generation from a single concept"
prompt: Run the gald3r `g-triage` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-triage, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
