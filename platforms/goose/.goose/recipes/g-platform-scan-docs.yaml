version: 1.0.0
title: g-platform-scan-docs
description: 'Scan a platform''s official docs for breaking changes: $ARGUMENTS'
instructions: "Scan a platform's official docs for breaking changes: $ARGUMENTS\n\n\
  ## What This Command Does\n\nCrawls the official documentation of the named platform\
  \ and diffs against the last crawl,\nsurfacing sections that changed since the previous\
  \ scan so they can be reviewed for gald3r\ncompatibility impact. Delegates to `g-skl-platform-monitor`\
  \ operation `SCAN_DOCS`, then drives\nthe T514/T515 freshness consumers end-to-end:\
  \ crawl-export (T646) → `gald3r platform refresh` proposal\n→ human-accept → `gald3r\
  \ platform status --apply` regen.\n\n## Delegates To\n\n- Skill: `g-skl-platform-monitor`\
  \ → `SCAN_DOCS`\n- Crawl: `g-skl-crawl` / `g-skl-recon-docs` on the platform's `docs_url:`\n\
  - Exporter: `scripts/platform_crawl.py` (T646 — host-side crawl snapshot + ledger)\n\
  - Consumers: `gald3r platform refresh` (T514) and `gald3r platform status` (T515)\n\
  - Agent: `g-agnt-platformer`\n\n## Workflow\n\n1. Activate `g-agnt-platformer`.\n\
  2. Read `docs_url:` from `g-skl-platform-<platform>/SKILL.md` frontmatter.\n3. Run\
  \ `g-skl-platform-monitor SCAN_DOCS <platform>` — crawls the URL, stores results\
  \ under\n   `{vault_location}/research/platforms/<platform>/`, diffs against the\
  \ prior snapshot.\n4. **Export the crawl snapshot (T646).** Produce the host-side\
  \ JSON inputs the freshness\n   consumers read:\n   ```\n   python scripts/platform_crawl.py\
  \ --source db --db-url \"$GALD3R_DATABASE_URL\" \\\n       --platform <platform>\
  \ --crawl-snapshot <platform>_docs.json --crawl-ledger ledger.json\n   ```\n   No\
  \ live DB available (or offline smoke test)? Use `--source sample` instead — it\
  \ writes a\n   small, clearly-labeled fixture snapshot so the rest of the pipeline\
  \ can still be exercised.\n5. **Run the spec-refresh proposal (T514, GAP A) — dry-run,\
  \ never blind-applied.**\n   ```\n   gald3r platform refresh --platform <platform>\
  \ \\\n       --crawl-snapshot <platform>_docs.json --crawl-ledger ledger.json\n\
  \   ```\n   Surface the printed proposal for **human review**: the `*.proposed`\
  \ draft, the\n   \"what changed and why\" summary, and any `[needs-review]` capability-cell\
  \ disagreements\n   between the crawled docs and the curated `PLATFORM_SPEC.md`.\
  \ This step is dry-run by\n   default and NEVER auto-flips a curated cell — disagreements\
  \ are judgment calls for a human,\n   not the model (model-for-judgment-only; g-rl-38).\n\
  6. **STOP for human accept.** Do not proceed to step 7 until the operator has reviewed\
  \ the\n   proposal and explicitly accepted it (editing `PLATFORM_SPEC.md` capability\
  \ cells by hand\n   where flagged `[needs-review]`, if warranted).\n7. **On accept,\
  \ land the mechanical stamp and regenerate STATUS.**\n   ```\n   gald3r platform\
  \ refresh --platform <platform> \\\n       --crawl-snapshot <platform>_docs.json\
  \ --crawl-ledger ledger.json --apply\n   gald3r platform status --apply --crawl-ledger\
  \ ledger.json\n   ```\n   `--apply` on `gald3r platform refresh` lands ONLY the\
  \ mechanical `last_doc_scan` stamp — capability\n   cells are never auto-applied,\
  \ matching step 5's human-review gate.\n8. **Report the matrix cross-check.** Run\n\
  \   `check_platform_status.py --generate-matrix` and count the `WARN: Matrix says\
  \ … but STATUS\n   says …` lines it prints — this is the \"matrix cross-check warning\
  \ count\" the operator should\n   see. Expect **0** after a clean accept + regen\
  \ (T513's whole point: STATUS and the matrix can\n   never legitimately disagree\
  \ once both are regenerated from the same specs).\n9. Updating `last_doc_scan` in\
  \ `.gald3r/PLATFORM_STATUS.md` is handled by step 7's regen — no\n   manual edit\
  \ needed.\n\n## Usage Examples\n\n```\n@g-platform-scan-docs antigravity     # high-priority:\
  \ relaunched with breaking changes\n@g-platform-scan-docs cursor\n```\n\n## Guardrails\n\
  \n- **Human-accept gate is mandatory.** Step 6 is a hard stop — the command never\
  \ runs step 7\n  without an explicit human accept. The model classifies/summarizes\
  \ the diff (judgment); it\n  never decides the merge (that's code + human, per g-rl-38\
  \ \"Model for Judgment Only\").\n- **Never blind-writes a curated cell.** `gald3r\
  \ platform refresh --apply` only ever stamps\n  `last_doc_scan`; `[needs-review]`\
  \ capability disagreements are surfaced, never auto-resolved.\n- Both `.py` canonicals\
  \ are dry-run by default; `--apply` is required to write anything.\n\n> **Status\
  \ (T1460 → T647):** end-to-end wiring complete. Per-platform diff heuristics for\n\
  > `SCAN_DOCS` step 3 continue to be completed by T1461–T1483."
prompt: Run the gald3r `g-platform-scan-docs` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-platform-scan-docs, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
