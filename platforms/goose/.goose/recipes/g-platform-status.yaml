version: 1.0.0
title: g-platform-status
description: 'Show the cross-platform capability status index: $ARGUMENTS'
instructions: "Show the cross-platform capability status index: $ARGUMENTS\n\n## What\
  \ This Command Does\n\nDisplays a concise read-only summary of `.gald3r/PLATFORM_STATUS.md`\
  \ — the honest capability\nindex across every roster platform — and the rollup counts\
  \ (N healthy, M need attention, K rework,\nU unknown). Report-only; does not modify\
  \ any file.\n\n## Delegates To\n\n- Skill: `g-skl-platform-monitor` (reads `PLATFORM_STATUS.md`\
  \ / `PLATFORM_CAPABILITY_MATRIX.md`)\n- Agent: `g-agnt-platformer`\n\n## Workflow\n\
  \n1. Activate `g-agnt-platformer`.\n2. Read `.gald3r/PLATFORM_STATUS.md`.\n3. Print\
  \ the summary line and any platforms not at `✅`.\n4. To regenerate (not just read)\
  \ the index, use `@g-platform-check` or\n   `g-skl-platform-monitor GENERATE_MATRIX`.\n\
  \n## Safety Boundaries\n\n- This command is report-only — it never writes status\
  \ files.\n- Honest status only: `❓` platforms stay `❓` until a per-platform task\
  \ verifies them.\n\n## Usage Examples\n\n```\n@g-platform-status\n```\n\n> **Status\
  \ (T1460):** scaffolding. Reads the status stubs created by T1460; rows are filled\
  \ by\n> T1461–T1483."
prompt: Run the gald3r `g-platform-status` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-platform-status, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
