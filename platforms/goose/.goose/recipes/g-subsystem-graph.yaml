version: 1.0.0
title: g-subsystem-graph
description: Activate `g-skl-subsystem-graph` to generate or refresh `.gald3r/SUBSYSTEM_GRAPH.md`.
instructions: 'Activate `g-skl-subsystem-graph` to generate or refresh `.gald3r/SUBSYSTEM_GRAPH.md`.


  Reads all `.gald3r/subsystems/` files, maps dependency edges between subsystems,
  performs layer analysis (root/core/mid-tier/leaf/isolated), detects circular dependencies,
  and writes a Mermaid diagram with status tables to `.gald3r/SUBSYSTEM_GRAPH.md`.


  Alias: `@g-dependency-graph --subsystems`


  Use when:

  - You want to see how subsystems depend on each other

  - You''ve added or changed subsystem dependencies/dependents

  - You want to identify root (no deps) vs leaf (nothing depends on them) subsystems

  - You want to check for circular subsystem dependencies


  ## L1 → L2 hierarchy view (T1458)


  When subsystem spec files carry `parent_system:` (i.e. `PRODUCT_SYSTEMS.md` exists
  and tagging

  has run), also render the **L1 product system → subsystem** containment hierarchy
  in Mermaid,

  one edge per subsystem grouped under its `parent_system:`:


  ```

  LOGGING_SYSTEM --> logging-hooks

  LOGGING_SYSTEM --> claude-chat-logger

  MEMORY_AND_KNOWLEDGE --> agent-memory

  MEMORY_AND_KNOWLEDGE --> vault-knowledge-store

  ```


  The flat dependency graph (above) is the **fallback** when no `parent_system:` data
  exists.

  This containment view is orthogonal to `dependencies:` edges — it shows ownership
  grouping,

  not runtime coupling.'
prompt: Run the gald3r `g-subsystem-graph` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-subsystem-graph, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
