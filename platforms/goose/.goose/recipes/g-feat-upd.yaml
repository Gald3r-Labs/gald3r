version: 1.0.0
title: g-feat-upd
description: Update a staging feature doc. Activates **g-skl-features** → UPDATE FEATURE
  operation.
instructions: 'Update a staging feature doc. Activates **g-skl-features** → UPDATE
  FEATURE operation.


  ```

  @g-feat-upd feat-NNN status specced

  @g-feat-upd feat-NNN min-tier full

  @g-feat-upd feat-NNN goal G-02

  @g-feat-upd feat-NNN add-subsystem voice-speech-system

  ```


  Updates feature file YAML fields and FEATURES.md index row.'
prompt: Run the gald3r `g-feat-upd` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-feat-upd, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
