version: 1.0.0
title: g-skill-pack-del
description: g-skill-pack-del — Remove a skill pack or individual skill
instructions: "# g-skill-pack-del — Remove a skill pack or individual skill\n\nRemove\
  \ all skills from a pack, or a single named skill, from all active IDE folders.\n\
  \n## Usage\n\n```\ng-skill-pack-del <pack-name>                  Remove all skills\
  \ in the pack\ng-skill-pack-del <pack-name> <skill-name>     Remove one skill from\
  \ the pack\ng-skill-pack-del <pack-name> --force          Remove including _evolved\
  \ variants\n```\n\n## Steps\n\n1. Validate `<pack-name>` exists in `.gald3r_sys/skill_packs/`\n\
  2. Run uninstall:\n   ```powershell\n   .gald3r_sys/skill_packs/<pack-name>/install.py\
  \ --uninstall --project-root . [--skill <skill-name>]\n   ```\n3. The installer\
  \ skips `_evolved` skill folders by default (warns with: \"⚠ Skipping <name>_evolved\
  \ — use --force to remove\")\n4. Update `.gald3r/.identity` `installed_skill_packs:`\
  \ block — remove skill or whole pack entry\n5. Confirm what was removed\n\n## Notes\n\
  - `_evolved` skills (user-customized) are protected from accidental deletion\n-\
  \ Use `--force` only when you explicitly want to remove a customized skill\n- gald3r\
  \ core skills (in `.claude/skills/`) are never touched by this command"
prompt: Run the gald3r `g-skill-pack-del` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-skill-pack-del, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
