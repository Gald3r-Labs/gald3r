version: 1.0.0
title: g-mission
description: g-mission
instructions: "# g-mission\n\nRun an autonomous goal-locked loop until a verifiable\
  \ completion condition is satisfied: $ARGUMENTS\n\n\n## Usage\n\n```\n@g-mission\
  \ <condition>\n@g-mission <condition> --budget <N>\n@g-mission <condition> --until-empty\n\
  @g-mission <condition> --until-empty --budget <N>\n@g-mission status\n@g-mission\
  \ clear\n@g-mission --from-task T{id}\n```\n\n### Overnight / extended AFK runs\
  \ (IMPORTANT — read before going AFK)\n\n**Do NOT type `@g-mission resume` manually\
  \ for extended runs.** That requires you to be present each time. Instead, use the\
  \ wrapper script from a PowerShell terminal — it handles all auto-resumes for you:\n\
  \n```powershell\n# Run this in a PowerShell terminal before going AFK / to bed\n\
  # It loops automatically — you do not need to return until it stops itself\n.\\\
  scripts\\mission-overnight.ps1\n```\n\nThe script calls `claude -p \"@g-mission\
  \ resume --until-empty --budget 999\"` in a loop. It parses `EXIT_REASON:` from\
  \ each session to decide auto-resume vs real stop. You do nothing until the script\
  \ exits or you come back.\n\nFor unattended runs (overnight, meetings, AFK), use\
  \ the wrapper script instead of typing `@g-mission resume` between sessions:\n\n\
  ```powershell\n# Resume an existing mission — runs until QUEUE_EMPTY, CONDITION_MET,\
  \ or a real blocker\n.\\scripts\\mission-overnight.ps1\n\n# Start a new mission\
  \ and drain all ai_safe tasks overnight\n.\\scripts\\mission-overnight.ps1 -Condition\
  \ \"drain all ai_safe tasks\"\n\n# Use a specific model\n.\\scripts\\mission-overnight.ps1\
  \ -ClaudeArgs \"--model claude-opus-4-7\"\n```\n\nThe script loops the `claude`\
  \ CLI invocation automatically:\n- `CONTEXT_GATE` and `BUDGET_EXHAUSTED` → **transparent\
  \ auto-resume** (no human input, 5-second gap between sessions)\n- `QUEUE_EMPTY`,\
  \ `CONDITION_MET` → loop ends (success)\n- Any blocking code (`AI_SAFE_BLOCKED`,\
  \ `BLAST_RADIUS_HIGH`, `WPAC_CONFLICT`, etc.) → loop ends, human review required\n\
  \nA 12-hour overnight run at 20-30 min per session = up to 36 sessions × 3-10 tasks\
  \ = 100-360 tasks while you sleep.\n\n**Why sessions exist at all:** The agent's\
  \ context window has a hard ceiling. Continuing mid-task once that ceiling is near\
  \ would risk memory loss and partial work. The session boundary is triggered by\
  \ a **deterministic turn-budget proxy** (`turns_consumed >= ceil(turn_budget * 0.75)`),\
  \ NOT by a self-reported context-fill percentage — that sensor is unreliable (BUG-107,\
  \ fixed the same way in `g-go-go.md` under T1547). The checkpoint commits everything\
  \ cleanly, then the wrapper relaunches immediately. Context resets are transparent\
  \ in overnight mode.\n\n**Equivalent to Claude Code's `/goal`:** `scripts/mission-overnight.ps1`\
  \ is our implementation of the same pattern Claude Code uses natively — a post-session\
  \ evaluator that fires automatically without user prompts.\n\n## What it does\n\n\
  `g-mission` is gald3r's autonomous completion loop. You state a verifiable end condition;\
  \ the agent works toward it across as many `g-go` iterations as needed. After every\
  \ iteration a lightweight evaluator checks whether the condition holds. If not,\
  \ the loop continues. If yes, the mission is complete.\n\nThis is distinct from\
  \ `@g-goal` (which sets a goal that `g-go` reads but does not loop autonomously)\
  \ and from `@g-go-go` (which runs until tasks are exhausted). `g-mission` runs until\
  \ YOUR stated condition is provably true — the stopping criterion is yours, not\
  \ the task queue.\n\n### `--until-empty` mode\n\nWhen `--until-empty` is passed,\
  \ the mission does **not** stop when the stated condition is first achieved. Instead:\n\
  \n1. The stated condition becomes a **gate** — it must be met before the second\
  \ phase begins.\n2. Once the gate passes, the mission automatically transitions\
  \ to `@g-go-go` mode and continues working through all remaining `ai_safe: true`\
  \ tasks in the queue.\n3. The mission ends only when **both** the condition is met\
  \ **and** the `ai_safe` queue is empty (or budget is exhausted).\n4. The turn budget\
  \ applies across both phases combined.\n\nThis is the closest analog to `/goal`\
  \ on other platforms — state the primary objective, then let the agent clear the\
  \ surrounding backlog without stopping.\n\n```\n# Example: verify CLI works, then\
  \ clear the rest of the safe backlog\n@g-mission \"example_agent CLI exits 0 with\
  \ ollama\" --until-empty --budget 60\n```\n\nWrite `mode: until-empty` in `ACTIVE_MISSION.md`\
  \ when this flag is active so the evaluator knows to switch phases rather than terminate\
  \ on first success.\n\n#### ⛔ CRITICAL — `--until-empty` converts soft-pauses to\
  \ skips\n\n**In `--until-empty` mode, the following items that would normally pause\
  \ a standard mission become SKIPS instead.** The agent logs each skip to `temp_scripts/_deferred_questions.md`\
  \ and immediately moves on to the next task. They do NOT pause the loop. They do\
  \ NOT trigger a summary. They do NOT end the session early.\n\n| Normally pauses\
  \ | `--until-empty` behavior |\n|---|---|\n| `blast_radius: high` | **SKIP** — log\
  \ with reason, continue |\n| Task scope exceeds one session | **SPLIT** into subtasks,\
  \ tackle T{id}a, continue |\n| Cross-repo touches (workspace_repos: [...]) | **Run\
  \ the Clean Controller Gate on each repo in the touch set first.** If all pass (clean\
  \ or only owned paths dirty), proceed with the full task. Only skip if a required\
  \ repo is inaccessible on disk or has unrelated dirty paths that block a safe commit.\
  \ Note: `workspace_touch_policy: member_only` is a **write-scope limiter** (changes\
  \ land in the named member repo) — it is **NOT** a location gate requiring the agent\
  \ to run from inside the member repo. The controller implements `member_only` tasks\
  \ by writing to member on-disk paths after Clean Controller Gate passes. (BUG-098)\
  \ |\n| Design/product judgment required | **SKIP** — log as \"needs human decision\"\
  , continue |\n| Missing prereq infrastructure (e.g., file doesn't exist yet) | **SKIP**\
  \ — log as \"blocked by missing dep\", continue |\n\n**Only these items remain as\
  \ true pauses even in `--until-empty` mode:**\n\n- `ai_safe: false` — hard stop,\
  \ always\n- WPAC `[ORDER]` or `[CONFLICT]` inbox items — hard stop, always\n- Budget\
  \ exhausted — hard stop, always\n\nEverything else: **skip and continue.** The deferred\
  \ questions file is the skip ledger. The mission loop does NOT stop because a task\
  \ is hard, complex, or touches other repos.\n\n#### ⛔ CRITICAL — \"the remaining\
  \ queue looks hard\" is NOT a valid stop condition\n\n**The agent must scan tasks\
  \ individually, not assess the queue globally.** The following patterns are FORBIDDEN\
  \ as stop reasons in `--until-empty` mode:\n\n| Forbidden stop reason | What to\
  \ do instead |\n|---|---|\n| \"Most remaining tasks are cross-repo\" | Scan each\
  \ one. Run the Clean Controller Gate per repo. Proceed if repos are accessible and\
  \ clean. Most gald3r work IS cross-repo — blanket skipping cross-repo tasks defeats\
  \ the mission. |\n| \"Most remaining tasks need design judgment\" | Scan each one.\
  \ Skip the judgment-heavy ones. Keep looping. |\n| \"The queue looks like it's mostly\
  \ hard\" | This is not a scan. Do the scan. |\n| \"Nothing obvious is left\" | Verify\
  \ by actually reading every open/ task frontmatter. |\n| \"I recommend the user\
  \ seed more tasks\" | Only acceptable AFTER the loop has individually assessed and\
  \ skipped every remaining task. |\n\n**Required loop termination check in `--until-empty`\
  \ mode:**\n\nBefore writing a session checkpoint and stopping, the agent MUST be\
  \ able to answer YES to one of:\n1. Turn budget proxy: `turns_consumed >= ceil(turn_budget\
  \ * 0.75)` — checkpoint and resume.\n   This is the **deterministic** proxy for\
  \ context pressure (mirrors the T1547 fix in `g-go-go.md`).\n   Do NOT use self-reported\
  \ context fill percentage — it is unreliable (BUG-107).\n2. Budget exhausted\n3.\
  \ Hard stop condition hit (`ai_safe: false` or WPAC conflict)\n4. **Every single\
  \ task in `open/`, `in-progress/`, and `paused/` has been individually read and\
  \ individually either claimed, completed, or logged as a named skip in `_deferred_questions.md`**\n\
  \nA global queue assessment does not satisfy condition 4. If the agent has not read\
  \ every task file, it has not finished the loop.\n\n\n---\n\n## Write an effective\
  \ condition\n\nThe evaluator judges your condition against what the agent has surfaced\
  \ in the conversation. Write the condition as something the agent's own output can\
  \ demonstrate:\n\n| Good condition | Why |\n|---|---|\n| `all tests in example_desktop\
  \ pass and tsc exits 0` | Agent runs tests; output proves it |\n| `T{id} is marked\
  \ [✅] in TASKS.md` | Agent updates TASKS.md; file state proves it |\n| `desktop/\
  \ and docker/ removed from <gald3r_source> (git status clean)` | Agent runs git\
  \ rm + status; output proves it |\n| `CHANGELOG.md has entries for every completed\
  \ task this week` | Agent reads git log + CHANGELOG; diff proves it |\n\n**Tips:**\n\
  - One measurable end state per condition\n- State how the agent should prove it\
  \ (`tsc exits 0`, `git status clean`, `vitest: 0 failed`)\n- Add constraints that\
  \ must hold (`no other test files modified`, `no new bugs introduced`)\n- To bound\
  \ duration: add `or stop after N turns` to the condition text\n\n---\n\n## Steps\n\
  \n### Set (`@g-mission <condition>` or `@g-mission --from-task T{id}`)\n\n1. Parse\
  \ the condition text OR resolve from task:\n   - `--from-task T{id}`: read the task's\
  \ `title:` and acceptance criteria as the condition; set `linked_task: T{id}`\n\
  \   - Free-form: use the literal text after `@g-mission`\n2. Parse `--budget <N>`\
  \ if supplied (default: 30 iterations).\n3. Parse `--until-empty` if supplied; set\
  \ `mode: until-empty` in frontmatter (default: `mode: condition-only`).\n4. Write\
  \ `.gald3r/config/ACTIVE_MISSION.md`:\n   ```yaml\n   ---\n   id: mission-YYYYMMDDTHHMMSSZ\n\
  \   condition: \"<the condition text>\"\n   linked_task: T{id}          # or null\n\
  \   set_at: <ISO 8601 UTC>\n   turn_budget: 30             # overridden by --budget\
  \ N\n   turns_consumed: 0\n   last_eval_reason: \"\"\n   mode: condition-only  \
  \      # condition-only | until-empty\n   phase: gate                 # gate (working\
  \ toward condition) | drain (g-go-go clearing queue)\n   status: active        \
  \      # active | achieved | abandoned\n   set_by: <session or \"user\">\n   ---\n\
  \n   # Active Mission\n\n   **Condition**: <condition text>\n\n   ## Evaluator Notes\n\
  \   <!-- Evaluator appends reason after each turn -->\n   ```\n4. Set `@g-goal`\
  \ from the same condition (so `g-go` has the goal injected into context).\n5. Announce:\
  \ `\U0001F3AF Mission set: \"<condition>\" (budget: N turns)`\n6. **Immediately\
  \ begin**: run `@g-go-go` with the mission context injected.\n\n### Autonomous loop\
  \ (runs internally after each g-go-go iteration)\n\nAfter every `g-go` iteration\
  \ completes:\n\n1. **Evaluate**: the agent self-checks the condition against what\
  \ it has surfaced in the conversation:\n   - Run the stated verification command/check\
  \ if one was specified\n   - Read the relevant file state (TASKS.md, git status,\
  \ test output, etc.)\n   - Determine: does the condition hold? Yes / No + reason\n\
  2. **If NO**: append evaluator reason to `ACTIVE_MISSION.md` `## Evaluator Notes`,\
  \ increment `turns_consumed`, continue loop\n3. **If YES** (`mode: condition-only`):\n\
  \   - Update `ACTIVE_MISSION.md` `status: achieved`\n   - Clear `ACTIVE_GOAL.md`\
  \ (`@g-goal clear`)\n   - Report the **final mission summary** (see format below)\n\
  3. **If YES** (`mode: until-empty`, `phase: gate`):\n   - Update `ACTIVE_MISSION.md`\
  \ `phase: drain`\n   - Report: `✅ Gate condition met after N turns. Transitioning\
  \ to drain phase — clearing ai_safe task queue.`\n   - **Do NOT offer push here**\
  \ — the mission is still running; continue looping with `@g-go-go` semantics\n \
  \  - When the `ai_safe` queue is empty:\n     - Update `ACTIVE_MISSION.md` `status:\
  \ achieved`\n     - Clear `ACTIVE_GOAL.md`\n     - Report the **final mission summary**\
  \ (see format below)\n3. **If YES** (`mode: until-empty`, `phase: drain`): skip\
  \ re-evaluating the condition; check if `ai_safe` queue is empty\n   - If tasks\
  \ remain: claim next `ai_safe` task, continue loop — **do NOT offer push between\
  \ tasks**\n   - If queue empty: `status: achieved`, report the **final mission summary**\
  \ (see format below)\n#### Final mission summary format (used at `status: achieved`\
  \ only)\n\n```\n✅ Mission complete after N turns: \"<condition>\"\n\nTasks shipped:\
  \ T{id1} ({title}), T{id2} ({title}), ...\nCommits: {N} commits on {branch} — {first_sha}..{last_sha}\n\
  \nReview your changes, then push when ready:\n  git log origin/{branch}..HEAD --oneline\
  \   # review commit list\n  git push origin {branch}                  # publish\
  \ when satisfied\n```\n\n**Push offer rules:**\n- The push offer appears **once**\
  \ — in this final summary only\n- Session checkpoints do NOT include a push offer\
  \ (mission is still running)\n- Gate→drain transitions do NOT include a push offer\
  \ (still running)\n- Between-task completions do NOT include a push offer (still\
  \ running)\n- If the user says \"yes\" / \"go ahead\" / \"push it\" in reply to\
  \ this summary: push immediately\n\n4. **If budget exhausted** (`turns_consumed\
  \ >= turn_budget`):\n   - Update `status: abandoned`\n   - Surface: `⏸️ Mission\
  \ turn budget exhausted (N turns). Last evaluator note: <reason>. Run @g-mission\
  \ status to review, or @g-mission --budget N to extend.`\n   - Pause for user direction\
  \ — do NOT auto-extend\n\n### Status (`@g-mission status`)\n\nRead `.gald3r/config/ACTIVE_MISSION.md`\
  \ and display:\n\n```\n\U0001F3AF Mission status\nCondition:    <condition>\nLinked\
  \ task:  T{id} (or \"none\")\nSet at:       <set_at>\nTurns:        <turns_consumed>\
  \ / <turn_budget>\nStatus:       active | achieved | abandoned\nLast eval:    <last_eval_reason>\n\
  ```\n\nIf no mission file exists: `No active mission. Set one with @g-mission <condition>`\n\
  \n### Clear (`@g-mission clear`)\n\n1. Update `ACTIVE_MISSION.md` `status: abandoned`\
  \ (preserve audit trail; do not delete)\n2. Run `@g-goal clear`\n3. Confirm: `\U0001F6D1\
  \ Mission cleared.`\n\n---\n\n## Differences from related commands\n\n| Command\
  \ | When to use |\n|---|---|\n| `@g-goal` | Set a persistent goal that `g-go` reads;\
  \ manual iteration control |\n| `@g-go-go` | Run until the task queue is exhausted\
  \ (no explicit condition) |\n| `@g-mission` | Run until YOUR stated condition is\
  \ provably met; stop when done |\n| `@g-mission --until-empty` | Run until condition\
  \ met, THEN drain the full `ai_safe` queue; closest to `/goal` on other platforms\
  \ |\n\n---\n\n## Cross-repo and workspace safety\n\n### Declaring the mission's\
  \ blast radius (required for multi-repo conditions)\n\nIf the mission condition\
  \ touches more than one git root, declare the repos upfront:\n\n```\n@g-mission\
  \ all tests pass and tsc exits 0 --repos example_desktop,example_app\n@g-mission\
  \ T1218 cleanup complete --from-task T1218\n```\n\nWhen `--repos` is supplied, write\
  \ the list into `ACTIVE_MISSION.md` frontmatter as:\n```yaml\ntouch_repos: [example_desktop,\
  \ example_app]   # manifest repository.id values\n```\n\nWhen `--from-task T{id}`\
  \ is used, inherit `workspace_repos:` and `extended_touch_repos:` directly from\
  \ the task's frontmatter — no separate `--repos` needed.\n\nIf neither is supplied\
  \ and the condition mentions a member repo name, extract it and prompt the user\
  \ to confirm the blast radius before starting the loop.\n\n### Clean Controller\
  \ Gate — between every iteration\n\nBefore each new `g-go` iteration starts AND\
  \ before any coordinator shared write (TASKS.md, BUGS.md, CHANGELOG.md, review-result\
  \ commits), run the full Clean Controller Gate and member touch-set expansion:\n\
  \n1. Run `git status --short` at the orchestration root (e.g. <gald3r_source>)\n\
  2. For each repo in `touch_repos:`, also run `git status --short` at that root\n\
  3. If **any** root has unrelated dirty paths → **pause the mission** before the\
  \ next iteration; do not auto-commit unrelated changes; surface the exact dirty\
  \ paths and ask for direction\n4. If dirty paths are **exclusively safe gald3r housekeeping**\
  \ (task/bug status files, CHANGELOG entries owned by this mission) → the Gald3r\
  \ Housekeeping Commit Gate auto-commits them before the next iteration proceeds\
  \ (standard `chore(gald3r)` commit)\n\n### Member repo write rules (task files and\
  \ gald3r state)\n\nMember repos (declared in `workspace_manifest.yaml` with marker-only\
  \ `.gald3r/`) are **read targets only** during a mission:\n\n- **DO**: read member\
  \ repo source code, run tests in member repos, commit implementation changes to\
  \ member repos\n- **DO NOT**: write `.gald3r/` task files, BUGS.md, TASKS.md, or\
  \ any gald3r control-plane state into a member repo — that state lives in the controller\
  \ (<gald3r_source>) only\n- If a task spec has `workspace_repos: [member_id]`, the\
  \ implementing agent may write code to that member's git root but all task-status\
  \ writes go to the controller's `.gald3r/tasks/` and TASKS.md\n\n### ai_safe and\
  \ blast_radius gates\n\nThe mission loop respects per-task safety metadata:\n\n\
  | Task frontmatter | Mission behavior |\n|---|---|\n| `ai_safe: true` | Proceed\
  \ autonomously |\n| `ai_safe: false` | **Pause mission** before claiming this task;\
  \ surface to user: \"Task T{id} has `ai_safe: false` — manual review required before\
  \ autonomous execution. Approve or skip?\" |\n| `blast_radius: low` | Proceed |\n\
  | `blast_radius: medium` | Proceed; note in mission evaluator log |\n| `blast_radius:\
  \ high` | **Pause mission**; surface: \"Task T{id} has `blast_radius: high` — confirm\
  \ before proceeding\" |\n| `requires_verification: true` | Task must go through\
  \ `[\U0001F50D]` → independent verifier before mission counts it as done; mission\
  \ loop does NOT self-verify these |\n\n### WPAC inbox re-check cadence during long\
  \ missions\n\nWPAC inbox is checked:\n- At mission start (standard session-start\
  \ check)\n- Every 30 minutes of elapsed mission time (coordinator re-runs `g-hk-wpac-inbox-check.py\
  \ -BlockOnConflict`)\n- Before any coordinator shared write (TASKS.md, BUGS.md,\
  \ CHANGELOG)\n\nIf the inbox check returns `INBOX CONFLICT GATE` (exit code 2) at\
  \ any point mid-mission:\n- **Pause the loop immediately** — do not start the next\
  \ iteration\n- Surface: `⚠️ WPAC conflict detected mid-mission. Run @g-wpac-read\
  \ to resolve before mission continues.`\n- Preserve `ACTIVE_MISSION.md` with `status:\
  \ paused` (not abandoned) so the mission can resume after resolution\n\n### Resuming\
  \ a paused mission\n\n```\n@g-mission resume\n@g-mission resume --budget 300   \
  \ # override budget for an overnight long-run\n```\n\n1. Read `ACTIVE_MISSION.md`\
  \ — confirm `status: paused` OR `status: active` (session checkpoint, not true pause)\n\
  2. Re-run WPAC inbox check; confirm clean\n3. Re-run Clean Controller Gate on all\
  \ repos in `touch_repos:`\n4. Resume the loop from where it left off (condition\
  \ not yet met, budget not exhausted)\n5. If `--budget N` supplied on resume, update\
  \ `turn_budget:` in `ACTIVE_MISSION.md` and reset `turns_consumed: 0` for this session\
  \ only (accumulated prior turns are preserved in Evaluator Notes)\n\n**`ACTIVE_MISSION.md`\
  \ persists across Claude session resets.** If the CLI is killed, the terminal crashes,\
  \ or context fills mid-mission, the mission file survives. The user simply pastes\
  \ a new `@g-mission resume` prompt into the fresh session — no re-setup needed.\
  \ The agent reads the file and continues from the last checkpoint row.\n\n### Drain\
  \ phase task queue scan order\n\nWhen `mode: until-empty` and `phase: drain`, scan\
  \ for claimable tasks in this order:\n\n1. `.gald3r/tasks/open/` — all files with\
  \ `ai_safe: true` and `status: pending`\n2. `.gald3r/tasks/in-progress/` — tasks\
  \ that were started but not finished (re-claim and continue)\n3. `.gald3r/tasks/paused/`\
  \ — only if the pause reason is resolvable within mission scope\n\nWithin each folder,\
  \ claim in priority order: `critical` → `high` → `medium` → `low`. Within same priority,\
  \ claim lowest task ID first (oldest work first).\n\n### Session-end checkpoint\
  \ (NOT a \"pause\")\n\n#### Context threshold — when to trigger the checkpoint\n\
  \n**Trigger the session checkpoint using the deterministic turn-budget proxy: `turns_consumed\
  \ >= ceil(turn_budget * 0.75)`.** Both values are read from `ACTIVE_MISSION.md`,\
  \ so the trigger is always observable and does not depend on the model's self-reported\
  \ context fill percentage (the unreliable sensor that caused BUG-107; T1547 replaced\
  \ the same sensor in `g-go-go.md`). The proxy targets ~75% of the per-session turn\
  \ budget, which is the correct balance:\n- **Too low (proxy fires before ~33% of\
  \ budget)**: wastes session capacity; the next resume starts with startup overhead\
  \ (rules + AGENTS.md + ACTIVE_MISSION.md), so checkpointing too early leaves almost\
  \ no usable room per session\n- **Too high (proxy never fires before budget exhaustion)**:\
  \ risks running out of room mid-task or mid-checkpoint write\n- **`ceil(turn_budget\
  \ * 0.75)` target**: leaves a turn margin to finish the current in-flight task and\
  \ write the checkpoint cleanly\n\n**Do NOT stop early because:**\n- The task queue\
  \ has hard tasks remaining (split and continue instead)\n- The current task took\
  \ more turns than expected\n- A prior task's commit added context\n- You believe\
  \ context \"feels full\" — trust the deterministic proxy, not a self-reported fill\
  \ estimate\n\n**DO stop and write the checkpoint when:**\n- The turn-budget proxy\
  \ fires (`turns_consumed >= ceil(turn_budget * 0.75)`)\n- The current task just\
  \ completed and committed (natural task boundary) AND `turns_consumed >= ceil(turn_budget\
  \ * 0.6)`\n- Budget is exhausted\n\n#### Checkpoint procedure\n\nWhen the checkpoint\
  \ condition triggers:\n\n1. Finish the task currently in-flight — do NOT checkpoint\
  \ mid-task, leaving work uncommitted\n2. Write a **session checkpoint** row to `ACTIVE_MISSION.md\
  \ ## Evaluator Notes` — include tasks completed, commits made, and next task to\
  \ claim\n3. Keep `status: active` (do NOT change to `paused` or `paused-partial`)\n\
  4. Do NOT write a \"Mission Report\" with \"paused-partial\" framing — this misleads\
  \ the user into thinking the mission stalled\n5. The user resumes with `@g-mission\
  \ resume`; the agent reads ACTIVE_MISSION.md and continues immediately\n\n**Correct\
  \ session-end output format:**\n```\n✅ Session checkpoint — N tasks shipped (T{id1},\
  \ T{id2}, ...), M commits on {branch}. Working tree clean.\nEXIT_REASON: <exit_code>\
  \ — <one-line rule reference>\nNext task on resume: T{next_id} ({title}).\nRun @g-mission\
  \ resume to continue.\n```\n\n**Exit codes (exactly one must appear on every exit/pause/checkpoint):**\n\
  \n| Code | Trigger | What it means |\n|---|---|---|\n| `CONTEXT_GATE` | `turns_consumed`\
  \ ≥ `ceil(turn_budget * 0.75)` | Normal session boundary — deterministic turn-budget\
  \ proxy hit the checkpoint threshold (see §Session-end checkpoint). NOT a self-reported\
  \ context-fill %. |\n| `BUDGET_EXHAUSTED` | `turns_consumed` ≥ `turn_budget` | Turn\
  \ budget from `--budget N` consumed; resume resets counter |\n| `QUEUE_EMPTY` |\
  \ No claimable `ai_safe: true` tasks remain | Drain phase complete; all open ai_safe\
  \ tasks claimed or skipped |\n| `CONDITION_MET` | Evaluator check passes | Mission\
  \ condition provably achieved; final summary follows |\n| `WPAC_CONFLICT` | `g-hk-wpac-inbox-check.py`\
  \ exits 2 | INBOX conflict gate fired mid-mission; run `@g-wpac-read` to resolve\
  \ |\n| `AI_SAFE_BLOCKED` | Next task has `ai_safe: false` | Human review required\
  \ before next task can be claimed autonomously |\n| `BLAST_RADIUS_HIGH` | Next task\
  \ has `blast_radius: high` | Explicit user approval required before proceeding |\n\
  | `CLEAN_GATE_BLOCKED` | Dirty unrelated paths in touch-set | Unrelated uncommitted\
  \ changes in orchestration root or a member repo; commit/stash them first |\n| `DEPENDENCY_BLOCKED`\
  \ | All remaining tasks have unmet deps | Every remaining queued task is waiting\
  \ on another open task — no claimable work exists |\n| `HUMAN_DECISION_REQUIRED`\
  \ | Design question can't be inferred | A task requires a user choice that cannot\
  \ be resolved from existing docs/code/specs |\n| `SAFETY_GATE` | Schema migration\
  \ / destructive DDL / `git rm` | Non-autonomous operation encountered; see §What\
  \ cannot span a mission autonomously |\n\n**Rules:**\n- Every exit message MUST\
  \ include exactly one `EXIT_REASON:` line\n- `CONTEXT_GATE` and `BUDGET_EXHAUSTED`\
  \ are **non-blocking** — mission stays `status: active`; user resumes with `@g-mission\
  \ resume`\n- All other codes set `status: paused` in `ACTIVE_MISSION.md`; re-run\
  \ pre-flight checks on resume\n- Do NOT combine multiple codes — pick the **primary**\
  \ trigger\n- Include the specific triggering rule or value in the one-liner: e.g.,\
  \ `CONTEXT_GATE — turns_consumed=23, threshold=ceil(30*0.75)=23` or `AI_SAFE_BLOCKED\
  \ — T1199 has ai_safe: false`\n\n**Incorrect session-end output (do NOT produce):**\n\
  ```\nMission Report — paused-partial\nStatus: paused-partial — substantive progress,\
  \ queue not fully empty\n17 tasks deferred...\n```\n\n### What cannot span a mission\
  \ autonomously (always stops for user)\n\n- Tasks with `ai_safe: false`\n- Tasks\
  \ with `blast_radius: high`\n- WPAC `[ORDER]` or `[CONFLICT]` inbox items arriving\
  \ mid-mission\n- Any dirty unrelated paths in the member touch-set that aren't owned\
  \ by this mission\n- Schema migrations or destructive DDL in example_app\n- Removals\
  \ from git (`git rm`) of non-scratch files\n\n### ⛔ HARD RULE: \"Scope too large\"\
  \ is NEVER a valid defer reason\n\n**Deferring a task because it is large or complex\
  \ is FORBIDDEN in mission mode.** The only valid defer reasons are the items listed\
  \ above. If you find yourself writing \"scope too large\", \"multi-hundred-line\"\
  , \"not pilot-sized\", \"bigger than one session\", or any equivalent — STOP. That\
  \ is a SPLIT, not a DEFER.\n\n**Required response to any over-sized task:**\n\n\
  1. Immediately decompose it: create `T{id}a`, `T{id}b`, etc. via `@g-task-add`\n\
  2. Mark the parent task `status: speccing` with a `#decomposed-into: [T{id}a, T{id}b,\
  \ ...]` note\n3. Claim and implement `T{id}a` (the smallest independently shippable\
  \ slice) in the current iteration\n4. Continue the mission loop — do NOT write a\
  \ summary and stop\n\n**The same rule applies to cross-repo tasks:** if a task nominally\
  \ touches `workspace_repos: [example_desktop]` but its first AC is purely `<gald3r_source>`\
  \ documentation, spec-writing, or scaffolding — do the `<gald3r_source>`-only portion\
  \ as `T{id}a`, file `T{id}b` for the cross-repo implementation, and continue.\n\n\
  **What IS a valid reason to skip (not defer) a task and keep looping:**\n- `ai_safe:\
  \ false` — log it, skip it, move to next task\n- `blast_radius: high` — surface\
  \ to user mid-mission, skip it if user does not respond within the same turn, log\
  \ the skip\n- Requires a human design decision that genuinely cannot be inferred\
  \ from existing docs/code — log, skip, move on\n- ALL PREREQ tasks are still open\
  \ (not just \"complex\" — literally blocked by unfinished dependency)\n\n**Skipped\
  \ tasks stay in the queue.** Deferred tasks get a subtask filed. The mission loop\
  \ NEVER exits because tasks are hard.\n\n## Full gald3r citizenship (MANDATORY inside\
  \ the loop)\n\n`g-mission` is NOT a raw execution bypass. Every `g-go` iteration\
  \ inside the mission loop runs as a full gald3r citizen. This means:\n\n### Task\
  \ and bug management (still required)\n- **New tasks**: if work is discovered that\
  \ isn't tracked, create a task via `g-task-add` before starting it — even mid-mission\n\
  - **Bug discovery gate**: any pre-existing bug encountered must get a `BUG-NNN`\
  \ entry + inline annotation — mission mode does not exempt this (`g-rl-35`)\n- **Todo/stub\
  \ gate**: any stub or TODO written must be annotated `TODO[TASK-X→TASK-Y]` with\
  \ a follow-up task filed before the iteration is marked complete (`g-rl-34`)\n-\
  \ **Code changes require task or bug reference** — no orphan code changes, even\
  \ inside a mission run\n\n### Backlog awareness (active, not passive)\nThe agent\
  \ operating under a mission actively manages the path to the condition:\n- **Mandatory\
  \ split** (hard rule — see above): if a task is too large for one iteration, IMMEDIATELY\
  \ decompose into subtasks and tackle subtask 1. Do NOT log the parent as deferred.\
  \ Do NOT write a summary and stop.\n- **Resequencing**: if the optimal order to\
  \ reach the condition changes (e.g., a blocker surfaces), reorder the pending task\
  \ queue — update TASKS.md priority/order accordingly\n- **Dependency surfacing**:\
  \ if a task is blocked by another that doesn't yet exist, create the blocking task\
  \ and sequence it before the blocked one\n- **Condition narrowing**: as work progresses,\
  \ the agent may note in `ACTIVE_MISSION.md ## Evaluator Notes` which sub-conditions\
  \ are already met and which remain, helping each iteration focus precisely\n- **Session\
  \ boundaries do NOT pause a mission**: when the agent's context fills or a session\
  \ ends naturally, the ACTIVE_MISSION.md remains `status: active`. The user resumes\
  \ with `@g-mission resume`. The agent does NOT write a \"paused-partial\" summary\
  \ that implies the work stalled — it writes a \"session checkpoint\" that shows\
  \ progress made and the next task to claim on resume.\n\n### What the mission changes\
  \ (only)\n- The **exit criterion**: instead of \"queue exhausted,\" the loop exits\
  \ when the stated condition is provably met\n- The **context anchor**: each iteration\
  \ opens with `MISSION: <condition>` injected alongside the goal, keeping every iteration\
  \ aligned\n- The **turn accounting**: `turns_consumed` increments each major iteration;\
  \ budget exhaustion pauses rather than auto-extends\n\n### Context efficiency (T1549\
  \ — why g-mission needs no per-iteration compression step)\n\n`g-mission`'s own\
  \ coordinator context does **not** accumulate quadratically the way pre-T1547\n\
  `g-go-go` did, and therefore does **not** need a g-mission-specific inter-iteration\
  \ compression\nstep. The reasons are structural:\n\n1. **The outer loop is across\
  \ sessions, not within one.** The `mission-overnight.ps1` wrapper\n   relaunches\
  \ a fresh `claude -p` process each session, so context resets between iterations\
  \ of\n   the mission loop. Per-session accumulation is linear, not quadratic.\n\
  2. **Per-session heavy work is a single `@g-go-go` call**, which now compresses\
  \ its own\n   inter-iteration history internally (T1547: `completed_iterations[]`\
  \ summaries + raw-output\n   discard). g-mission inherits that fix — it does not\
  \ re-implement it.\n3. **g-mission's durable state is file-backed, not conversation-backed.**\
  \ Mission progress lives\n   in `ACTIVE_MISSION.md` (`turns_consumed`, `phase`,\
  \ append-only `## Evaluator Notes`), which\n   survives session resets. The coordinator\
  \ does not re-read or re-inject a growing in-conversation\n   transcript each iteration;\
  \ it reads the compact mission file plus fresh TASKS.md/git state.\n4. **The session\
  \ boundary is the deterministic turn-budget proxy** (`turns_consumed >=\n   ceil(turn_budget\
  \ * 0.75)`), so a long single-session run checkpoints and hands off to a fresh\n\
  \   session well before raw history can saturate — without relying on the unreliable\
  \ self-reported\n   context sensor (BUG-107).\n\nIf a future change makes g-mission\
  \ run many `@g-go-go` calls inside a *single* session without a\nwrapper relaunch,\
  \ revisit this and add a compression step analogous to the g-go-go LOOP\n`[INTER-ITERATION\
  \ COMPRESSION]` step. Under the current architecture that step would be redundant.\n\
  Everything else — safety gates, gald3r housekeeping commits, WPAC inbox checks,\
  \ review checkpoints, member marker invariants — applies without modification.\n\
  \n## Safety rules\n\n- Never auto-extend a turn budget — always pause and surface\
  \ the reason when budget is exhausted\n- Never skip the WPAC INBOX gate — even in\
  \ mission mode, inbox conflicts stop the loop\n- Never mark mission `achieved` without\
  \ running the verification check (`tsc`, `vitest`, `git status`, etc.) — evaluator\
  \ must see actual command output\n- Coordinator-owned gald3r writes still happen\
  \ after each g-go iteration (housekeeping commit gate applies)\n- Mission does not\
  \ suppress the bug-discovery gate, todo-completion gate, or code-change-requires-task\
  \ gate\n\n### ⛔ NO `git push` without explicit goal authorization\n\n**`g-mission`\
  \ NEVER runs `git push` autonomously.** Commits are local and reversible — pushes\
  \ are public and permanent. The mission accumulates commits freely as its audit\
  \ trail, but remote publication requires explicit human authorization.\n\n**The\
  \ only way push is permitted inside a mission:**\n- The mission's condition statement\
  \ explicitly includes push (e.g., `\"ship and push T1259\"`, `\"publish to GitHub\"\
  `, `\"push on completion\"`)\n- The user issues a separate `@g-git-push` command\
  \ after reviewing commits\n\n**What this means in practice:**\n- After each task\
  \ commit: stay local, continue the loop\n- At session checkpoint: stay local, report\
  \ commits ready to push\n- At mission `achieved`: output the final mission summary\
  \ with commit list and push offer (see format above). Do not offer push at any earlier\
  \ point.\n- Never infer push intent from words like \"ship\", \"deploy\", \"release\"\
  , or \"publish a skill\" — those mean the file work, not the remote push\n\n---\n\
  \n## Non-interactive / Claude Code equivalent\n\nClaude Code uses `/goal` for this\
  \ pattern. In Cursor, `@g-mission` is the equivalent:\n\n```\n# Claude Code\n/goal\
  \ all tests in test/auth pass and the lint step is clean\n\n# gald3r / Cursor  \n\
  @g-mission all tests in example_desktop pass and tsc exits 0\n```\n\n---\n\n## Related\n\
  \n- Spec: see `.gald3r/tasks/` for T{id} once created\n- Config: `.gald3r/config/ACTIVE_MISSION.md`\n\
  - Depends on: `@g-goal`, `@g-go-go`, `@g-go`"
prompt: Run the gald3r `g-mission` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-mission, e.g. quoted text or --flag values,
    exactly as you would type them after the command name.
