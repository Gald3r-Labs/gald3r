version: 1.0.0
title: g-wrkspc-adopt
description: 'Adopt an existing gald3r project into Workspace-Control: $ARGUMENTS'
instructions: "Adopt an existing gald3r project into Workspace-Control: $ARGUMENTS\n\
  \n## What This Command Does\n\nBrings an existing gald3r-managed project (one that\
  \ already has a populated `.gald3r/` folder with tasks, bugs, features, PRDs, subsystem\
  \ specs, plans, constraints, and linking data) into the current Workspace-Control\
  \ control project. Plans or applies the adoption; never writes the source project's\
  \ `.gald3r/`. Delegates to `g-skl-workspace` operation `ADOPT` in one of three modes:\
  \ discover (preflight + inventory), dry-run (writes the plan report), or apply (gated\
  \ state change).\n\nThe full design lives at `docs/20260426_090736_Cursor_WORKSPACE_CONTROL_PROJECT_ADOPTION.md`.\n\
  \n## Adoption Mode\n\nThis command is the surface for the **`populated_gald3r_adoption`**\
  \ mode — adoption of an existing full gald3r project that already manages its own\
  \ active task/bug/feature/PRD history. This mode is mutually exclusive with the\
  \ other three Workspace-Control adoption-shaped operations:\n\n- `clean_member_registration`\
  \ → use `@g-wrkspc-member-add`\n- `spawned_member_creation` → use `@g-wrkspc-spawn`\n\
  - `marker_only_member_repair` → use `MEMBER_MARKER_BOOTSTRAP/REMEDIATE/VALIDATE`\n\
  \nPick exactly one mode before any preflight runs. If the candidate path is ambiguous\
  \ (e.g. `.gald3r/.identity` exists but no `TASKS.md`), this command refuses and\
  \ asks the user to choose explicitly. It never silently routes a populated source\
  \ through SPAWN or MEMBER_ADD.\n\nThe mode label `populated_gald3r_adoption` is\
  \ recorded in:\n\n- the dry-run plan front-matter (`adoption_mode: populated_gald3r_adoption`)\n\
  - the apply ledger\n- the manifest member entry's `adoption.adoption_mode` field\
  \ after apply\n- the active task's frontmatter when the task drives adoption work\n\
  \n## Modes\n\n- `--discover {path}` — preflight + read-only inventory; writes nothing.\n\
  - `--dry-run --source {path} --as {member_id}` — generates `.gald3r/reports/adoption_{adopt-id}.md`.\
  \ Writes only the report file.\n- `--apply --source {path} --as {member_id} --plan\
  \ {report-path}` — gated apply. Writes only the control project's `.gald3r/` and\
  \ the workspace manifest.\n\nDry-run is the default. Apply requires explicit `--apply`,\
  \ a valid `--plan` path, plan freshness, signature match, and explicit user confirmation.\n\
  \n## Required Arguments\n\n| Mode      | Required                              \
  \                            |\n|-----------|-------------------------------------------------------------------|\n\
  | discover  | `--discover <path>`                                              \
  \ |\n| dry-run   | `--source <path>`, `--as <member_id>`                       \
  \      |\n| apply     | `--source <path>`, `--as <member_id>`, `--plan <report-path>`\
  \     |\n\nOptional flags (apply mode):\n\n- `--plan-max-age-hours N` (default 24)\n\
  - `--reuse-id` (reuse the plan's `adoption_operation_id` even if recomputed value\
  \ differs — for resumes only)\n- `--allow-readopt` (re-adopt a member already in\
  \ `lifecycle_status: active`)\n\n## Workflow\n\n1. Activate `g-skl-workspace`.\n\
  2. Default to `ADOPT --dry-run` semantics unless `$ARGUMENTS` includes `--discover`\
  \ or `--apply`.\n3. Run preflight (Phase 1):\n   - Manifest exists and parses cleanly.\n\
  \   - Source `{path}` exists, is reachable, is an independent git root distinct\
  \ from the control project, is not a symlink/junction, contains `.gald3r/.identity`\
  \ (or `.project_id`) and `.gald3r/TASKS.md`.\n   - Source path is not nested inside\
  \ the control project working tree.\n4. In discover mode: print inventory summary;\
  \ stop.\n5. In dry-run mode: write `.gald3r/reports/adoption_{adopt-id}.md`; print\
  \ summary; stop.\n6. In apply mode: re-run preflight + discovery; verify plan freshness\
  \ and signature; verify the active task authorizes adoption work for `{member_id}`;\
  \ verify manifest write policy via `ENFORCE_SCOPE`; then write provenance-tagged\
  \ control-project records, archive entries (Task 204 buckets), reference stubs,\
  \ manifest member update, and the apply ledger; print result.\n\n## Adoption Operation\
  \ ID Format\n\n```text\nadopt-YYYYMMDD-HHMMSS-{project_slug}\n```\n\nUTC timestamp\
  \ at the start of discovery, plus a slug derived from the source `.gald3r/.identity`\
  \ `project_name`.\n\n## Provenance (every imported / control-visible record)\n\n\
  ```yaml\nadoption:\n  source_project_id: \"\"\n  source_project_name: \"\"\n  source_project_path:\
  \ \"\"\n  source_artifact_type: \"\"        # task | bug | feature | prd | subsystem\
  \ | constraint | plan | linking\n  source_artifact_id: \"\"\n  source_artifact_path:\
  \ \"\"\n  adopted_as_id: \"\"\n  adoption_operation_id: \"\"\n  adoption_class:\
  \ \"\"              # active-control-visible | archived-reference | link-only |\
  \ merge-candidate | conflict-deferred\n  member_id: \"\"\n```\n\nProvenance fields\
  \ are never stripped on subsequent edits.\n\n## Active Index Visibility\n\nActive\
  \ imported tasks and bugs (class `active-control-visible`) appear in `.gald3r/TASKS.md`\
  \ and `.gald3r/BUGS.md` with an `[adopted:{member_id}]` prefix appended to the existing\
  \ emoji block. Terminal items go straight to the Task 204 archive buckets and never\
  \ cross the active index.\n\n## Archive Routing for Terminal Imports\n\nCompleted\
  \ tasks and resolved bugs route through the Task 204 archive structure:\n\n- `.gald3r/archive/archive_tasks_{range}.md`\
  \ and `.gald3r/archive/archive_bugs_{range}.md` get a dedicated `## Adopted from\
  \ {member_id} ({adoption_operation_id})` section per adoption.\n- Bucket allocation\
  \ by archive entry ordinal (T204 rule), not by original task/bug ID.\n- Archived\
  \ files at `.gald3r/archive/tasks/tasks_{range}/task{adopted_id}_{slug}_adopted.md`\
  \ (and bug equivalent), with BOTH the standard `archive:` block AND the `adoption:`\
  \ block in frontmatter.\n\n## Manifest Member Status Update\n\nAfter successful\
  \ apply, the manifest member entry for `{member_id}` is updated atomically with\
  \ the apply transaction. Adds `lifecycle_status: adopted`, `repo_role: external_gald3r_project`,\
  \ and an `adoption:` block recording the operation ID, plan path, apply ledger path,\
  \ and per-type artifact counts. The manifest update is registry-only; no member\
  \ repository file is touched.\n\n## Safety Boundaries\n\n- Dry-run is the default;\
  \ apply requires explicit `--apply` AND a valid `--plan` path.\n- The source project's\
  \ `.gald3r/` is opened read-only at every phase. ADOPT never writes the source.\n\
  - No silent overwrite of control-project artifacts; collisions must be resolved\
  \ by an explicit plan decision.\n- Member repository files are never modified by\
  \ ADOPT (member-repo writes still require a separate task with explicit `workspace_repos`\
  \ authorization).\n- PRD freeze gate (g-rl-33) is honored: imported `released` PRDs\
  \ land frozen with an `adopted: true` change-log entry.\n- Apply is transactional;\
  \ failure rolls back partial writes and records the rollback in the apply ledger.\n\
  \n## Refusals\n\nAny of the following raise a `BLOCK` finding and abort:\n\n**Preflight\
  \ / source shape**\n\n- `BLOCK adoption_preflight_failed`\n- `BLOCK source_not_independent_git_root`\n\
  - `BLOCK source_gald3r_minimum_missing` — `.gald3r/.identity` (or legacy `.project_id`)\
  \ AND `TASKS.md` are required\n- `BLOCK source_gald3r_unreadable` — source `.gald3r/`\
  \ exists but cannot be read (permissions, locked, antivirus)\n- `BLOCK source_identity_ambiguous`\
  \ — missing `project_id`/`project_name`, conflicting identity files, or project_id\
  \ collision with controller without `--allow-id-collision`\n- `BLOCK source_inside_control_project`\n\
  - `BLOCK source_symlink_or_junction`\n\n**Plan / apply gate**\n\n- `BLOCK adoption_member_already_active_no_readopt_flag`\n\
  - `BLOCK adoption_plan_missing`\n- `BLOCK adoption_plan_stale`\n- `BLOCK adoption_plan_signature_mismatch`\n\
  - `BLOCK adoption_apply_without_explicit_flag`\n- `BLOCK adoption_destination_collision`\n\
  - `BLOCK adoption_required_field_missing`\n\n**Repository state at apply time**\n\
  \n- `BLOCK source_repo_dirty_apply_mode` — uncommitted changes / merge in progress\
  \ / pending worktrees on source; supply `--allow-source-dirty` or commit first\n\
  - `BLOCK control_repo_dirty_apply_mode` — controller has uncommitted changes outside\
  \ the writes ADOPT itself plans, and `--require-clean-controller` was supplied\n\
  - `BLOCK wpac_conflict_gate_unresolved` — open `[CONFLICT]` in inbox; resolve via\
  \ `@g-wpac-read` first\n\n**Boundary preservation**\n\n- `BLOCK adoption_member_repo_write_attempted`\n\
  - `BLOCK adoption_manifest_write_policy_refused`\n- `BLOCK adoption_controller_manifest_unparseable`\n\
  \n## Usage Examples\n\n```text\n@g-wrkspc-adopt --discover <ECOSYSTEM_ROOT>/example_app\n\
  @g-wrkspc-adopt --dry-run --source <ECOSYSTEM_ROOT>/example_app --as example_app\n\
  @g-wrkspc-adopt --apply --source <ECOSYSTEM_ROOT>/example_app --as example_app --plan\
  \ .gald3r/reports/adoption_adopt-20260426-091500-example_app.md\n```\n\n## Cross-References\n\
  \n- Skill: `g-skl-workspace` operation `ADOPT` (sub-modes `ADOPT_DISCOVER`, `ADOPT_DRY_RUN`,\
  \ `ADOPT_APPLY`).\n- Design doc: `docs/20260426_090736_Cursor_WORKSPACE_CONTROL_PROJECT_ADOPTION.md`.\n\
  - Sample dry-run fixture: `.gald3r/reports/adoption_dryrun_sample.md`.\n- Archive\
  \ routing: Task 204 (`@g-task-archive`, `@g-bug-archive`).\n- Manifest registry:\
  \ `.gald3r/linking/workspace_manifest.yaml`.\n- WPAC adoption (separate, complementary):\
  \ `@g-wpac-adopt` registers parent/child topology for cross-project messaging; this\
  \ command updates Workspace-Control state."
prompt: Run the gald3r `g-wrkspc-adopt` command as described in the instructions.
extensions: []
parameters:
- key: args
  input_type: string
  requirement: optional
  description: Free-form arguments for g-wrkspc-adopt, e.g. quoted text or --flag
    values, exactly as you would type them after the command name.
